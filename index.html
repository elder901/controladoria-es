async function renderBalP3(){
  var fp=document.getElementById('fp');
  fp.innerHTML='<div class="loading">Carregando balancetes para comparacao...</div>';

  var lista=ARQ_BAL.tejotao;
  if(!lista.length){fp.innerHTML='<div class="errmsg">Nenhum balancete disponivel.</div>';return;}

  // mes selecionado (padrao: ultimo)
  if(!balAnState.mes) balAnState.mes=lista[lista.length-1];
  var arqAtual=balAnState.mes;
  var m=arqAtual.match(/bal(\d{2})(\d{2})\.Html/i);
  if(!m){fp.innerHTML='<div class="errmsg">Arquivo invalido.</div>';return;}
  var mm=parseInt(m[1]),yy=parseInt(m[2]);

  // derivar: mes anterior e mesmo mes ano anterior
  var mmAnt=mm===1?12:mm-1, yyAnt=mm===1?yy-1:yy;
  var arqAnt=balArqPorMMYY(mmAnt,yyAnt);
  var arqAA=balArqPorMMYY(mm,yy-1);

  var balAtual=await loadBAL(arqAtual);
  var balAnt=arqAnt?await loadBAL(arqAnt):null;
  var balAA=arqAA?await loadBAL(arqAA):null;
  if(!balAtual){fp.innerHTML='<div class="errmsg">Erro ao carregar balancete atual.</div>';return;}

  function liq(c){return c?((c.total.deb||0)-(c.total.cred||0)):null;}
  function acum(c){return c?(c.total.sf||0):null;}
  function mapa(bal){
    var mp={};
    if(bal)for(var i=0;i<bal.contas.length;i++){var c=bal.contas[i];if(c.classif.indexOf('3.3')===0)mp[c.classif]=c;}
    return mp;
  }
  var mAtual=mapa(balAtual), mAnt=mapa(balAnt), mAA=mapa(balAA);

  // total 3.3 para AV%
  var tot33=mAtual['3.3']?liq(mAtual['3.3']):null;
  if(tot33==null){ // fallback: soma das NN
    tot33=0;
    for(var k in mAtual){if(mAtual[k].tipo==='NN')tot33+=liq(mAtual[k])||0;}
  }
  var tot33Ac=mAtual['3.3']?acum(mAtual['3.3']):null;
  if(tot33Ac==null){tot33Ac=0;for(var k2 in mAtual){if(mAtual[k2].tipo==='NN')tot33Ac+=acum(mAtual[k2])||0;}}

  var fM=function(v){if(v==null||isNaN(v))return'--';var a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+(a/1e6).toFixed(2).replace('.',',')+'M';if(a>=1e3)return s+(a/1e3).toFixed(1).replace('.',',')+'k';return s+a.toFixed(0);};
  var fH=function(atual,base){
    if(atual==null||base==null||base===0)return'<span style="color:var(--muted)">--</span>';
    var p=(atual/base-1)*100;
    var cor=p>5?'var(--bad)':p<-5?'var(--good)':'var(--muted)';
    return '<span style="color:'+cor+';font-weight:600">'+(p>=0?'+':'')+p.toFixed(1).replace('.',',')+'%</span>';
  };
  var fAV=function(v,tot){return(v==null||!tot)?'--':(v/tot*100).toFixed(2).replace('.',',')+'%';};

  // opcoes de mes
  var opts='';
  for(var i=lista.length-1;i>=0;i--){
    opts+='<option value="'+lista[i]+'"'+(lista[i]===arqAtual?' selected':'')+'>'+rotBAL(lista[i])+'</option>';
  }

  var rotAtual=rotBAL(arqAtual), rotAnt=arqAnt?rotBAL(arqAnt):'--', rotAA=arqAA?rotBAL(arqAA):'--';
  var anoAtual='20'+('0'+yy).slice(-2), anoAA='20'+('0'+(yy-1)).slice(-2);

  // montar linhas na ordem do plano de contas
  var linhas='';
  var busca=balAnState.busca.toLowerCase();
  for(var i2=0;i2<balAtual.contas.length;i2++){
    var c=balAtual.contas[i2];
    if(c.classif.indexOf('3.3')!==0)continue;
    var ehTT=c.tipo==='TT';
    if(balAnState.soGrupos&&!ehTT)continue;
    if(busca&&c.descricao.toLowerCase().indexOf(busca)<0&&c.classif.indexOf(busca)<0)continue;
    var vAtual=liq(c);
    if(!ehTT&&Math.abs(vAtual||0)<0.01&&Math.abs(acum(c)||0)<0.01)continue; // pular zeradas
    var cAnt=mAnt[c.classif]||null, cAA=mAA[c.classif]||null;
    var vAnt=liq(cAnt), vAA=liq(cAA), vAc=acum(c), vAcAA=acum(cAA);
    var nivel=c.classif.split('.').length;
    var pad=(nivel-2)*14;
    var st=ehTT?'font-weight:700;background:var(--soft)':'';
    linhas+='<tr style="'+st+'">'+
      '<td style="padding-left:'+(8+pad)+'px;white-space:nowrap"><span style="color:var(--muted);font-size:10px">'+c.classif+'</span> '+c.descricao.substring(0,42)+'</td>'+
      '<td class="cv" style="text-align:right">'+fM(vAtual)+'</td>'+
      '<td style="text-align:right;font-size:11px">'+fAV(vAtual,tot33)+'</td>'+
      '<td class="cv" style="text-align:right;color:var(--muted)">'+fM(vAnt)+'</td>'+
      '<td style="text-align:right;font-size:11px">'+fH(vAtual,vAnt)+'</td>'+
      '<td class="cv" style="text-align:right;color:var(--muted)">'+fM(vAA)+'</td>'+
      '<td style="text-align:right;font-size:11px">'+fH(vAtual,vAA)+'</td>'+
      '<td class="cv" style="text-align:right">'+fM(vAc)+'</td>'+
      '<td style="text-align:right;font-size:11px">'+fAV(vAc,tot33Ac)+'</td>'+
      '<td class="cv" style="text-align:right;color:var(--muted)">'+fM(vAcAA)+'</td>'+
      '<td style="text-align:right;font-size:11px">'+fH(vAc,vAcAA)+'</td>'+
      '</tr>';
  }

  fp.innerHTML=
    '<div class="toolbar" style="flex-wrap:wrap;gap:12px;align-items:flex-end">'+
    '<div class="tg"><label>Mes de referencia</label>'+
    '<select onchange="balAnState.mes=this.value;renderBalP3()">'+opts+'</select></div>'+
    '<div class="tg"><label>Buscar conta</label>'+
    '<input type="text" value="'+balAnState.busca+'" placeholder="nome ou codigo" '+
    'onchange="balAnState.busca=this.value;renderBalP3()" style="padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px"></div>'+
    '<label style="display:flex;align-items:center;gap:6px;font-size:12px;padding-bottom:8px;cursor:pointer">'+
    '<input type="checkbox"'+(balAnState.soGrupos?' checked':'')+' onchange="balAnState.soGrupos=this.checked;renderBalP3()"> Somente totalizadores</label>'+
    '<div style="flex:1"></div>'+
    '<button class="dre-fs-btn" onclick="exportBalP3CSV()"><span>&#11015;</span> CSV</button>'+
    '<button class="dre-fs-btn" onclick="dreToggleFS(&quot;bal-p3-wrap&quot;)"><span>&#9974;</span> Fullscreen</button>'+
    '</div>'+
    '<div class="section" id="bal-p3-wrap">'+
    '<div class="shead"><h2>Analitico de Despesas &mdash; Grupo 3.3</h2>'+
    '<span class="legend">Valores liquidos (debitos - creditos) &middot; Tejotao</span></div>'+
    '<div class="twrap"><table id="bal-p3-tabela"><thead>'+
    '<tr><th rowspan="2" style="min-width:260px;text-align:left">Conta</th>'+
    '<th colspan="2">Mes atual ('+rotAtual+')</th>'+
    '<th colspan="2">Mes anterior ('+rotAnt+')</th>'+
    '<th colspan="2">Mesmo mes AA ('+rotAA+')</th>'+
    '<th colspan="2">Acumulado '+anoAtual+'</th>'+
    '<th colspan="2">Acumulado '+anoAA+'</th></tr>'+
    '<tr><th>Valor</th><th>A.V.%</th><th>Valor</th><th>A.H.%</th><th>Valor</th><th>A.H.%</th><th>Valor</th><th>A.V.%</th><th>Valor</th><th>A.H.%</th></tr>'+
    '</thead><tbody>'+linhas+'</tbody></table></div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:8px">A.V.% = participacao no total do grupo 3.3 do periodo &middot; A.H.% = variacao vs periodo de comparacao &middot; vermelho = despesa cresceu &gt;5%, verde = caiu &gt;5%</div>'+
    '</div>';
}

window.exportBalP3CSV=function(){
  var tabela=document.getElementById('bal-p3-tabela');
  if(!tabela){alert('Tabela nao encontrada.');return;}
  var rows=tabela.querySelectorAll('tr');
  var linhas=[];
  for(var i=0;i<rows.length;i++){
    var cells=rows[i].querySelectorAll('th,td');
    var linha=[];
    for(var j=0;j<cells.length;j++){linha.push(cells[j].textContent.trim().replace(/;/g,' '));}
    if(linha.join('').trim())linhas.push(linha.join(';'));
  }
  var bom=String.fromCharCode(0xFEFF);
  var blob=new Blob([bom+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='Analitico_33_'+rotBAL(balAnState.mes).replace('/','-')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
};

function parseBAL(html,arq){
  const rows=[];
  const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  let trMatch;
  while((trMatch=trRe.exec(html))!==null){
    const cells=[];
    const tdRe=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi;
    let tdMatch;
    while((tdMatch=tdRe.exec(trMatch[1]))!==null){
      const v=/<div[^>]*>([\s\S]*?)<\/div>/i.exec(tdMatch[0]);
      cells.push(v?v[1].replace(/<[^>]+>/g,'').trim():'');
    }
    if(cells.length>4)rows.push(cells);
  }
  function pm(t){if(!t||!t.trim())return 0;try{return parseFloat(t.replace(/\./g,'').replace(',','.'));}catch(e){return 0;}}
  const contas=rows.filter(r=>r[0]&&r[0]>='0'&&r[0]<='9'&&r.length>8);
  return{rot:rotBAL(arq),arq,contas:contas.map(r=>({
    classif:r[0]||'',descricao:r[1]||'',conta:r[2]||'',tipo:r[3]||'',
    nivel:(r[0]||'').split('.').length,dbcr:r[9]||'',
    total:{si:pm(r[4]),deb:pm(r[6]),cred:pm(r[7]),sf:pm(r[8])},
    mg:{si:pm(r[10]),deb:pm(r[12]),cred:pm(r[13]),sf:pm(r[14])},
    mv:{si:pm(r[16]),deb:pm(r[18]),cred:pm(r[19]),sf:pm(r[20])},
    am:{si:pm(r[22]),deb:pm(r[24]),cred:pm(r[25]),sf:pm(r[26])},
    il:{si:pm(r[28]),deb:pm(r[30]),cred:pm(r[31]),sf:pm(r[32])},
    ind:{si:pm(r[34]),deb:pm(r[36]),cred:pm(r[37]),sf:pm(r[38])},
  }))};
}

let PARAMS={
  pctDeducoes:8.22,pctCMV:72.7,pctDespVar:4.7,despFixasMes:2208705,
  pctEbitda:6.5,pctLucroFin:2.3,pme:20,pmr:17,pmp:21,recLiqMedMes:13614346,
  // Calibrados via Fluxo de Caixa (regime caixa)
  pctCustosOp:90.5, pctImpostosVda:5.0, pctJuros:0.4, pctIR:0.6,
  pctMargemCaixa:3.5, vlcMedioMes:13614346, capexMedioMes:0,
  varCaixaMedio:0, nMesesFC:0,
  // Decomposição em 4 blocos (Projeção 12m profissional)
  pctFornec:62, pctPessoal:12, pctAdm:11, pctTributos:5,
  sazonal:{receita:Array(12).fill(1),fornec:Array(12).fill(1),pessoal:Array(12).fill(1),adm:Array(12).fill(1),trib:Array(12).fill(1)},
  parcelaEmCursoMes:0, parcelaEmCursoJuros:0,
};
async function calcularParams(){
  try{
    const[fcDados,dreDados,bpDados]=await Promise.all([
      Promise.all(ARQ.operacional.map(a=>loadCSV('operacional',a))),
      Promise.all(ARQ_DRE.operacional.map(a=>loadDRE(a))),
      Promise.all(ARQ_BP.operacional.map(a=>loadBP(a))),
    ]);
    const validos=fcDados.filter(Boolean).map(fc=>{
      const dre=dreDados.find(d=>d&&d.rot===fc.rot);
      const bp=bpDados.find(d=>d&&d.rot===fc.rot);
      if(!dre||!bp)return null;
      const rl=dre.recLiq_tej||0;if(!rl)return null;
      const rb=dre.recBruta_tej||rl;
      return{recLiq:rl,recBruta:rb,cmv:dre.cmvTotal_tej||0,
        despVar:dre.despVariaveis_tej||0,despFixas:dre.despFixas_tej||0,
        ebitda:dre.ebitda_tej||0,lucroFin:dre.resLucroLiq_tej||0,
        estoques:bp.estoques||0,clientes:bp.contasReceber||0,fornec:bp.fornecedores||0};
    }).filter(Boolean);
    // Calibração contábil (mantida só pro Simulador da aba 1)
    if(validos.length){
      const n=validos.length;const avg=k=>validos.reduce((s,d)=>s+(d[k]||0),0)/n;
      Object.assign(PARAMS,{
        pctDeducoes:validos.reduce((s,d)=>s+(d.recBruta?((d.recBruta-d.recLiq)/d.recBruta*100):0),0)/n,
        pctCMV:validos.reduce((s,d)=>s+(d.recLiq?d.cmv/d.recLiq*100:0),0)/n,
        pctDespVar:validos.reduce((s,d)=>s+(d.recLiq?d.despVar/d.recLiq*100:0),0)/n,
        despFixasMes:avg('despFixas'),pctEbitda:validos.reduce((s,d)=>s+(d.recLiq?d.ebitda/d.recLiq*100:0),0)/n,
        pctLucroFin:validos.reduce((s,d)=>s+(d.recLiq?d.lucroFin/d.recLiq*100:0),0)/n,
        pme:validos.reduce((s,d)=>s+(d.cmv>0?d.estoques/(d.cmv/30):0),0)/n,
        pmr:validos.reduce((s,d)=>s+(d.recBruta>0?d.clientes/(d.recBruta/30):0),0)/n,
        pmp:validos.reduce((s,d)=>s+(d.cmv>0?d.fornec/(d.cmv/30):0),0)/n,
        recLiqMedMes:avg('recLiq'),
      });
    }
    // === Calibração CAIXA (Projeção 12 Meses) — só Fluxo de Caixa Tejotão ===
    const fc=fcDados.filter(Boolean).filter(d=>(d.vlc||0)>0);
    if(fc.length){
      const n=fc.length;
      const sumPct=fn=>fc.reduce((s,d)=>s+fn(d),0)/n;
      const A=Math.abs;
      const custosOpLiq=d=>A(d.totCustos||0)-A(d.jurosEmprestimos||0); // tira juros pra não dobrar
      // 4 blocos de saídas (regime caixa)
      const fornec  =d=>A(d.compras||0);
      const pessoal =d=>A(d.despPess||0);
      const adm     =d=>A(d.despAdm||0)+A(d.alugueis||0)+A(d.fretes||0)+A(d.taxCart||0)+A(d.outSai||0)-A(d.recupDesp||0);
      const tribut  =d=>A(d.impostos||0)+A(d.despTrib||0)+A(d.despMult||0);
      // Sazonalidade: índice = média(mês-calendário) / média geral
      const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
      const sazVec=fn=>{
        const buckets=Array.from({length:12},()=>[]);
        fc.forEach(d=>{const mi=MESES.indexOf((d.rot||'').slice(0,3));if(mi>=0)buckets[mi].push(fn(d));});
        const geral=fc.reduce((s,d)=>s+fn(d),0)/n||1;
        return buckets.map(b=>b.length?(b.reduce((s,v)=>s+v,0)/b.length)/geral:1);
      };
      // Parcelas de empréstimo em curso: média dos últimos 3 meses
      const ult3=fc.slice(-3);const m3=ult3.length||1;
      const parcelaEmCursoMes  =ult3.reduce((s,d)=>s+A(d.emprestimos||0),0)/m3;
      const parcelaEmCursoJuros=ult3.reduce((s,d)=>s+A(d.jurosEmprestimos||0),0)/m3;
      Object.assign(PARAMS,{
        pctCustosOp:    sumPct(d=>custosOpLiq(d)/d.vlc*100),
        pctImpostosVda: sumPct(d=>(A(d.impostos||0)+A(d.despTrib||0)+A(d.despMult||0))/d.vlc*100),
        pctJuros:       sumPct(d=>A(d.jurosEmprestimos||0)/d.vlc*100),
        pctIR:          sumPct(d=>A(d.IR||0)/d.vlc*100),
        pctMargemCaixa: sumPct(d=>(d.lucroLiq||0)/d.vlc*100),
        vlcMedioMes:    fc.reduce((s,d)=>s+(d.vlc||0),0)/n,
        capexMedioMes:  fc.reduce((s,d)=>s+A(d.imobilizado||0),0)/n,
        varCaixaMedio:  fc.reduce((s,d)=>s+(d.varCaixa||0),0)/n,
        nMesesFC:       n,
        pctFornec:      sumPct(d=>fornec(d)/d.vlc*100),
        pctPessoal:     sumPct(d=>pessoal(d)/d.vlc*100),
        pctAdm:         sumPct(d=>adm(d)/d.vlc*100),
        pctTributos:    sumPct(d=>tribut(d)/d.vlc*100),
        sazonal:{
          receita: sazVec(d=>d.vlc||0),
          fornec:  sazVec(fornec),
          pessoal: sazVec(pessoal),
          adm:     sazVec(adm),
          trib:    sazVec(tribut),
        },
        parcelaEmCursoMes, parcelaEmCursoJuros,
      });
    }
  }catch(e){console.log('Usando parâmetros padrão',e);}
}

let orcState=null;
function orcLoad(){
  if(orcState)return orcState;
  try{orcState=JSON.parse(localStorage.getItem('orc.dre12.v1'))||{};}catch(e){orcState={};}
  if(!orcState.premissas)orcState.premissas={};
  if(!orcState.meses)orcState.meses={};
  return orcState;
}
function orcSave(){try{localStorage.setItem('orc.dre12.v1',JSON.stringify(orcState));}catch(e){}}
window.orcSetPrem=function(campo,val){
  orcLoad();
  var v=parseFloat(String(val).replace(',','.'));
  if(isNaN(v))delete orcState.premissas[campo];else orcState.premissas[campo]=v;
  orcSave();renderOrcamento12();
};
window.orcSetMes=function(rot,campo,val){
  orcLoad();
  if(!orcState.meses[rot])orcState.meses[rot]={};
  var v=parseFloat(String(val).replace(',','.'));
  // campos monetarios sao digitados em R$ mil
  if(!isNaN(v)&&(campo==='rbe'||campo==='fixas'))v=v*1000;
  if(isNaN(v))delete orcState.meses[rot][campo];else orcState.meses[rot][campo]=v;
  orcSave();renderOrcamento12();
};
window.orcSetFx=function(rot,campo,tipo,val,rbe){
  orcLoad();
  if(!orcState.meses[rot])orcState.meses[rot]={};
  if(!orcState.meses[rot].fx)orcState.meses[rot].fx={};
  var v=parseFloat(String(val).replace(',','.'));
  if(isNaN(v)){delete orcState.meses[rot].fx[campo];}
  else{
    if(tipo==='v')v=v*1000;            // digitado em R$ mil
    else v=v*rbe/100;                   // digitado em % da RBE
    orcState.meses[rot].fx[campo]=v;
  }
  orcSave();renderOrcamento12();
};
window.orcReset=function(){
  if(!confirm('Limpar todas as premissas e valores do orcamento?'))return;
  orcState={premissas:{},meses:{}};orcSave();renderOrcamento12();
};

async function orcComputar(){
  orcLoad();
  var dre=[];
  try{dre=await getDadosDRE();}catch(e){}
  if(!dre.length)return null;

  // ── Historicos: ultimos 12 meses disponiveis ──
  var ult12=dre.slice(-12);
  function med(fn){var v=ult12.map(fn).filter(function(x){return x!=null&&!isNaN(x)&&isFinite(x);});return v.length?v.reduce(function(s,x){return s+x;},0)/v.length:0;}
  var FX_CAMPOS=[
    {c:'pessoalLoja',l:'( - ) Desp. Pessoal (Lojas)',dre:'despPessoalLoja_tej'},
    {c:'pessoalAdm', l:'( - ) Desp. Pessoal (Administrativo)',dre:'despPessoalAdm_tej'},
    {c:'trib',       l:'( - ) Desp. Tributarias',dre:'despTrib_tej'},
    {c:'util',       l:'( - ) Desp. com Utilidades',dre:'despUtilidades_tej'},
    {c:'manut',      l:'( - ) Desp. Manutencao',dre:'despManutencao_tej'},
    {c:'ti',         l:'( - ) Desp. Informatica (T.I.)',dre:'despTI_tej'},
    {c:'honor',      l:'( - ) Desp. Honorarios Terceiros',dre:'despHonorarios_tej'},
    {c:'material',   l:'( - ) Desp. Material Expediente',dre:'despMaterial_tej'},
    {c:'mkt',        l:'( - ) Desp. de Marketing',dre:'despMarketing_tej'},
    {c:'veic',       l:'( - ) Desp. com Veiculos',dre:'despVeiculos_tej'},
    {c:'alug',       l:'( - ) Alugueis',dre:'alugueis_tej'},
    {c:'gerais',     l:'( - ) Desp. Gerais',dre:'despGerais_tej'},
    {c:'outrasRec',  l:'( + ) Outras Receitas',dre:'outrasReceitas_tej',rec:true},
    {c:'bonif',      l:'( + ) Bonificacoes Recebidas',dre:'bonificacao_tej',rec:true}
  ];
  var hist={
    pctImp:   med(function(d){var r=d.recBrutaEfetiva_tej||0;return r?Math.abs(d.impostos_tej||0)/r*100:null;}),
    pctDev:   med(function(d){var r=d.recBrutaEfetiva_tej||0;return r?Math.abs(d.devolucoes_tej||0)/r*100:null;}),
    margem:   med(function(d){var r=d.recBrutaEfetiva_tej||0;return r?(d.margemVenda_tej||0)/r*100:null;}),
    pctDespVar:med(function(d){var r=d.recBrutaEfetiva_tej||0;return r?Math.abs(d.despVariaveis_tej||0)/r*100:null;}),
    pctFixas: med(function(d){var r=d.recBrutaEfetiva_tej||0;return r?Math.abs(d.despFixas_tej||0)/r*100:null;}),
    deprec:   med(function(d){return Math.abs(d.depreciacao_tej||0)||null;}),
    resFin:   med(function(d){return d.resFinanceiro_tej;}),
    pctIR:    med(function(d){var rp=d.resPeriodo_tej||0;return rp>1000?Math.abs(d.irpj_tej||0)/rp*100:null;}),
    naoOper:  med(function(d){var a=d.resLiquido_tej,b=d.resLucroLiq_tej;return(a!=null&&b!=null)?(a-b):null;}),
    amort:    med(function(d){return Math.abs(d.emprestimos_tej||0)||null;}),
    cresc:    3.0
  };
  var histFx={};
  for(var fi=0;fi<FX_CAMPOS.length;fi++){
    (function(fc){
      histFx[fc.c]=med(function(d){var r=d.recBrutaEfetiva_tej||0;return r?Math.abs(d[fc.dre]||0)/r*100:null;});
    })(FX_CAMPOS[fi]);
  }

  // premissa efetiva = editada ?? historica
  var P={};
  for(var k in hist){P[k]=(orcState.premissas[k]!=null)?orcState.premissas[k]:Math.round(hist[k]*100)/100;}

  // ── Meses do horizonte: jul/26 -> jun/27, base = mesmo mes AA ──
  var MESES_ORC=[
    {rot:'jul/26',aa:'jul/25'},{rot:'ago/26',aa:'ago/25'},{rot:'set/26',aa:'set/25'},
    {rot:'out/26',aa:'out/25'},{rot:'nov/26',aa:'nov/25'},{rot:'dez/26',aa:'dez/25'},
    {rot:'jan/27',aa:'jan/26'},{rot:'fev/27',aa:'fev/26'},{rot:'mar/27',aa:'mar/26'},
    {rot:'abr/27',aa:'abr/26'},{rot:'mai/27',aa:'mai/26'},{rot:'jun/27',aa:'jun/26'}
  ];
  var mapaDre={};
  for(var i=0;i<dre.length;i++){if(dre[i]&&dre[i].rot)mapaDre[dre[i].rot]=dre[i];}

  // ── Calculo da cascata por mes ──
  function calcMes(m){
    var mm=orcState.meses[m.rot]||{};
    var dAA=mapaDre[m.aa];
    var rbeAA=dAA?(dAA.recBrutaEfetiva_tej||null):null;
    var rbe=(mm.rbe!=null)?mm.rbe:(rbeAA!=null?rbeAA*(1+P.cresc/100):null);
    if(rbe==null)return{rot:m.rot,aa:m.aa,rbeAA:rbeAA,vazio:true};
    var imp=rbe*P.pctImp/100, dev=rbe*P.pctDev/100;
    var recLiq=rbe-imp-dev;
    var mgPct=(mm.margem!=null)?mm.margem:P.margem;
    var margem=rbe*mgPct/100;
    var cmv=recLiq-margem;
    var dvar=rbe*P.pctDespVar/100;
    var mc=margem-dvar;
    var fx={},fxDesp=0,fxRec=0;
    for(var fi=0;fi<FX_CAMPOS.length;fi++){
      var fc=FX_CAMPOS[fi];
      var vv=(mm.fx&&mm.fx[fc.c]!=null)?mm.fx[fc.c]:rbe*histFx[fc.c]/100;
      fx[fc.c]={v:vv,manual:!!(mm.fx&&mm.fx[fc.c]!=null)};
      if(fc.rec)fxRec+=vv;else fxDesp+=vv;
    }
    var fixas=fxDesp-fxRec;
    var pctFixasEfet=rbe?fixas/rbe*100:0;
    var ebitda=mc-fixas;
    var ebit=ebitda-P.deprec;
    var resPer=ebit+P.resFin;
    var ir=resPer>0?resPer*P.pctIR/100:0;
    var resLiq=resPer-ir;
    var lucroFinal=resLiq-P.naoOper;
    var resApos=lucroFinal-P.amort;
    return{rot:m.rot,aa:m.aa,rbeAA:rbeAA,rbe:rbe,rbeManual:(mm.rbe!=null),imp:imp,dev:dev,recLiq:recLiq,
      mgPct:mgPct,mgManual:(mm.margem!=null),margem:margem,cmv:cmv,dvar:dvar,mc:mc,
      fixas:fixas,fx:fx,pctFixasEfet:pctFixasEfet,ebitda:ebitda,
      pctEbitda:rbe?ebitda/rbe*100:0,ebit:ebit,resPer:resPer,ir:ir,resLiq:resLiq,
      lucroFinal:lucroFinal,resApos:resApos,realizado:!!mapaDre[m.rot]};
  }
  var calc=MESES_ORC.map(calcMes);
  return {calc:calc,P:P,hist:hist,histFx:histFx,FX_CAMPOS:FX_CAMPOS};
}

var fkOrc=function(v){if(v==null||isNaN(v))return'--';var a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+(a/1e6).toFixed(2).replace('.',',')+'M';return s+(a/1e3).toFixed(0)+'k';};

async function renderOrcamento12(){

  var sum=function(campo){var t=0,n=0;for(var i=0;i<calc.length;i++){if(!calc[i].vazio&&calc[i][campo]!=null){t+=calc[i][campo];n++;}}return n?t:null;};

  // ── Toolbar de premissas globais (com referencia historica) ──
  function prem(campo,label,unid,step){

  var toolbar='<div class="toolbar" style="flex-wrap:wrap;gap:10px;align-items:flex-end">'+

  // ── Tabela: linhas DRE x 12 meses + total ──
  function inputCell(rot,campo,val,manual,largura){
    var mostra=val;

  function linha(label,campo,opts){

  function linhaFx(fc){

        'style="width:64px;padding:2px 4px;border:1px solid '+bord+';border-radius:4px;font-size:10px;text-align:right'+bg+'">'+
        '<br><input type="number" step="0.1" value="'+(Math.round(pct*100)/100)+'" '+
        'onchange="orcSetFx(&quot;'+c.rot+'&quot;,&quot;'+fc.c+'&quot;,&quot;p&quot;,this.value,'+Math.round(c.rbe)+')" '+
        'style="width:64px;padding:2px 4px;border:1px solid '+bord+';border-radius:4px;font-size:10px;text-align:right;margin-top:2px'+bg+'">'+
        '</td>';
      tot+=it.v;n++;
    }
    tr+='<td class="cv ctot" style="text-align:right">'+(n?fk(tot):'--')+'</td></tr>';
    return tr;
  }
  function linhaPrem(label,campo){
    var tr='<tr><td style="text-align:left;font-size:11px">'+label+'</td>';
    var tot=0,n=0;
    for(var i=0;i<calc.length;i++){
      if(calc[i].vazio){tr+='<td class="cv" style="text-align:right;font-size:11px;color:var(--muted)">--</td>';}
      else{tr+='<td class="cv" style="text-align:right;font-size:11px;color:var(--muted)">'+fk(P[campo])+'</td>';tot+=P[campo];n++;}
    }
    tr+='<td class="cv ctot" style="text-align:right">'+(n?fk(tot):'--')+'</td></tr>';
    return tr;
  }
  var corpo=
    linha('RECEITA BRUTA EFETIVA <span style=&quot;font-weight:400;color:var(--muted)&quot;>(R$ mil)</span>',  'rbe',   {tipo:'rbe',s:true})+
    linha('( - ) Impostos s/ vendas',           'imp',   {})+
    linha('( - ) Devolucoes',                   'dev',   {})+
    linha('( = ) RECEITA LIQUIDA',              'recLiq',{s:true})+
    linha('META MARGEM % s/ RBE (editavel)',    null,    {tipo:'margemPct'})+
    linha('( = ) MARGEM DE VENDA',              'margem',{s:true})+
    linha('( = ) CMV (derivado)',               'cmv',   {})+
    linha('( - ) Despesas variaveis',           'dvar',  {})+
    linha('( = ) MARGEM DE CONTRIBUICAO',       'mc',    {s:true})+
    FX_CAMPOS.map(linhaFx).join('')+
    linha('( = ) DESPESAS FIXAS TOTAL','fixas',{s:true,pct:true})+
    linha('( = ) EBITDA',                       'ebitda',{s:true,pct:true})+
    linhaPrem('( - ) Depreciacao','deprec')+
    linha('( = ) EBIT',                         'ebit',  {})+
    linhaPrem('( +/- ) Resultado financeiro','resFin')+
    linha('( - ) IRPJ / CSLL',                  'ir',    {})+
    linha('( = ) RESULTADO LIQUIDO',            'resLiq',{s:true})+
    linhaPrem('( - ) Nao operacionais','naoOper')+
    linha('( = ) LUCRO LIQUIDO FINAL',          'lucroFinal',{s:true})+
    linhaPrem('( - ) Amortizacao emprestimos','amort')+
    linha('( = ) RESULTADO APOS EMPRESTIMOS',   'resApos',{s:true});

  fp.innerHTML=toolbar+
    '<div class="section" id="orc-wrap">'+
    '<div class="shead"><h2>Orcamento DRE &mdash; jul/26 a jun/27</h2>'+
    '<span class="legend">RBE = mesmo mes ano anterior &times; (1+crescimento) &middot; celulas com borda azul = editadas manualmente &middot; salvo automaticamente neste navegador</span></div>'+
    '<div class="twrap"><table><thead>'+hdr+'</thead><tbody>'+corpo+'</tbody></table></div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:8px">Depreciacao, resultado financeiro, nao operacionais e amortizacao usam as premissas globais da barra superior (valor mensal constante). &#10003; no cabecalho = mes ja possui DRE realizada.</div>'+
    '</div>';
}

// ── ORCAMENTO VISUAL — tela de apresentacao do resultado ──
window.orcVisSel={margem:true,custoOp:true,ebitda:true,lucroFinal:true,amort:true,resApos:true};
window.orcVisToggle=function(c){orcVisSel[c]=!orcVisSel[c];renderOrcamentoVisual();};
async function renderOrcamentoVisual(){
  var fp=document.getElementById('fp');
  fp.innerHTML='<div class="loading">Montando visao do orcamento...</div>';
  var R=await orcComputar();
  if(!R){fp.innerHTML='<div class="errmsg">Sem dados de DRE para basear o orcamento.</div>';return;}
  var calc=R.calc.filter(function(c){return !c.vazio;});
  if(!calc.length){fp.innerHTML='<div class="errmsg">Nenhum mes calculavel. Preencha a RBE na aba de preenchimento.</div>';return;}
  var P=R.P, fk=fkOrc;
  var fP2=function(v){return v==null||isNaN(v)?'--':v.toFixed(1).replace('.',',')+'%';};

  // Linhas da visao (com custoOp = dvar + fixas)
  function get(c,campo){
    if(campo==='custoOp')return (c.dvar||0)+(c.fixas||0);
    if(campo==='deprec')return P.deprec;
    if(campo==='resFin')return P.resFin;
    if(campo==='naoOper')return P.naoOper;
    if(campo==='amort')return P.amort;
    return c[campo];
  }
  var LINHAS=[
    {l:'Receita Bruta Efetiva',   c:'rbe',       s:true},
    {l:'Receita Liquida',         c:'recLiq'},
    {l:'Margem de Venda',         c:'margem',    s:true, pct:true},
    {l:'Custo Operacional (var + fixas)', c:'custoOp', neg:true},
    {l:'EBITDA',                  c:'ebitda',    s:true, pct:true},
    {l:'( - ) Depreciacao',       c:'deprec',    neg:true},
    {l:'EBIT',                    c:'ebit'},
    {l:'( +/- ) Resultado Financeiro', c:'resFin'},
    {l:'( - ) IRPJ / CSLL',       c:'ir',        neg:true},
    {l:'RESULTADO LIQUIDO',       c:'resLiq',    s:true},
    {l:'( - ) Nao Operacionais',  c:'naoOper',   neg:true},
    {l:'LUCRO LIQUIDO FINAL',     c:'lucroFinal',s:true, pct:true},
    {l:'( - ) Amortizacao Emprestimos', c:'amort', neg:true},
    {l:'RESULTADO APOS EMPRESTIMOS', c:'resApos', s:true}
  ];
  function tot(campo){var t=0;for(var i=0;i<calc.length;i++)t+=get(calc[i],campo)||0;return t;}

  // ── Cards de resumo anual ──
  var tRbe=tot('rbe'),tEb=tot('ebitda'),tLf=tot('lucroFinal'),tRa=tot('resApos'),tRl=tot('recLiq');
  function card(t,v,sub,cor){return '<div class="kcard"><h3>'+t+'</h3><div class="kval" style="font-size:19px;color:'+(cor||'var(--ink)')+'">'+v+'</div><div class="kmeta">'+sub+'</div></div>';}
  var cards='<div class="cards" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px">'+
    card('Receita Bruta Efetiva','R$ '+fk(tRbe),calc.length+' meses orcados')+
    card('Receita Liquida','R$ '+fk(tRl),fP2(tRl/tRbe*100)+' da RBE')+
    card('EBITDA','R$ '+fk(tEb),fP2(tEb/tRbe*100)+' da RBE',tEb>0?'var(--good)':'var(--bad)')+
    card('Lucro Liquido Final','R$ '+fk(tLf),fP2(tLf/tRbe*100)+' da RBE',tLf>0?'var(--good)':'var(--bad)')+
    card('Apos Emprestimos','R$ '+fk(tRa),'sobra de caixa do resultado',tRa>0?'var(--good)':'var(--bad)')+
    '</div>';

  // ── Grafico mensal: barras RBE + linhas selecionaveis ──
  var SERIES=[
    {c:'margem',    l:'Margem de Venda',      cor:'#7c3aed'},
    {c:'custoOp',   l:'Custo Operacional',    cor:'#dc2626'},
    {c:'ebitda',    l:'EBITDA',               cor:'#15803d'},
    {c:'lucroFinal',l:'Lucro Liquido Final',  cor:'#f59e0b'},
    {c:'amort',     l:'Amortizacao Emprest.', cor:'#0891b2'},
    {c:'resApos',   l:'Apos Emprestimos',     cor:'#334155'}
  ];
  var ativas=SERIES.filter(function(s){return orcVisSel[s.c];});
  var W=940,H=290,pad=40,gw=(W-pad*2)/calc.length;
  var maxR=0,maxL=1;
  for(var i=0;i<calc.length;i++){
    if(calc[i].rbe>maxR)maxR=calc[i].rbe;
    for(var si=0;si<ativas.length;si++){
      var av=Math.abs(get(calc[i],ativas[si].c)||0);
      if(av>maxL)maxL=av;
    }
  }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  // barras RBE
  for(var i=0;i<calc.length;i++){
    var c=calc[i],x=pad+i*gw;
    var bh=(c.rbe/maxR)*(H-90);
    svg+='<rect x="'+(x+6)+'" y="'+(H-40-bh)+'" width="'+(gw-24)+'" height="'+bh+'" rx="4" fill="#dbeafe"><title>RBE '+c.rot+': '+fk(c.rbe)+'</title></rect>';
    svg+='<text x="'+(x+gw/2-6)+'" y="'+(H-46-bh)+'" text-anchor="middle" font-size="9" fill="#1d4ed8">'+fk(c.rbe)+'</text>';
    svg+='<text x="'+(x+gw/2-6)+'" y="'+(H-24)+'" text-anchor="middle" font-size="9" fill="#64748b">'+c.rot+'</text>';
  }
  // linhas das series ativas
  var mostrarLabels=ativas.length<=3;
  for(var si=0;si<ativas.length;si++){
    var s=ativas[si],pts='';
    for(var i=0;i<calc.length;i++){
      var v=get(calc[i],s.c)||0;
      var x=pad+i*gw+gw/2-6;
      var y=H-40-(Math.max(0,v)/maxL)*(H-120);
      pts+=(i===0?'M':'L')+x+' '+y+' ';
      svg+='<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="'+s.cor+'"><title>'+s.l+' '+calc[i].rot+': '+fk(v)+'</title></circle>';
      if(mostrarLabels)svg+='<text x="'+x+'" y="'+(y-7)+'" text-anchor="middle" font-size="8.5" fill="'+s.cor+'">'+fk(v)+'</text>';
      else if(i===calc.length-1)svg+='<text x="'+(x+10)+'" y="'+(y+3)+'" font-size="8.5" font-weight="700" fill="'+s.cor+'">'+fk(v)+'</text>';
    }
    svg+='<path d="'+pts+'" fill="none" stroke="'+s.cor+'" stroke-width="2"/>';
  }
  svg+='</svg>';
  // checkboxes das series
  var chks='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:11px">'+
    '<span style="color:#1d4ed8;font-weight:700">&#9632; RBE (barras)</span>';
  for(var si=0;si<SERIES.length;si++){
    var s=SERIES[si];
    chks+='<label style="display:flex;align-items:center;gap:4px;cursor:pointer">'+
      '<input type="checkbox"'+(orcVisSel[s.c]?' checked':'')+' onchange="orcVisToggle(&quot;'+s.c+'&quot;)">'+
      '<span style="color:'+s.cor+';font-weight:600">&#9644; '+s.l+'</span></label>';
  }
  chks+='</div>';
  svg=chks+svg;

  // ── Waterfall anual: da Margem ao Resultado ──
  var steps=[
    {l:'Margem de Venda', v:tot('margem'), tipo:'base'},
    {l:'Desp. Variaveis', v:-tot('dvar'), tipo:'delta'},
    {l:'Desp. Fixas', v:-tot('fixas'), tipo:'delta'},
    {l:'EBITDA', tipo:'sub'},
    {l:'Depreciacao', v:-tot('deprec'), tipo:'delta'},
    {l:'Res. Financeiro', v:tot('resFin'), tipo:'delta'},
    {l:'IRPJ', v:-tot('ir'), tipo:'delta'},
    {l:'Res. Liquido', tipo:'sub'},
    {l:'Nao Operacionais', v:-tot('naoOper'), tipo:'delta'},
    {l:'Lucro Final', tipo:'sub'},
    {l:'Amortizacao', v:-tot('amort'), tipo:'delta'},
    {l:'Apos Emprestimos', tipo:'sub'}
  ];
  var W2=940,H2=280,pad2=20,gw2=(W2-pad2*2)/steps.length;
  var run=0,maxW=0;
  for(var i=0;i<steps.length;i++){
    if(steps[i].tipo==='base'){run=steps[i].v;steps[i].y0=0;steps[i].y1=run;}
    else if(steps[i].tipo==='delta'){steps[i].y0=run;run+=steps[i].v;steps[i].y1=run;}
    else{steps[i].y0=0;steps[i].y1=run;steps[i].v=run;}
    if(Math.abs(steps[i].y0)>maxW)maxW=Math.abs(steps[i].y0);
    if(Math.abs(steps[i].y1)>maxW)maxW=Math.abs(steps[i].y1);
  }
  var esc=(H2-80)/maxW;
  var wf='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;height:auto">';
  for(var i=0;i<steps.length;i++){
    var s=steps[i];
    var x=pad2+i*gw2;
    var yA=H2-40-Math.max(s.y0,s.y1)*esc;
    var hh=Math.max(2,Math.abs(s.y1-s.y0)*esc);
    var cor=s.tipo==='base'?'#1d4ed8':s.tipo==='sub'?'#0f172a':(s.v>=0?'#15803d':'#dc2626');
    wf+='<rect x="'+(x+8)+'" y="'+yA+'" width="'+(gw2-20)+'" height="'+hh+'" rx="3" fill="'+cor+'" opacity="'+(s.tipo==='sub'?'0.85':'0.75')+'"/>';

  var corpo='';

    var t=0;
    for(var i=0;i<calc.length;i++){
      var v=get(calc[i],L.c);t+=v||0;
      var cor=(L.neg||v>=0)?'':'color:var(--bad)';
      var cell=fk(v);

      tr+='<td class="cv" style="text-align:right;font-size:11px;'+cor+'">'+cell+'</td>';
    }
    var cellT=fk(t);
    if(L.pct&&tRbe)cellT+='<div style="font-size:9px;color:var(--muted)">'+fP2(t/tRbe*100)+'</div>';
    tr+='<td class="cv ctot" style="text-align:right">'+cellT+'</td></tr>';
    corpo+=tr;
  }

  fp.innerHTML=cards+
    '<div class="section" id="orcv-wrap">'+
    '<div class="shead"><h2>Receita &times; EBITDA &mdash; mes a mes</h2>'+
    '<div style="display:flex;gap:8px"><button class="dre-fs-btn" onclick="dreToggleFS(&quot;orcv-wrap&quot;)"><span>&#9974;</span> Fullscreen</button></div></div>'+
    svg+'</div>'+
    '<div class="section"><div class="shead"><h2>Cascata do Resultado &mdash; 12 meses orcados</h2>'+
    '<span class="legend">Da margem de venda ao resultado apos emprestimos</span></div>'+wf+'</div>'+
    '<div class="section"><div class="shead"><h2>DRE Orcada &mdash; Resumo</h2>'+
    '<span class="legend">valores derivados da aba de preenchimento</span></div>'+

}

window.abrirEditarParams=function(){

window.salvarParams=function(){
  const g=id=>{const el=document.getElementById(id);return el?parseFloat(el.value)||0:0;};
  PARAMS.pctCMV=g('p-cmv');PARAMS.pctDespVar=g('p-despvar');PARAMS.pctDeducoes=g('p-deduc');
  PARAMS.despFixasMes=g('p-despfix');PARAMS.pme=g('p-pme');PARAMS.pmr=g('p-pmr');PARAMS.pmp=g('p-pmp');

window.atualizarSimulador=function(){
  const recBruta=parseFloat(document.getElementById('sim-receita')?.value)||0;
  const estoqueMode=parseInt(document.getElementById('sim-estoque')?.value)||0;
  const invest=parseFloat(document.getElementById('sim-invest')?.value)||0;
  if(!recBruta)return;
  const deducoes=recBruta*PARAMS.pctDeducoes/100;
  const recLiq=recBruta-deducoes;
  const cmv=recLiq*PARAMS.pctCMV/100;
  const margVenda=recLiq-cmv;
  const despVar=recLiq*PARAMS.pctDespVar/100;
  const margContr=margVenda-despVar;
  const despFixas=PARAMS.despFixasMes;
  const ebitda=margContr-despFixas;
  const lucroLiq=ebitda*(PARAMS.pctLucroFin/PARAMS.pctEbitda||1);
  const estNec=recLiq/30*PARAMS.pme;
  const clientesNec=recLiq/30*PARAMS.pmr;
  const fornecNec=recLiq/30*PARAMS.pmp;
  const dEstoque=estoqueMode===0?0:estoqueMode===1?estNec-PARAMS.recLiqMedMes/30*PARAMS.pme:-(PARAMS.recLiqMedMes/30*PARAMS.pme*0.1);
  const dClientes=clientesNec-PARAMS.recLiqMedMes/30*PARAMS.pmr;
  const dFornec=fornecNec-PARAMS.recLiqMedMes/30*PARAMS.pmp;
  const geraCaixa=ebitda-dEstoque-dClientes+dFornec-invest;
  const row=(label,val,destaque,indent)=>{
    const cls=val<0?'bad':val>0?'good':'';

    <td style="font-size:12px;text-align:right;padding:8px 10px;color:var(--muted)">${recLiq?fPS(val/recLiq*100,1)+'%':''}</td></tr>`;
  };
  document.getElementById('sim-resultado').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="section">
        <div class="shead"><h2>DRE Projetada</h2></div>
        <div class="twrap"><table style="width:100%">
          <thead><tr><th style="text-align:left;padding:8px">Linha</th><th style="text-align:right;padding:8px">Valor</th><th style="text-align:right;padding:8px">A.V.%</th></tr></thead>
          <tbody>
            ${row('Receita Bruta',recBruta,false,false)}
            ${row('(-) Deduções',-deducoes,false,true)}
            ${row('(=) Receita Líquida',recLiq,true,false)}
            ${row('(-) CMV',-cmv,false,true)}
            ${row('(=) Margem de Venda',margVenda,true,false)}
            ${row('(-) Desp. Variáveis',-despVar,false,true)}
            ${row('(=) Margem Contribuição',margContr,true,false)}
            ${row('(-) Desp. Fixas',-despFixas,false,true)}
            ${row('(=) EBITDA',ebitda,true,false)}
            ${row('(=) Lucro Líquido Estimado',lucroLiq,true,false)}
          </tbody>
        </table></div>
      </div>
      <div>
        <div class="section" style="margin-bottom:10px">
          <div class="shead"><h2>Impacto no Caixa</h2></div>
          <table style="width:100%"><tbody>
            <tr class="rs"><td style="padding:8px">EBITDA gerado</td>
              <td style="text-align:right;font-weight:700;padding:8px" class="${ebitda>=0?'good':'bad'}">${fM(ebitda)}</td></tr>
            <tr><td style="padding:6px 8px 6px 20px;font-size:12px;color:var(--muted)">(+/-) Var. Estoques</td>
              <td style="text-align:right;font-size:12px;padding:6px 8px" class="${dcls(-dEstoque)}">${fM(-dEstoque)}</td></tr>
            <tr><td style="padding:6px 8px 6px 20px;font-size:12px;color:var(--muted)">(+/-) Var. Clientes</td>
              <td style="text-align:right;font-size:12px;padding:6px 8px" class="${dcls(-dClientes)}">${fM(-dClientes)}</td></tr>
            <tr><td style="padding:6px 8px 6px 20px;font-size:12px;color:var(--muted)">(+/-) Var. Fornecedores</td>
              <td style="text-align:right;font-size:12px;padding:6px 8px" class="${dcls(dFornec)}">${fM(dFornec)}</td></tr>
            ${invest>0?`<tr><td style="padding:6px 8px 6px 20px;font-size:12px;color:var(--muted)">(-) Investimentos</td>
              <td style="text-align:right;font-size:12px;padding:6px 8px;color:var(--bad)">${fM(-invest)}</td></tr>`:''}
            <tr class="rs"><td style="padding:8px">Geração de Caixa</td>

function calcCenario(cen){
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const[mesStr,anoStr]=PREV.mesIni.split('/');
  let iMes=meses.indexOf(mesStr),iAno=parseInt('20'+anoStr);
  // Expande eventos -> mapa { 'abr/26': {capex, emp, jurosExtra} }
  // Para emp_out: amortiza saldo devedor (PV ≈ parcela × parcelas), separando juros do principal
  const evMap={};
  const addEv=(k,patch)=>{if(!evMap[k])evMap[k]={capex:0,emp:0,jurosExtra:0};Object.entries(patch).forEach(([kk,vv])=>evMap[k][kk]+=vv);};
  PREV.eventos.forEach(e=>{
    const v=+e.valor||0;
    const[em,ea]=e.mes.split('/');let mi=meses.indexOf(em),ai=parseInt('20'+ea);
    const k0=meses[mi]+'/'+String(ai).slice(2);
    if(e.tipo==='capex'){addEv(k0,{capex:v});return;}
    if(e.tipo==='emp_in'){addEv(k0,{emp:v});return;}
    // emp_out: simulação Price simplificada (parcela fixa, saldo decrescente)
    const par=Math.max(1,+e.parcelas||1);
    const taxa=(+e.pctJuros||0)/100;
    let saldoDev=v*par; // proxy de PV inicial
    for(let p=0;p<par;p++){
      const k=meses[mi]+'/'+String(ai).slice(2);
      const juros=Math.max(0,saldoDev*taxa);
      const amort=Math.max(0,v-juros);
      saldoDev=Math.max(0,saldoDev-amort);
      addEv(k,{emp:-v, jurosExtra:juros}); // caixa: -parcela total; juros separado pra display/IR
      mi=(mi+1)%12;if(mi===0)ai++;
    }
  });
  const rows=[];let saldoAcum=PREV.saldoIni;
  const saz=PARAMS.sazonal||{receita:Array(12).fill(1),fornec:Array(12).fill(1),pessoal:Array(12).fill(1),adm:Array(12).fill(1),trib:Array(12).fill(1)};
  const pmpHist=Math.round(PARAMS.pmp||21);
  const pmpUser=Math.round(PREV.pmp??pmpHist);
  const shiftMeses=Math.round((pmpUser-pmpHist)/30); // shift positivo = atrasa pagamento de fornec
  // Pré-calcula receita e fornec por mês de competência (12 meses + buffer pra shift)
  const N=12;const calMes=[];
  let mi=iMes,mai=iAno;
  for(let i=0;i<N+Math.abs(shiftMeses)+1;i++){
    calMes.push({mes:mi,ano:mai});
    mi=(mi+1)%12;if(mi===0)mai++;
  }
  const receitaArr=[],fornecComp=[],pessArr=[],admArr=[],tribArr=[];
  for(let i=0;i<calMes.length;i++){
    const r=PREV.base*Math.pow(1+cen.cresc/100,i)*(saz.receita[calMes[i].mes]||1);
    receitaArr.push(r);
    fornecComp.push(r*Math.max(0,(PARAMS.pctFornec||0)+(cen.dForn||0))/100*(saz.fornec[calMes[i].mes]||1));
    pessArr.push(r*Math.max(0,(PARAMS.pctPessoal||0)+(cen.dPess||0))/100*(saz.pessoal[calMes[i].mes]||1));
    admArr.push(r*Math.max(0,(PARAMS.pctAdm||0)+(cen.dAdm||0))/100*(saz.adm[calMes[i].mes]||1));
    tribArr.push(r*Math.max(0,(PARAMS.pctTributos||0)+(cen.dTrib||0))/100*(saz.trib[calMes[i].mes]||1));
  }
  for(let i=0;i<N;i++){
    const cm=calMes[i];
    const rot=meses[cm.mes]+'/'+String(cm.ano).slice(2);
    const receita=receitaArr[i];
    // Fornecedor PAGO no mês i = competência do mês (i - shift), respeitando bordas
    const idxFornPago=i-shiftMeses;
    const fornec=(idxFornPago>=0&&idxFornPago<calMes.length)?fornecComp[idxFornPago]:fornecComp[Math.max(0,Math.min(calMes.length-1,idxFornPago))];
    const pessoal=pessArr[i];
    const adm=admArr[i];
    const trib=tribArr[i];
    const ev=evMap[rot]||{capex:0,emp:0,jurosExtra:0};
    const jurosBase=receita*Math.max(0,(PARAMS.pctJuros||0)+(cen.dJuros||0))/100;
    const juros=jurosBase+ev.jurosExtra;
    const ir=Math.max(0,receita*Math.max(0,(PARAMS.pctIR||0)+(cen.dIR||0))/100);
    const caixaOp=receita-fornec-pessoal-adm-trib-juros-ir;
    const capex=ev.capex; // sem baseline
    const caixaMes=caixaOp-capex+ev.emp;
    saldoAcum+=caixaMes;
    rows.push({rot,receita,fornec,pessoal,adm,trib,juros,ir,caixaOp,capex,emp:ev.emp,caixaMes,saldoAcum});
  }
  return rows;
}

  // Tabela do cenário ativo

  const sum=k=>ra.reduce((s,x)=>s+x[k],0);
  const totReceita=sum('receita'),totForn=sum('fornec'),totPess=sum('pessoal'),totAdm=sum('adm'),totTrib=sum('trib'),
        totJuros=sum('juros'),totIR=sum('ir'),totOp=sum('caixaOp'),
        totCap=sum('capex'),totEmp=sum('emp'),totCx=sum('caixaMes');
  const rows=ra.map(x=>`<tr>

  // Gráfico SVG comparando 3 cenários

  var rows=tabela.querySelectorAll('tr');

  var bom=String.fromCharCode(0xFEFF);

window.goModulo=function(mod){
  var btns=document.querySelectorAll('.controls .btn');
  var mapa={financeiro:'Fluxo de Caixa',dre:'DRE',bp:'Balanço Patrimonial',bal:'Balancete',intel:'Inteligência',prev:'Previsão',aud:'Auditoria',home:'Visão Executiva'};
  for(var i=0;i<btns.length;i++){
    if(btns[i].textContent.indexOf(mapa[mod])>=0){setModulo(mod,btns[i]);return;}
  }
};

async function renderHome(){
  var main=document.getElementById('main');
  main.innerHTML='<div class="section"><div class="loading">Montando visao executiva...</div></div>';

  var fM=function(v){if(v==null||isNaN(v))return'--';var a=Math.abs(v),s=v<0?'- ':'';if(a>=1e6)return s+'R$ '+(a/1e6).toFixed(2).replace('.',',')+' M';if(a>=1e3)return s+'R$ '+(a/1e3).toFixed(1).replace('.',',')+' k';return s+'R$ '+a.toFixed(0);};
  var fP=function(v,d){return v==null||isNaN(v)?'--':v.toFixed(d==null?1:d).replace('.',',')+'%';};

  var dreArr=[],fcArr=[];
  try{dreArr=await getDadosDRE();}catch(e){}
  try{fcArr=await getDadosCompP3('tejotao');}catch(e){}
  if(!dreArr.length||!fcArr.length){
    main.innerHTML='<div class="section"><div class="errmsg">Sem dados suficientes para a visao executiva.</div></div>';
    return;
  }
  var d=dreArr[dreArr.length-1];
  var dPrev=dreArr.length>1?dreArr[dreArr.length-2]:null;
  var f=fcArr[fcArr.length-1];
  var rot=d.rot||'--';

  // helper: media dos 3 meses anteriores ao ultimo
  function m3(arr,fn){
    var base=arr.slice(Math.max(0,arr.length-4),arr.length-1);
    if(!base.length)return null;
    var vals=base.map(fn).filter(function(x){return x!=null&&!isNaN(x);});
    if(!vals.length)return null;
    return vals.reduce(function(s,x){return s+x;},0)/vals.length;
  }
  // helper: seta de tendencia
  function seta(atual,anterior,invertido){
    if(anterior==null||atual==null)return '';
    var up=atual>anterior;
    var bom=invertido?!up:up;
    var ch=up?'&#9650;':'&#9660;';
    var cor=bom?'var(--good)':'var(--bad)';
    var pct=anterior!==0?((atual-anterior)/Math.abs(anterior)*100):0;
    return '<span style="color:'+cor+';font-size:11px;font-weight:700">'+ch+' '+Math.abs(pct).toFixed(1).replace('.',',')+'% vs mes ant.</span>';
  }

  // ── Numeros dos 7 cards ──
  var recLiq=d.recLiq_tej||0;
  var recLiqPrev=dPrev?(dPrev.recLiq_tej||0):null;
  var recLiqAnoAnt=d.recLiq_ant||null;
  var ebitda=d.ebitda_tej||0;
  var pctEbitda=recLiq?ebitda/recLiq*100:0;
  var lucroFinal=d.resLucroLiq_tej||0;
  var caixa=f.saldoFim||0;
  var varCx=f.varCaixa||0;
  var ciclo=(f.pme!=null&&f.pmr!=null&&f.pmp!=null)?(f.pme+f.pmr-f.pmp):null;
  var folha=(d.despPessoalLoja_tej||0)+(d.despPessoalAdm_tej||0);
  var pctFolha=recLiq?folha/recLiq*100:0;
  var despOp=d.despOperacionais_tej||0;
  var pctDespOp=recLiq?despOp/recLiq*100:0;

  function card(titulo,valor,sub,mod){
    return '<div class="kcard" style="cursor:pointer" onclick="goModulo(&quot;'+mod+'&quot;)">'+
      '<h3>'+titulo+'</h3>'+
      '<div class="kval" style="font-size:19px">'+valor+'</div>'+
      '<div class="kmeta" style="line-height:1.5">'+sub+'</div></div>';
  }

  var anoAntTxt=recLiqAnoAnt?('<br><span style="font-size:10px;color:var(--muted)">vs ano ant.: '+fM(recLiqAnoAnt)+'</span>'):'';
  var cards=
    card('Receita Liquida ('+rot+')',fM(recLiq),seta(recLiq,recLiqPrev)+anoAntTxt,'dre')+
    card('EBITDA',fM(ebitda)+' <span style="font-size:12px;color:var(--muted)">('+fP(pctEbitda)+')</span>',seta(ebitda,dPrev?dPrev.ebitda_tej:null),'dre')+
    card('Lucro Liquido Final',fM(lucroFinal),seta(lucroFinal,dPrev?dPrev.resLucroLiq_tej:null),'dre')+
    card('Caixa',fM(caixa),'Variacao no mes: <strong style="color:'+(varCx>=0?'var(--good)':'var(--bad)')+'">'+(varCx>=0?'+':'')+fM(varCx)+'</strong>','financeiro')+
    card('Ciclo Financeiro',ciclo!=null?ciclo.toFixed(0)+' dias':'--','PME + PMR - PMP','financeiro')+
    card('Folha de Pagamento',fM(folha)+' <span style="font-size:12px;color:var(--muted)">('+fP(pctFolha)+')</span>',seta(folha,dPrev?((dPrev.despPessoalLoja_tej||0)+(dPrev.despPessoalAdm_tej||0)):null,true),'dre')+
    card('Despesas Operacionais',fM(despOp)+' <span style="font-size:12px;color:var(--muted)">('+fP(pctDespOp)+')</span>',seta(despOp,dPrev?dPrev.despOperacionais_tej:null,true),'dre');

  // ── ALERTAS ──
  var alertas=[];
  function pctMargem(x){var r=x.recLiq_tej||0;return r?(x.margemVenda_tej||0)/r*100:null;}
  function pctEb(x){var r=x.recLiq_tej||0;return r?(x.ebitda_tej||0)/r*100:null;}
  function pctPerdas(x){var r=x.recLiq_tej||0;return r?Math.abs(x.perdasTotal_tej||0)/r*100:null;}
  function pctFo(x){var r=x.recLiq_tej||0;return r?((x.despPessoalLoja_tej||0)+(x.despPessoalAdm_tej||0))/r*100:null;}
  function cicloFn(x){return(x.pme!=null&&x.pmr!=null&&x.pmp!=null)?(x.pme+x.pmr-x.pmp):null;}

  var mMargem=m3(dreArr,pctMargem), aMargem=pctMargem(d);
  if(mMargem!=null&&aMargem!=null&&(mMargem-aMargem)>1)
    alertas.push('Margem de venda caiu '+fP(mMargem-aMargem)+' pp vs media trimestral ('+fP(aMargem)+' vs '+fP(mMargem)+')');

  var mEb=m3(dreArr,pctEb), aEb=pctEb(d);
  if(mEb!=null&&aEb!=null&&(mEb-aEb)>1)
    alertas.push('EBITDA % caiu '+fP(mEb-aEb)+' pp vs media trimestral ('+fP(aEb)+' vs '+fP(mEb)+')');

  var mCiclo=m3(fcArr,cicloFn), aCiclo=cicloFn(f);
  if(mCiclo!=null&&aCiclo!=null&&(aCiclo-mCiclo)>5)
    alertas.push('Ciclo financeiro aumentou '+(aCiclo-mCiclo).toFixed(0)+' dias vs media trimestral - pressao no capital de giro');

  var mFix=m3(dreArr,function(x){return Math.abs(x.despFixas_tej||0);});
  var aFix=Math.abs(d.despFixas_tej||0);
  if(mFix&&aFix&&((aFix-mFix)/mFix*100)>10)
    alertas.push('Despesas fixas cresceram '+((aFix-mFix)/mFix*100).toFixed(1).replace('.',',')+'% vs media trimestral ('+fM(aFix)+' vs '+fM(mFix)+')');

  var mPer=m3(dreArr,pctPerdas), aPer=pctPerdas(d);
  if(mPer!=null&&aPer!=null&&(aPer-mPer)>0.2)
    alertas.push('Perdas subiram para '+fP(aPer,2)+' da receita (media trimestral: '+fP(mPer,2)+')');

  var mFol=m3(dreArr,pctFo), aFol=pctFo(d);
  if(mFol!=null&&aFol!=null&&(aFol-mFol)>1)
    alertas.push('Folha subiu para '+fP(aFol)+' da receita (media trimestral: '+fP(mFol)+')');

  // Auditoria integrada
  var audHtml='';
  try{
    var aud=await execAuditoria();
    updateAudBadge(aud.resultados);
    var nErr=aud.resultados.filter(function(r){return r.status==='err';}).length;
    var nWarn=aud.resultados.filter(function(r){return r.status==='warn';}).length;
    if(nErr>0)alertas.push('Auditoria: '+nErr+' validacao(oes) com erro - <a href="#" onclick="goModulo(&quot;aud&quot;);return false" style="color:var(--accent)">ver detalhes</a>');
    else if(nWarn>0)alertas.push('Auditoria: '+nWarn+' validacao(oes) em alerta - <a href="#" onclick="goModulo(&quot;aud&quot;);return false" style="color:var(--accent)">ver detalhes</a>');
  }catch(e){}

  var alertasHtml='';
  if(alertas.length){
    for(var i=0;i<alertas.length;i++){
      alertasHtml+='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin-bottom:6px;font-size:12px">&#9888;&#65039; '+alertas[i]+'</div>';
    }
  }else{
    alertasHtml='<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 14px;font-size:12px">&#9989; Nenhum desvio relevante vs media trimestral. Nada fora do padrao.</div>';
  }

  main.innerHTML=
    '<div class="section">'+
    '<div class="shead"><h2>Visao Executiva &mdash; '+rot+'</h2>'+
    '<span class="legend">Tejotao operacional &middot; clique em um card para detalhar</span></div>'+
    '<div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:10px">'+cards+'</div>'+
    '</div>'+
    '<div class="section">'+
    '<div class="shead"><h2>Onde intervir</h2>'+
    '<span class="legend">Desvios vs media dos 3 meses anteriores</span></div>'+
    alertasHtml+
    '</div>';
}

function updateAudBadge(resultados){
  var el=document.getElementById('audBadge');
  if(!el)return;
  var nErr=resultados.filter(function(r){return r.status==='err';}).length;
  var nWarn=resultados.filter(function(r){return r.status==='warn';}).length;
  if(nErr>0) el.innerHTML='<span class="aud-dot err" title="'+nErr+' erro(s) na auditoria"></span>';
  else if(nWarn>0) el.innerHTML='<span class="aud-dot warn" title="'+nWarn+' alerta(s) na auditoria"></span>';
  else el.innerHTML='';
}
async function execAuditoria(){
  var resultados=[];
  function add(nome,esperado,obtido,tol,detalhe){
    var dif=Math.abs(esperado-obtido);
    var status=dif<=tol?'ok':dif<=tol*10?'warn':'err';
    resultados.push({nome:nome,esperado:esperado,obtido:obtido,dif:esperado-obtido,status:status,detalhe:detalhe||''});
  }
  function addEstrutura(nome,passou,detalhe){
    resultados.push({nome:nome,estrutura:true,status:passou?'ok':'err',detalhe:detalhe||''});
  }
  var fM=function(v){if(v==null||isNaN(v))return'--';var a=Math.abs(v),s=v<0?'- ':'';if(a>=1e6)return s+'R$ '+(a/1e6).toFixed(2).replace('.',',')+' M';if(a>=1e3)return s+'R$ '+(a/1e3).toFixed(2).replace('.',',')+' k';return s+'R$ '+a.toFixed(2).replace('.',',');};

  var rotulo='--';
  try{
    // ── Carregar ultimo mes de cada fonte ──
    var arqFC=ARQ.operacional[ARQ.operacional.length-1];
    var arqDRE=ARQ_DRE.operacional[ARQ_DRE.operacional.length-1];
    var fc=await loadCSV('operacional',arqFC);
    var dre=await loadDRE(arqDRE);
    rotulo=fc?fc.rot:'--';

    // Balancete do mesmo mes
    var bal=null;
    try{
      var mb={jan:'01',fev:'02',mar:'03',abr:'04',mai:'05',jun:'06',jul:'07',ago:'08',set:'09',out:'10',nov:'11',dez:'12'};
      var pr=(fc?fc.rot:'').split('/');
      if(pr.length===2) bal=await loadBAL('bal'+mb[pr[0]]+pr[1]+'.Html');
    }catch(e){}

    // ── V1: Movimento Final FC = SF - SI conta 1.1.01 balancete ──
    if(fc&&bal){
      var c1101=bal.contas.find(function(x){return x.classif==='1.1.01';});
      if(c1101){
        var varBal=(c1101.total.sf||0)-(c1101.total.si||0);
        add('Caixa: Movimento Final (FC) vs SF-SI Balancete 1.1.01',varBal,fc.varCaixa||0,1,
          'Balancete: '+fM(varBal)+' | FC: '+fM(fc.varCaixa||0));
      }else addEstrutura('Conta 1.1.01 no balancete',false,'Conta nao encontrada no balancete');
    }

    // ── V2: Parcela FC = Juros 0017 + Amortizacao DRE ──
    if(fc&&dre&&bal){
      var c17=bal.contas.find(function(x){return x.classif==='3.3.02.01.0017';});
      var juros=c17?(c17.total.deb||0):0;
      var amort=Math.abs(dre.emprestimos_tej||0);
      var parcela=Math.abs(fc.emprestimos||0);
      if(parcela>0){
        add('Parcela emprestimos: FC = Juros(0017) + Amortizacao(DRE)',juros+amort,parcela,10,
          'Juros: '+fM(juros)+' + Amort: '+fM(amort)+' = '+fM(juros+amort)+' | Parcela FC: '+fM(parcela));
      }
    }

    // ── V3: proLaboreEmp = soma dos 4 socios ──
    if(dre){
      var somaPL=(dre.proLaboreTubertino_tej||0)+(dre.proLaboreDiego_tej||0)+(dre.proLaboreThiago_tej||0)+(dre.proLaborePatricia_tej||0);
      add('Pro-labore total = soma dos 4 socios (Tejotao)',somaPL,dre.proLaboreEmp_tej||0,0.01,
        'Tubertino+Diego+Thiago+Patricia = '+fM(somaPL));
    }

    // ── V4: Cheques devolvidos liquido ──
    if(dre&&(dre.chqDevEnt_tej||dre.chqDevSai_tej)){
      var liq=(dre.chqDevEnt_tej||0)-(dre.chqDevSai_tej||0);
      add('Cheques devolvidos: liquido = entradas - recebidos',liq,dre.chqDevTotal_tej||0,0.01,
        'Ent: '+fM(dre.chqDevEnt_tej||0)+' - Rec: '+fM(dre.chqDevSai_tej||0));
    }

    // ── V5/V6: Estrutura dos CSVs (linhas ancora) ──
    try{
      var rFC=await fetch(BASE+'/data/operacional/'+encodeURIComponent(arqFC));
      var tFC=await rFC.text();
      var lFC=tFC.split(/\r?\n/);
      var l65=(lFC[64]||'').toUpperCase();
      var l71=(lFC[70]||'');
      addEstrutura('FC linha 65 = VARIACAO DE CAIXA',l65.indexOf('VARIA')>=0&&l65.indexOf('CAIXA')>=0,'Encontrado: '+(lFC[64]||'vazio').substring(0,60));
      addEstrutura('FC linha 71 = Movimento Final',l71.indexOf('Movimento')>=0,'Encontrado: '+(lFC[70]||'vazio').substring(0,60));
    }catch(e){addEstrutura('Estrutura do FC',false,'Erro ao ler arquivo: '+e.message);}

    try{
      var rD=await fetch(BASE_DRE+'/data/dre/'+encodeURIComponent(arqDRE));
      var tD=await rD.text();
      var lD=tD.split(/\r?\n/);
      addEstrutura('DRE linha 50 = PRO LABORE TUBERTINO',(lD[49]||'').toUpperCase().indexOf('TUBERTINO')>=0,'Encontrado: '+(lD[49]||'vazio').substring(0,60));
      addEstrutura('DRE linha 53 = PRO LABORE PATRICIA',(lD[52]||'').toUpperCase().indexOf('PATRICIA')>=0,'Encontrado: '+(lD[52]||'vazio').substring(0,60));
      addEstrutura('DRE linha 61 = Emprestimos (amortizacao)',(lD[60]||'').toUpperCase().indexOf('EMPR')>=0,'Encontrado: '+(lD[60]||'vazio').substring(0,60));
    }catch(e){addEstrutura('Estrutura da DRE',false,'Erro ao ler arquivo: '+e.message);}

  }catch(e){
    resultados.push({nome:'Execucao da auditoria',estrutura:true,status:'err',detalhe:e.message});
  }
  return {resultados:resultados,rotulo:rotulo};
}

async function renderAuditoria(){
  var main=document.getElementById('main');
  main.innerHTML='<div class="section"><div class="loading">Executando validacoes...</div></div>';
  var res=await execAuditoria();
  updateAudBadge(res.resultados);
  var resultados=res.resultados, rotulo=res.rotulo;
  var fM=function(v){if(v==null||isNaN(v))return'--';var a=Math.abs(v),s=v<0?'- ':'';if(a>=1e6)return s+'R$ '+(a/1e6).toFixed(2).replace('.',',')+' M';if(a>=1e3)return s+'R$ '+(a/1e3).toFixed(2).replace('.',',')+' k';return s+'R$ '+a.toFixed(2).replace('.',',');};
  var nOk=resultados.filter(function(r){return r.status==='ok';}).length;
  var nWarn=resultados.filter(function(r){return r.status==='warn';}).length;
  var nErr=resultados.filter(function(r){return r.status==='err';}).length;

  var cards='';
  for(var i=0;i<resultados.length;i++){
    var r=resultados[i];
    var icon=r.status==='ok'?'&#9989;':r.status==='warn'?'&#9888;&#65039;':'&#10060;';
    var bg=r.status==='ok'?'#f0fdf4':r.status==='warn'?'#fffbeb':'#fef2f2';
    var bd=r.status==='ok'?'#bbf7d0':r.status==='warn'?'#fde68a':'#fecaca';
    var linha2=r.estrutura?r.detalhe:('Dif: '+fM(r.dif)+' &middot; '+r.detalhe);
    cards+='<div style="background:'+bg+';border:1px solid '+bd+';border-radius:10px;padding:12px 16px;margin-bottom:8px">'+
      '<div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px">'+icon+' '+r.nome+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:4px">'+linha2+'</div>'+
      '</div>';
  }

  main.innerHTML=
    '<div class="section">'+
    '<div class="shead"><h2>Auditoria Automatica &mdash; '+rotulo+'</h2>'+
    '<span class="legend">'+resultados.length+' validacoes &middot; '+nOk+' &#9989; &middot; '+nWarn+' &#9888;&#65039; &middot; '+nErr+' &#10060;</span></div>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:14px">Validacoes cruzadas entre FC, DRE e Balancete do ultimo mes disponivel. Rode apos subir os arquivos do fechamento.</div>'+
    cards+
    '</div>';
}

window.setModulo=function(mod,btn){
  S.modulo=mod;S.pag=1;S.ini=null;S.fim=null;
  S.p2aS=null;S.p2aE=null;S.p2bS=null;S.p2bE=null;
  document.querySelectorAll('.controls .btn').forEach(b=>{
    if(['Visão Executiva','Fluxo de Caixa','DRE','Balanço Patrimonial','Balancete','Inteligência','Previsão','Auditoria'].some(t=>b.textContent.includes(t)))
      b.classList.remove('active');
  });
  btn.classList.add('active');render();
}
window.setEmp=function(e,btn){
  S.emp=e;S.ini=null;S.fim=null;S.cache={};
  S.p2aS=null;S.p2aE=null;S.p2bS=null;S.p2bE=null;
  document.querySelectorAll('#btnEmp .btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');render();
}
window.setQ=function(n,total){
  let rots;
  if(S.modulo==='dre') rots=ARQ_DRE.operacional.map(a=>rotDRE(a));
  else if(S.modulo==='bp') rots=ARQ_BP.operacional.map(a=>rotBP(a));
  else if(S.modulo==='intel'||S.modulo==='prev') rots=ARQ.operacional.map(a=>rot(a));
  else{const lista=S.emp==='consolidado'?ARQ.operacional:(ARQ[S.emp]||[]);rots=lista.map(a=>rot(a));}
  if(n===0||n>=rots.length){S.ini=rots[0];S.fim=rots[rots.length-1];}
  else{S.ini=rots[rots.length-n];S.fim=rots[rots.length-1];}
  if(S.modulo==='dre')renderDREP1();
  else if(S.modulo==='bp')renderBPP1();
  else if(S.modulo==='intel')renderIntelP2();
  else renderP1();
}
window.onP2Change=async function(){
  const g=id=>document.getElementById(id)?.value;
  S.p2aS=g('aS');S.p2aE=g('aE');S.p2bS=g('bS');S.p2bE=g('bE');
  if(S.modulo==='dre'){const dados=await getDadosDRE();calcDREP2(dados,S.p2aS,S.p2aE,S.p2bS,S.p2bE);}
  else if(S.modulo==='bp'){renderBPP2();}
  else{const dados=await getDados();calcP2(dados,S.p2aS,S.p2aE,S.p2bS,S.p2bE);}
};
window.calcP2wrap=async function(){
  const dados=await getDados();
  calcP2(dados,S.p2aS||'',S.p2aE||'',S.p2bS||'',S.p2bE||'');
};
window.preset=async function(t){
  const dados=await getDados();
  const rots=dados.map(d=>d.rot);
  const has=r=>rots.includes(r);
  const last26=rots.filter(r=>r.endsWith('/26')).slice(-1)[0]||'mar/26';
  const map={q1:['jan/25','mar/25','jan/26','mar/26'],sem1:['jan/25','jun/25','jan/26',last26],ano:['jan/25','dez/25','jan/26',last26]};
  const[aS,aE,bS,bE]=map[t];
  S.p2aS=has(aS)?aS:rots[0];S.p2aE=has(aE)?aE:rots[0];
  S.p2bS=has(bS)?bS:rots[0];S.p2bE=has(bE)?bE:rots[rots.length-1];
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&has(v))el.value=v;};
  set('aS',S.p2aS);set('aE',S.p2aE);set('bS',S.p2bS);set('bE',S.p2bE);
  calcP2(dados,S.p2aS,S.p2aE,S.p2bS,S.p2bE);
};
window.presetDRE=async function(t){
  const dados=await getDadosDRE();
  const rots=dados.map(d=>d.rot);
  const has=r=>rots.includes(r);
  const last26=rots.filter(r=>r.endsWith('/26')).slice(-1)[0]||'mar/26';
  const map={q1:['jan/25','mar/25','jan/26','mar/26'],sem1:['jan/25','jun/25','jan/26',last26],ano:['jan/25','dez/25','jan/26',last26]};
  const[aS,aE,bS,bE]=map[t];
  S.p2aS=has(aS)?aS:rots[0];S.p2aE=has(aE)?aE:rots[0];
  S.p2bS=has(bS)?bS:rots[0];S.p2bE=has(bE)?bE:rots[rots.length-1];
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&has(v))el.value=v;};
  set('aS',S.p2aS);set('aE',S.p2aE);set('bS',S.p2bS);set('bE',S.p2bE);
  calcDREP2(dados,S.p2aS,S.p2aE,S.p2bS,S.p2bE);
};


// ============================================================
// AUTO-DESCOBERTA DE ARQUIVOS via GitHub Contents API
// Sobrescreve as listas ARQ*/fallback hardcoded.
// Cache em localStorage por 10 min. Botão "Atualizar dados" no header.
// ============================================================
const GH_REPO='elder901/controladoria-es', GH_BRANCH='main';
const GH_TTL=10*60*1000;
const GH_MES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const GH_FONTES={
  operacional:{dir:'data/operacional',rx:/^FC ([a-z]{3}) (\d{4})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>+m[2], alvo:'ARQ', chave:'operacional'},
  holding:{dir:'data/holding',rx:/^S FC ([a-z]{3}) (\d{4})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>+m[2], alvo:'ARQ', chave:'holding'},
  dre:{dir:'data/dre',rx:/^DRE([a-z]{3})(\d{2})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>2000+ +m[2], alvo:'ARQ_DRE', chave:'operacional'},
  bp:{dir:'data/bp',rx:/^BP([a-z]{3})(\d{2})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>2000+ +m[2], alvo:'ARQ_BP', chave:'operacional'},
  bal:{dir:'data/balancete',rx:/^bal(\d{2}) ?(\d{2})\.html?$/i,
    mes:m=>+m[1], ano:m=>2000+ +m[2], alvo:'ARQ_BAL', chave:'tejotao'},
};
async function listarPastaGH(dir, force){
  const ck='gh:'+dir;
  if(!force){
    try{const hit=JSON.parse(localStorage.getItem(ck)||'null');
      if(hit && Date.now()-hit.t<GH_TTL) return hit.v;}catch(e){}
  }
  const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${dir}?ref=${GH_BRANCH}`);
  if(!r.ok) throw new Error(`GitHub API ${r.status} em ${dir}`);
  const v=await r.json();
  try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),v}));}catch(e){}
  return v;
}
async function descobrirARQ(force){
  const alvos={ARQ, ARQ_DRE, ARQ_BP, ARQ_BAL};
  let okGeral=true;
  for(const [k,f] of Object.entries(GH_FONTES)){
    try{
      const arquivos=await listarPastaGH(f.dir, force);
      const lista=arquivos
        .map(a=>{const m=a.name.match(f.rx); if(!m){console.warn('[GH] ignorado:',a.name);return null;}
          return {nome:a.name, ano:f.ano(m), mes:f.mes(m)};})
        .filter(Boolean)
        .sort((a,b)=>a.ano-b.ano||a.mes-b.mes)
        .map(x=>x.nome);
      if(lista.length){
        alvos[f.alvo][f.chave]=lista;
        console.log(`[GH] ${k}: ${lista.length} arquivos · último=${lista[lista.length-1]}`);
      } else { console.warn(`[GH] ${k}: 0 arquivos no padrão — mantendo fallback`); okGeral=false; }
    } catch(e){ console.error(`[GH] ${k} falhou:`,e.message,'— mantendo fallback'); okGeral=false; }
  }
  // limpa cache de dados se a lista mudou (força recarregar CSVs)
  if(force) S.cache={};
  return okGeral;
}
window.atualizarDados=async function(){
  // limpa cache do GitHub API
  Object.keys(localStorage).filter(k=>k.startsWith('gh:')).forEach(k=>localStorage.removeItem(k));
  S.cache={};
  const btn=document.getElementById('btnAtualizar');
  if(btn){btn.textContent='Atualizando...';btn.disabled=true;}
  await descobrirARQ(true);
  if(btn){btn.textContent='↻ Atualizar dados';btn.disabled=false;}
  if(typeof render==='function') render();
};
function injetarBotaoAtualizar(){
  const hdr=document.querySelector('.header');
  if(!hdr || document.getElementById('btnAtualizar')) return;
  const b=document.createElement('button');
  b.id='btnAtualizar'; b.className='btn'; b.textContent='↻ Atualizar dados';
  b.title='Re-lê as pastas data/* no GitHub e descarta cache';
  b.style.cssText='margin-left:auto';
  b.onclick=window.atualizarDados;
  hdr.appendChild(b);
}

document.addEventListener('DOMContentLoaded', async ()=>{
  document.getElementById('hinfo').textContent='v2.0 · '+new Date().toLocaleDateString('pt-BR');
  injetarBotaoAtualizar();
  try { await descobrirARQ(false); }
  catch(e){ console.error('[GH] auto-descoberta falhou globalmente — usando listas hardcoded:', e); }
  render();
});
</script>
