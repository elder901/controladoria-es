<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DNA Econômico — Da Essência à Decisão</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--soft:#eef2ff;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.wrap{max-width:1800px;margin:0 auto}
.header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header-title{font-size:18px;font-weight:800;color:var(--accent)}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px}
.controls{background:var(--card);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.cg{display:flex;flex-direction:column;gap:3px}
.cg label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btngrp{display:flex;gap:5px;flex-wrap:wrap}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--soft);border-color:#c7d2fe}
.btn.active{background:var(--soft);border-color:#c7d2fe;color:#1e3a8a}
.btn.off{opacity:.4;cursor:not-allowed}
.main{padding:12px 20px}
.mtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mtab{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:12px;font-weight:700}
.mtab.active{background:var(--soft);border-color:#c7d2fe;color:#1e3a8a}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--card);padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.tg{display:flex;flex-direction:column;gap:3px}
.tg label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.tg select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;cursor:pointer}
.qbtns{display:flex;gap:5px;flex-wrap:wrap}
.qbtn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px;font-weight:700;cursor:pointer}
.qbtn.active{background:var(--soft);border-color:#c7d2fe;color:#1e3a8a}
/* Cards — 4 colunas fixas, compactas */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:150px;display:flex;flex-direction:column}
.kcard h3{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.kval{font-size:20px;font-weight:800;margin-bottom:3px}
.kmeta{font-size:11px;line-height:1.45;color:var(--muted);flex:1}
.kchartbox{margin-top:6px;height:42px;border-top:1px dashed var(--line);padding-top:5px}
.good{color:var(--good);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.neutral{color:#374151;font-weight:700}
/* Análise — 4 colunas fixas */
.analysis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.aitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.aitem .ak{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
.aitem .av{font-size:16px;font-weight:800;margin:3px 0}
.aitem .as{font-size:11px;line-height:1.4;color:var(--muted)}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.shead h2{font-size:15px}
.legend{font-size:11px;color:var(--muted)}
/* Tabela — compacta, coluna descrição menor */
.twrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:560px}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;background:#fff}
thead th{position:sticky;top:0;z-index:3;background:#f8fafc;border-bottom:1px solid var(--line);padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#475569;white-space:nowrap;text-align:center}
tbody td,tbody th{border-bottom:1px solid #f1f5f9;padding:7px 10px;vertical-align:middle}
tbody th{position:sticky;left:0;z-index:2;background:#fff;min-width:220px;max-width:220px;font-size:12px;text-align:left}
tbody td{text-align:center}
tbody tr.rg>th{background:#f8fafc;font-weight:800;font-size:10px;text-transform:uppercase;color:#475569;letter-spacing:.04em}
tbody tr.rs>th,tbody tr.rs td{background:#fafafa;font-weight:700}
.cv{font-weight:700;white-space:nowrap;font-size:12px}
.cp{font-size:10px;color:var(--muted)}
th.ctot{position:sticky;right:0;z-index:4;background:#e8eefc;min-width:140px;text-align:center}
td.ctot{position:sticky;right:0;z-index:1;background:#f0f5ff;box-shadow:-1px 0 0 var(--line);min-width:140px;text-align:center}
tbody tr.rs td.ctot{background:#e4edff}
.p2grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.ccard h3{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.citem{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f1f5f9}
.citem:last-child{border-bottom:none}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-row>div:first-child{font-size:12px;min-width:160px}
.bar-track{flex:1;display:flex;flex-direction:column;gap:3px}
.bar-a{height:6px;background:rgba(29,78,216,.75);border-radius:3px}
.bar-b{height:6px;background:rgba(15,118,110,.65);border-radius:3px}
.bar-leg{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:8px}
.bar-leg span{display:flex;align-items:center;gap:4px}
.bar-leg i{width:12px;height:6px;border-radius:2px;display:inline-block}
.up{color:var(--good);font-weight:700;font-size:12px}
.down{color:var(--bad);font-weight:700;font-size:12px}
.sumtext p{margin-bottom:7px;font-size:12px;line-height:1.55}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.errmsg{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;color:#b91c1c;font-size:12px;margin:10px 0}
@media(max-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}.analysis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.analysis{grid-template-columns:repeat(2,1fr)}.p2grid{grid-template-columns:1fr}}
@media(max-width:500px){.cards,.analysis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="header">
  <div>
    <div class="header-title">DNA Econômico</div>
    <div class="header-sub">Da Essência à Decisão · Controladoria Estratégica</div>
  </div>
  <div style="font-size:11px;color:var(--muted)" id="hinfo"></div>
</div></div>
<div class="wrap"><div class="controls">
  <div class="cg">
    <label>Empresa</label>
    <div class="btngrp" id="btnEmp">
      <button class="btn active" onclick="setEmp('operacional',this)">Operacional</button>
      <button class="btn" onclick="setEmp('holding',this)">Holding</button>
      <button class="btn" onclick="setEmp('consolidado',this)">Consolidado</button>
    </div>
  </div>
  <div class="cg">
    <label>Módulo</label>
    <div class="btngrp">
      <button class="btn active" onclick="setModulo('financeiro',this)">Financeiro</button>
      <button class="btn" onclick="setModulo('dre',this)">DRE</button>
      <button class="btn" onclick="setModulo('bp',this)">Balanço Patrimonial</button>
      <button class="btn" onclick="setModulo('bal',this)">Balancete</button>
      <button class="btn" onclick="setModulo('intel',this)">Inteligência</button>
      <button class="btn" onclick="setModulo('prev',this)">Previsão</button>
    </div>
  </div>
</div></div>
<div class="wrap"><div class="main" id="main"></div></div>
<script>
// Sempre usar raw.githubusercontent — funciona tanto local quanto no GitHub Pages
// O CORS não é problema pois raw.githubusercontent tem os headers corretos para leitura
const BASE = 'https://raw.githubusercontent.com/elder901/controladoria-es/main';
const ARQ={
  operacional:['FC jan 2025.csv','FC fev 2025.csv','FC mar 2025.csv','FC abr 2025.csv','FC mai 2025.csv','FC jun 2025.csv','FC jul 2025.csv','FC ago 2025.csv','FC set 2025.csv','FC out 2025.csv','FC nov 2025.csv','FC dez 2025.csv','FC jan 2026.csv','FC fev 2026.csv','FC mar 2026.csv'],
  holding:['S FC jan 2025.csv','S FC fev 2025.csv','S FC mar 2025.csv','S FC abr 2025.csv','S FC mai 2025.csv','S FC jun 2025.csv','S FC jul 2025.csv','S FC ago 2025.csv','S FC set 2025.csv','S FC out 2025.csv','S FC nov 2025.csv','S FC dez 2025.csv','S FC jan 2026.csv','S FC fev 2026.csv','S FC mar 2026.csv','S FC jul 2026.csv']
};
const CM={
  'Total de Vendas Recebidas':'totVendas',
  '( - ) Recebimentos S/ Movimento de Caixa':'recSemMov',
  '( - ) Deduções':'deducoes',
  '( = ) Vendas Líquidas em Caixa':'vlc',
  '( - ) Compras':'compras',
  '( = ) Margem de Venda':'margemV',
  '( - ) Impostos Sobre Vendas':'impostos',
  '( +) Acordo Comercias':'acordos',
  '( + ) Trocas/Devoluções Recebidas':'trocas',
  '( = ) Sub Total de Acordos Comerciais Geral':'subAcordos',
  '( + ) Outras Entradas Operacionais':'outEnt',
  '( - ) Outras Saídas Operacionais':'outSai',
  '( + ) Cheques Devolvidos Recebidos':'chqRec',
  '( - ) Cheques Devolvidos':'chqDev',
  'Lucro Bruto':'lucroBruto',
  'Despesas Tributárias':'despTrib',
  'Despesas Tributárias - Multas':'despMult',
  'Fretes':'fretes',
  'Despesas C/ Pessoal':'despPess',
  'Despesas Administrativas':'despAdm',
  'Despesas Indedutíveis':'despInded',
  'Doações e Patrocínios':'doacoes',
  'Alugueis':'alugueis',
  'Taxas Adm de Cartões':'taxCart',
  '( - ) Recuperação de Despesas':'recupDesp',
  'Total de Custos Operacionais':'totCustos',
  'LUCRO DAS OPERAÇÕES':'lucroOp',
  'Resultado Financeiro':'resFin',
  'Receita Financeira':'recFin',
  'Despesas Financeiras':'despFin',
  'Lucro Antes do IR':'lucroAIR',
  'Imposto de Renda':'IR',
  'Lucro Líquido':'lucroLiq',
  'Fluxo dos Investimentos & Financiamentos':'fluxoInvest',
  'SAÍDAS':'fluxoSaidas',
  '( - ) Empréstimos Bancários':'emprestimos',
  '( - ) Parcelamentos':'parcelamentos',
  '( - ) Imobilizado/Investimentos':'imobilizado',
  '( - )  Juros S/ Empréstimos':'jurosEmprestimos',
  'ENTRADAS':'fluxoEntradas',
  '( + )  Empréstimos':'emprestimosEnt',
  '( + )  Venda Imobilizados':'vendaImob',
  '( + )   Dividendos Outras Empresas':'dividendos',
  'Fluxo dos Adiantamentos':'fluxoAdiant',
  '( - ) Adiantamentos Efetuados':'adiantEfet',
  '( + ) Adiantamentos Recebidos':'adiantReceb',
  'Fluxo dos Cheques Emitidos':'fluxoCheques',
  '( - ) Cheques Compensados':'chqCompensados',
  '( + ) Cheques Emitidos':'chqEmitidos',
  'NECESSIDADE DE C.G I':'necCG',
  'Acionistas':'acionistas',
  'Recurso de Ligadas':'recursoLigadas',
  'Recurso Enviado a Ligadas':'recursoEnviado',
  'VARIAÇÃO DE CAIXA':'varCaixa',
  'Entradas de Correspondentes':'entCorresp',
  'Saída de Correspondentes':'saiCorresp',
};
let S={emp:'operacional',modulo:'financeiro',pag:1,ini:null,fim:null,cache:{},p2aS:null,p2aE:null,p2bS:null,p2bE:null};
const fM=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2}).format(v||0);
const fP=(v,c=1)=>!isFinite(v)||isNaN(v)?'—':(v>=0?'+':'')+v.toFixed(c)+'%';
const fPS=(v,c=1)=>!isFinite(v)||isNaN(v)?'—':v.toFixed(c)+'%';
const rot=a=>{const m=a.match(/\b(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\b\s+(\d{4})/i);return m?m[1].toLowerCase()+'/'+m[2].slice(2):a;};
const dcls=v=>v>0?'good':v<0?'bad':'neutral';

async function loadCSV(emp,arq){
  const k=emp+'/'+arq;
  if(S.cache[k])return S.cache[k];
  try{
    const r=await fetch(`${BASE}/data/${emp}/${encodeURIComponent(arq)}`);
    if(!r.ok)return null;
    const buf=await r.arrayBuffer();
    let txt;
    try{txt=new TextDecoder('utf-8').decode(buf);}catch(e){txt=new TextDecoder('latin-1').decode(buf);}
    const d=parseCSV(txt,arq);
    S.cache[k]=d;return d;
  }catch(e){return null;}
}
function parseCSV(txt,arq){
  const lines=txt.split(/\r?\n/);
  const d={rot:rot(arq),arq};
  // Período da linha 1
  if(lines[1]){const m=lines[1].match(/Per[^:]*:([^;]+)/);if(m)d.periodo=m[1].trim();}
  // Leitura por posição — imune a encoding
  const L={
    4:'vendasDinheiro',5:'vendasCredito',6:'vendasDebito',7:'vendasClientes',
    8:'vendasPix',9:'vendasCheques',
    10:'totVendas',11:'recSemMov',12:'deducoes',13:'vlc',
    14:'compras',15:'margemV',16:'impostos',17:'acordos',18:'trocas',
    19:'subAcordos',20:'outEnt',21:'outSai',22:'chqRec',23:'chqDev',
    24:'lucroBruto',26:'despTrib',27:'despMult',28:'fretes',29:'despPess',
    30:'despAdm',31:'despInded',32:'doacoes',33:'alugueis',34:'taxCart',
    35:'recupDesp',36:'totCustos',37:'lucroOp',38:'resFin',39:'recFin',
    40:'despFin',41:'lucroAIR',42:'IR',43:'lucroLiq',
    44:'fluxoInvest',45:'fluxoSaidas',46:'emprestimos',47:'parcelamentos',
    48:'imobilizado',49:'jurosEmprestimos',
    50:'fluxoEntradas',51:'emprestimosEnt',52:'vendaImob',53:'dividendos',
    54:'fluxoAdiant',55:'adiantEfet',56:'adiantReceb',
    57:'fluxoCheques',58:'chqCompensados',59:'chqEmitidos',
    60:'necCG',61:'acionistas',62:'recursoLigadas',63:'recursoEnviado',
    64:'varCaixa',65:'resgate',66:'aplicacao',
    67:'entCorresp',68:'saiCorresp'};
  for(const [i,c] of Object.entries(L)){
    const l=lines[+i];if(!l)continue;
    const p=l.split(';');if(p.length>3)d[c]=parseMoeda(p[3]);
  }
  return d;
}
function parseMoeda(t){if(!t||!t.trim())return 0;const n=parseFloat(t.replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n;}
function soma(dados){
  const t={months:dados.length};
  for(const k of Object.values(CM))t[k]=dados.reduce((s,d)=>s+(d[k]||0),0);
  return t;
}
function combinar(op,hd){
  // Consolidado = soma apenas os meses que existem nos DOIS (interseção)
  // Isso garante que não aparece mês só da holding (como jul/26) sem o operacional
  const rotsHd = new Set(hd.filter(Boolean).map(h=>h.rot));
  return op
    .filter(dO=>dO && rotsHd.has(dO.rot))
    .map(dO=>{
      const dH=hd.find(h=>h&&h.rot===dO.rot);
      if(!dH)return null;
      const c={rot:dO.rot,arq:dO.arq,periodo:dO.periodo};
      for(const k of Object.values(CM))c[k]=(dO[k]||0)+(dH[k]||0);
      return c;
    })
    .filter(Boolean);
}
// setEmp e setPag definidas como window.* abaixo
function render(){
  if(S.modulo==='dre')renderDRE();
  else if(S.modulo==='bp')renderBP();
  else if(S.modulo==='intel')renderIntel();
  else if(S.modulo==='prev')renderPrevisao();
  else if(S.modulo==='bal')renderBalancete();
  else renderFin();
}
function renderFin(){
  document.getElementById('main').innerHTML=`
    <div class="mtabs">
      <button class="mtab ${S.pag===1?'active':''}" onclick="setPag(1)">Página 1 · Análise Mensal</button>
      <button class="mtab ${S.pag===2?'active':''}" onclick="setPag(2)">Página 2 · Comparação de Períodos</button>
    </div>
    <div id="fp"><div class="loading">Carregando dados...</div></div>`;
  if(S.pag===1)renderP1();else renderP2();
}
async function getDados(){
  const lista=S.emp==='consolidado'?ARQ.operacional:(ARQ[S.emp]||[]);
  let d=await Promise.all(lista.map(a=>loadCSV(S.emp==='consolidado'?'operacional':S.emp,a)));
  if(S.emp==='consolidado'){
    const dH=await Promise.all(ARQ.holding.map(a=>loadCSV('holding',a)));
    d=combinar(d,dH.filter(Boolean));
  }
  return d.filter(Boolean);
}
async function renderP1(){
  const fp=document.getElementById('fp');
  const dados=await getDados();
  if(!dados.length){fp.innerHTML='<div class="errmsg">Não foi possível carregar os dados. Verifique se os CSVs estão na pasta correta do GitHub.</div>';return;}
  if(!S.ini)S.ini=dados[0].rot;
  if(!S.fim)S.fim=dados[dados.length-1].rot;
  const iI=dados.findIndex(d=>d.rot===S.ini),iF=dados.findIndex(d=>d.rot===S.fim);
  const sl=dados.slice(iI>=0?iI:0,iF>=0?iF+1:dados.length);
  const tot=soma(sl),ult=sl[sl.length-1];
  // Busca o mesmo mês do ano anterior para comparação nos cards
  // Ex: se ult = mar/26, busca mar/25
  const mesUlt=ult.rot.split('/')[0]; // ex: "mar"
  const anoUlt=parseInt('20'+ult.rot.split('/')[1]); // ex: 2026
  const rotAnoAnt=mesUlt+'/'+(anoUlt-1).toString().slice(2); // ex: "mar/25"
  const mesmoPeriodoAnoAnt=dados.find(d=>d.rot===rotAnoAnt)||null;
  // Fallback: se não encontrar o mesmo mês do ano anterior, usa o mês anterior
  const pen=mesmoPeriodoAnoAnt||(sl.length>1?sl[sl.length-2]:null);
  const penLabel=mesmoPeriodoAnoAnt?rotAnoAnt:(sl.length>1?sl[sl.length-2].rot:null);
  fp.innerHTML=buildToolbar1(dados,sl)+buildCards(ult,pen,penLabel,!!mesmoPeriodoAnoAnt)+buildAnalysis(ult,mesmoPeriodoAnoAnt||pen,sl,tot)+buildTabela(sl,tot);
  buildSparks(dados,sl);
}
function buildToolbar1(todos,sl){
  const opts=r=>todos.map(d=>`<option value="${d.rot}" ${d.rot===r?'selected':''}>${d.rot}</option>`).join('');
  const n=todos.length;
  return `<div class="toolbar">
    <div class="tg"><label>Início</label><select onchange="S.ini=this.value;renderP1()">${opts(S.ini)}</select></div>
    <div class="tg"><label>Fim</label><select onchange="S.fim=this.value;renderP1()">${opts(S.fim)}</select></div>
    <div class="tg"><label>Atalho</label><div class="qbtns">
      <button class="qbtn ${sl.length===3?'active':''}" onclick="setQ(3,${n})">Últ. 3 meses</button>
      <button class="qbtn ${sl.length===6?'active':''}" onclick="setQ(6,${n})">Últ. 6 meses</button>
      <button class="qbtn ${sl.length===12?'active':''}" onclick="setQ(12,${n})">Últ. 12 meses</button>
      <button class="qbtn ${sl.length===todos.length?'active':''}" onclick="setQ(0,${n})">Período completo</button>
    </div></div>
  </div>`;
}
// setQ definida como window.* abaixo
function buildCards(ult,pen,penLabel,isAnoAnt){
  const items=[
    {t:'Vendas Líquidas em Caixa',c:'vlc',id:'sp0'},
    {t:'Lucro Bruto',c:'lucroBruto',id:'sp1'},
    {t:'Lucro das Operações',c:'lucroOp',id:'sp2'},
    {t:'Resultado Financeiro',c:'resFin',id:'sp3'},
    {t:'Lucro Líquido',c:'lucroLiq',id:'sp4'},
    {t:'Variação de Caixa',c:'varCaixa',id:'sp5'},
    {t:'Total Custos Operacionais',c:'totCustos',id:'sp6'},
    {t:'Lucro Antes do IR',c:'lucroAIR',id:'sp7'},
  ];
  const compLabel=penLabel||pen?.rot||'';
  const compTipo=isAnoAnt?'vs mesmo mês ano anterior':'vs mês anterior';
  return `<div class="cards">${items.map(it=>{
    const v=ult[it.c]||0,pct=ult.vlc?((v/ult.vlc)*100):0;
    const vpen=pen?pen[it.c]||0:null;
    const d=vpen!=null?v-vpen:null;
    const dpct=d!=null&&vpen?((d/Math.abs(vpen))*100):null;
    const varStr=d!=null?`<span class="${dcls(d)}">${fM(d)}</span>${dpct!=null?` · <span class="${dcls(d)}">${fP(dpct)}</span>`:''}`:'-';
    return `<div class="kcard">
      <h3>${it.t}</h3>
      <div class="kval ${v<0?'bad':''}">${fM(v)}</div>
      <div class="kmeta">
        <span style="font-size:11px;color:var(--muted)">P(%) ${ult.rot}: </span><strong>${fPS(pct)}%</strong>

function buildSparks(todos,sl){
  const campos=['vlc','lucroBruto','lucroOp','resFin','lucroLiq','varCaixa','totCustos','lucroAIR'];
  const cores=['#3b82f6','#10b981','#8b5cf6','#6366f1','#f59e0b','#06b6d4','#ef4444','#84cc16'];
  const iS=todos.findIndex(d=>d.rot===sl[0].rot),iE=todos.findIndex(d=>d.rot===sl[sl.length-1].rot);
  campos.forEach((c,i)=>{
    const el=document.getElementById('sp'+i);if(!el)return;
    const vals=todos.map(d=>d[c]||0);
    const W=el.clientWidth||200,H=42;
    const min=Math.min(...vals),max=Math.max(...vals);
    const range=max-min||1;
    const px=(v,idx)=>{
      const x=(idx/(vals.length-1))*(W-4)+2;
      const y=H-2-((v-min)/range)*(H-4);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    };
    // Linha completa (desbotada)
    const ptsFull=vals.map((v,j)=>px(v,j)).join(' ');
    // Linha do período selecionado (colorida)
    const sliceVals=vals.slice(iS,iE+1);
    const ptsSlice=sliceVals.map((v,j)=>px(v,iS+j)).join(' ');
    el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${ptsFull}" fill="none" stroke="${cores[i]}33" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="${ptsSlice}" fill="none" stroke="${cores[i]}" stroke-width="2" stroke-linejoin="round"/>
    </svg>`;
  });
}

function calcP2(dados,aS,aE,bS,bE){
  const body=document.getElementById('p2body');if(!body)return;
  const rots=dados.map(d=>d.rot);
  const iAS=rots.indexOf(aS),iAE=rots.indexOf(aE),iBS=rots.indexOf(bS),iBE=rots.indexOf(bE);

  if(!slA.length||!slB.length){body.innerHTML='<div class="errmsg">Selecione períodos válidos.</div>';return;}
  const A=soma(slA),B=soma(slB);

      </div>

        <span style="color:var(--muted)">Diferença</span>
        <span class="${cls}">${fM(d)} · ${fP(p)}</span>
      </div>
    </div>`;
  }).join('');
  const MET_BAR=[
    {l:'Vendas Líquidas em Caixa',c:'vlc'},{l:'Margem de Venda',c:'margemV'},

    {l:'Lucro Líquido',c:'lucroLiq'},{l:'Variação de Caixa',c:'varCaixa'},
  ];
  const maxV=Math.max(...MET_BAR.map(m=>Math.max(Math.abs(A[m.c]||0),Math.abs(B[m.c]||0))),1);
  const barras=MET_BAR.map(m=>{
    const wa=(Math.abs(A[m.c]||0)/maxV*100).toFixed(1),wb=(Math.abs(B[m.c]||0)/maxV*100).toFixed(1);

  const cv=df(A.vlc,B.vlc),cc=df(A.totCustos,B.totCustos),cl=df(A.lucroLiq,B.lucroLiq),cvc=df(A.varCaixa,B.varCaixa);
  const c=v=>v>=0?'good':'bad';
  const txt=`

// MÓDULO DRE
// ============================================================
const ARQ_DRE={
  operacional:['DREjan25.csv','DREfev25.csv','DREmar25.csv','DREabr25.csv','DREmai25.csv','DREjun25.csv','DREjul25.csv','DREago25.csv','DREset25.csv','DREout25.csv','DREnov25.csv','DREdez25.csv','DREjan26.csv','DREfev26.csv','DREmar26.csv'],
};
const BASE_DRE='https://raw.githubusercontent.com/elder901/controladoria-es/main';

function rotDRE(arq){
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const lower=arq.toLowerCase().replace('.csv','');
  for(const mes of meses){
    const idx=lower.indexOf(mes);
    if(idx>=0){
      const ano=lower.slice(idx+3,idx+5);
      if(ano.length===2&&!isNaN(ano))return mes+'/'+ano;
    }
  }
  return arq;
}

async function loadDRE(arq){
  const k='dre/'+arq;
  if(S.cache[k])return S.cache[k];
  try{
    const r=await fetch(`${BASE_DRE}/data/dre/${encodeURIComponent(arq)}`);
    if(!r.ok)return null;
    const buf=await r.arrayBuffer();
    let txt;
    try{txt=new TextDecoder('utf-8').decode(buf);}catch(e){txt=new TextDecoder('latin-1').decode(buf);}
    const d=parseDRE(txt,arq);
    S.cache[k]=d;return d;
  }catch(e){return null;}
}

function parseDRE(txt,arq){
  const lines=txt.split(/\r?\n/);
  const d={rot:rotDRE(arq),arq};
  // Extrai período
  if(lines[1]){const m=lines[1].match(/Per[^:]*:([^;]+)/);if(m)d.periodo=m[1].trim();}
  // Extrai ano/mês anteriores para comparação
  if(lines[3]){
    const p=lines[3].split(';');
    d.rotAnoAnt=p[2]?.trim()||'';
    d.rotPerAnt=p[4]?.trim()||'';
  }
  // Leitura por posição de linha
  // Para cada empresa: col 6=Tejotão atual, col 10=Varejo, col 12=Sena, col 14=Empresa
  // col 2=Ano anterior, col 4=Período anterior
  const LIN={
    4:'recBruta', 5:'abatimentos', 6:'recBrutaEfetiva', 8:'impostos', 9:'devolucoes',
    10:'recLiq', 11:'cmvTotal', 12:'cmv', 13:'cmvDevol', 14:'margemVenda',
    15:'despVariaveis', 16:'despVendas', 17:'despFinanceiras', 18:'perdasMerc',
    19:'faltaMerc', 20:'sobraMerc', 21:'perdasTotal',
    22:'margemContrib', 23:'despFixas',
    24:'despPessoalLoja', 25:'despPessoalAdm', 26:'despTrib', 27:'despUtilidades',
    28:'despManutencao', 29:'despTI', 30:'despHonorarios', 31:'despMaterial',
    32:'despMarketing', 33:'despVeiculos', 34:'alugueis', 35:'despGerais',
    36:'outrasReceitas', 37:'bonificacao',
    38:'despOperacionais', 40:'ebitda', 41:'depreciacao', 42:'ebit',
    43:'resFinanceiro', 44:'resPeriodo', 45:'irpj', 46:'resLiquido',
    48:'despNaoOp', 49:'proLabore1', 50:'proLabore2', 51:'proLabore3',
    53:'proLaboreEmp', 58:'alugueisHolding',
    59:'resLucroLiq', 60:'emprestimos', 61:'resAposEmp',
  };
  // Função para pegar valor de uma coluna específica
  const getVal=(linha,col)=>{
    if(!linha)return 0;
    const p=linha.split(';');
    if(p.length<=col)return 0;
    return parseMoeda(p[col]);
  };
  // Para cada linha, pega os 4 valores de empresa
  for(const [idx,campo] of Object.entries(LIN)){
    const l=lines[+idx];if(!l)continue;
    d[campo+'_tej']=getVal(l,6);   // Tejotão/Varejo atual
    d[campo+'_sena']=getVal(l,12); // Sena atual
    d[campo+'_emp']=getVal(l,14);  // Empresa (consolidado real)
    d[campo+'_ant']=getVal(l,2);   // Ano anterior
    d[campo+'_per']=getVal(l,4);   // Período anterior
  }
  return d;
}

async function getDadosDRE(){
  const lista=ARQ_DRE.operacional;
  const d=await Promise.all(lista.map(a=>loadDRE(a)));
  return d.filter(Boolean);
}

function getCampoEmp(suf){
  // Retorna sufixo da coluna conforme empresa selecionada
  if(S.emp==='holding')return '_sena';
  if(S.emp==='consolidado')return '_emp';
  return '_tej';
}

async function renderDRE(){
  document.getElementById('main').innerHTML=`
    <div class="mtabs">
      <button class="mtab ${S.pag===1?'active':''}" onclick="setPag(1)">Página 1 · DRE Mensal</button>

async function renderDREP2(){

  const dAS=S.p2aS&&rots.includes(S.p2aS)?S.p2aS:rots25[0]||rots[0];
  const dAE=S.p2aE&&rots.includes(S.p2aE)?S.p2aE:rots25[2]||rots25[rots25.length-1]||rots[0];
  const dBS=S.p2bS&&rots.includes(S.p2bS)?S.p2bS:rots26[0]||rots[0];

  S.p2aS=dAS;S.p2aE=dAE;S.p2bS=dBS;S.p2bE=dBE;
  const mkOpts=sel=>rots.map(r=>`<option value="${r}" ${r===sel?'selected':''}>${r}</option>`).join('');
  fp.innerHTML=`<div class="toolbar">

window.presetDRE=async function(t){
  const dados=await getDadosDRE();
  const rots=dados.map(d=>d.rot);
  const has=r=>rots.includes(r);
  const last26=rots.filter(r=>r.endsWith('/26')).slice(-1)[0]||'mar/26';
  const map={q1:['jan/25','mar/25','jan/26','mar/26'],sem1:['jan/25','jun/25','jan/26',last26],ano:['jan/25','dez/25','jan/26',last26]};
  const [aS,aE,bS,bE]=map[t];
  S.p2aS=has(aS)?aS:rots[0];S.p2aE=has(aE)?aE:rots[0];
  S.p2bS=has(bS)?bS:rots[0];S.p2bE=has(bE)?bE:rots[rots.length-1];
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&has(v))el.value=v;};
  set('aS',S.p2aS);set('aE',S.p2aE);set('bS',S.p2bS);set('bE',S.p2bE);
  calcDREP2(dados,S.p2aS,S.p2aE,S.p2bS,S.p2bE);
};

function calcDREP2(dados,aS,aE,bS,bE){

  if(!slA.length||!slB.length){body.innerHTML='<div class="errmsg">Selecione períodos válidos.</div>';return;}

  const smP=(sl,c)=>sl.reduce((s,d)=>s+(d[c+suf]||0),0);
  const A={},B={};
  const CAMPOS=['recBruta','abatimentos','recBrutaEfetiva','impostos','devolucoes',

    'margemContrib','despFixas',

    'despTI','despHonorarios','despMaterial','despMarketing','despVeiculos',
    'alugueis','despGerais','outrasReceitas','bonificacao','despOperacionais',
    'ebitda','depreciacao','ebit','resFinanceiro','resPeriodo','irpj','resLiquido',
    'despNaoOp','proLaboreEmp','alugueisHolding','resLucroLiq','emprestimos','resAposEmp'];
  CAMPOS.forEach(k=>{A[k]=smP(slA,k);B[k]=smP(slB,k);});

  const df=(a,b)=>{const d=b-a,p=a?((d/Math.abs(a))*100):0;return{d,p};};

const ARQ_BP={
  operacional:['BPjan25.csv','BPfev25.csv','BPmar25.csv','BPabr25.csv','BPmai25.csv','BPjun25.csv','BPjul25.csv','BPago25.csv','BPset25.csv','BPout25.csv','BPnov25.csv','BPdez25.csv','BPjan26.csv','BPfev26.csv','BPmar26.csv'],
};

function rotBP(arq){
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const lower=arq.toLowerCase().replace('.csv','');
  for(const mes of meses){
    const idx=lower.indexOf(mes);
    if(idx>=0){const ano=lower.slice(idx+3,idx+5);if(ano.length===2&&!isNaN(ano))return mes+'/'+ano;}
  }
  return arq;
}

async function loadBP(arq){
  const k='bp/'+arq;
  if(S.cache[k])return S.cache[k];
  try{
    const r=await fetch(`${BASE}/data/bp/${encodeURIComponent(arq)}`);
    if(!r.ok)return null;
    const buf=await r.arrayBuffer();
    let txt;try{txt=new TextDecoder('utf-8').decode(buf);}catch(e){txt=new TextDecoder('latin-1').decode(buf);}
    const d=parseBP(txt,arq);S.cache[k]=d;return d;
  }catch(e){return null;}
}

function parseBP(txt,arq){
  const lines=txt.split(/\r?\n/);
  const d={rot:rotBP(arq),arq};
  if(lines[2]){const m=lines[2].match(/Per[^:]*:([^;]+)/);if(m)d.periodo=m[1].trim();}
  const gv=(linha,col)=>{
    if(!linha)return 0;
    const p=linha.split(';');
    return p.length>col?parseMoeda(p[col]):0;
  };
  const gi=(linha,col)=>{
    if(!linha)return 0;
    const p=linha.split(';');
    if(p.length<=col||!p[col].trim())return 0;
    return parseFloat(p[col].replace(',','.').trim())||0;
  };
  // ATIVO — col 5 = atual, col 6 = anterior
  d.atvCirculante=gv(lines[7],5); d.atvCircAnt=gv(lines[7],6);
  d.disponibilidades=gv(lines[8],5);
  d.caixaBancos=gv(lines[9],5);
  d.creditos=gv(lines[10],5);
  d.contasReceber=gv(lines[11],5);
  d.tribRecuperar=gv(lines[13],5);
  d.aplicFinanceiras=gv(lines[14],5);
  d.outrosCreditos=gv(lines[15],5);
  d.estoques=gv(lines[17],5);d.estoquesAnt=gv(lines[17],6);
  d.caixaBancosAnt    =gv(lines[9],6);
  d.contasReceberAnt  =gv(lines[11],6);
  d.fornecedoresAnt   =gv(lines[33],6);
  d.financiamentoPCAnt=gv(lines[38],6);
  d.financiamentoPNCAnt=gv(lines[44],6);
  d.patrimonioLiqAnt  =gv(lines[47],6);
  d.atvNaoCirculante=gv(lines[23],5); d.atvNaoCircAnt=gv(lines[23],6);
  d.deposJudiciais=gv(lines[24],5);
  d.investimentos=gv(lines[25],5);
  d.imobilizado=gv(lines[26],5);
  d.totalAtivo=gv(lines[28],5); d.totalAtivoAnt=gv(lines[28],6);
  // PASSIVO
  d.pasCirculante=gv(lines[32],5); d.pasCircAnt=gv(lines[32],6);
  d.fornecedores=gv(lines[33],5);
  d.titulosPagar=gv(lines[34],5);
  d.salariosPagar=gv(lines[35],5);
  d.obrigSociais=gv(lines[36],5);
  d.obrigFiscais=gv(lines[37],5);
  d.financiamentosPC=gv(lines[38],5);
  d.outrasObrig=gv(lines[39],5);
  d.provisoesSociais=gv(lines[40],5);
  d.pasNaoCirculante=gv(lines[43],5); d.pasNaoCircAnt=gv(lines[43],6);
  d.financiamentosPNC=gv(lines[44],5);
  d.patrimonioLiq=gv(lines[47],5); d.patrimonioLiqAnt=gv(lines[47],6);
  d.capitalSocial=gv(lines[48],5);
  d.reservasLucro=gv(lines[49],5);
  d.resultadoExerc=gv(lines[51],5);
  d.dividendos=gv(lines[52],5);
  d.totalPassivo=gv(lines[54],5); d.totalPassivoAnt=gv(lines[54],6);
  // ÍNDICES ESTRUTURA DE CAPITAIS (col 10)
  d.grauEndividamento=gi(lines[9],10);
  d.solvenciaGeral=gi(lines[10],10);
  d.composEndividamento=gi(lines[11],10);
  d.garantiaCapTerceiros=gi(lines[12],10);
  d.imobCapProprio=gi(lines[13],10);
  d.grauPermAtivo=gi(lines[14],10);
  // ÍNDICES DE LIQUIDEZ (col 10)
  d.liquidezGeral=gi(lines[17],10);
  d.liquidezImediata=gi(lines[18],10);
  d.liquidezSeca=gi(lines[19],10);
  d.liquidezCorrente=gi(lines[20],10);
  // ÍNDICES RENTABILIDADE (col 10)
  d.margemOperacional=gi(lines[23],10);
  d.margemBruta=gi(lines[24],10);
  d.margemLiquida=gi(lines[25],10);
  d.giroOperacional=gi(lines[26],10);
  d.giroGeral=gi(lines[27],10);
  d.retornoOperacional=gi(lines[28],10);
  d.retornoCapProprio=gi(lines[30],10);
  return d;
}

async function getDadosBP(){
  const lista=ARQ_BP.operacional;
  const d=await Promise.all(lista.map(a=>loadBP(a)));
  return d.filter(Boolean);
}

  if(!dados.length){fp.innerHTML='<div class="errmsg">Não foi possível carregar os dados. Verifique se os CSVs estão na pasta <code>data/bp/</code> do GitHub.</div>';return;}

  // Seleciona o mês atual (último disponível ou filtrado)
  if(!S.ini)S.ini=dados[dados.length-1].rot;
  const mes=dados.find(d=>d.rot===S.ini)||dados[dados.length-1];
  // Encontra o mês anterior sem regex
  const _mesAtual=mes.rot.split('/')[0];
  const _anoAtual=mes.rot.split('/')[1];

async function getDadosIntel(){
  // Carrega os três módulos em paralelo para o mesmo conjunto de meses
  const meses=['jan25','fev25','mar25','abr25','mai25','jun25','jul25','ago25','set25','out25','nov25','dez25','jan26','fev26','mar26'];
  const fcArqs=ARQ.operacional;
  const dreArqs=ARQ_DRE.operacional;
  const bpArqs=ARQ_BP.operacional;

  const [fcDados, dreDados, bpDados] = await Promise.all([
    Promise.all(fcArqs.map(a=>loadCSV('operacional',a))),
    Promise.all(dreArqs.map(a=>loadDRE(a))),
    Promise.all(bpArqs.map(a=>loadBP(a))),
  ]);

  // Cruza por rótulo de mês
  const resultado=[];
  for(const fc of fcDados.filter(Boolean)){
    const dre=dreDados.find(d=>d&&d.rot===fc.rot);
    const bp=bpDados.find(d=>d&&d.rot===fc.rot);
    if(!dre||!bp)continue;

    // Encontrar BP do mês anterior para calcular variações
    const rotIdx=resultado.length;
    const bpAnt=rotIdx>0?resultado[rotIdx-1]?.bp:null;

    resultado.push({
      rot: fc.rot,
      fc, dre, bp,
      // Variações do BP (mês atual vs mês anterior no array)
      // Usa col6 do próprio BP (mês anterior) — mais confiável que comparar arrays
      dCaixa:    bp.caixaBancos   - (bp.caixaBancosAnt  ||bp.caixaBancos),
      dEstoque:  bp.estoques      - (bp.estoquesAnt     ||bp.estoques),
      dClientes: bp.contasReceber - (bp.contasReceberAnt||bp.contasReceber),
      dFornec:   bp.fornecedores  - (bp.fornecedoresAnt ||bp.fornecedores),
      dFinanc:   (bp.financiamentosPC+bp.financiamentosPNC) - ((bp.financiamentosPCAnt||bp.financiamentosPC)+(bp.financiamentoPNCAnt||bp.financiamentosPNC)),
      dPL:       bp.patrimonioLiq - (bp.patrimonioLiqAnt||bp.patrimonioLiq),
    });
  }
  return resultado;
}

        <div style="margin-bottom:6px;font-size:12px;font-weight:700">Caixa e Bancos</div>
        ${barra(dCaixa,totalMovimento,dCaixa>=0?'#15803d':'#b91c1c')}
        <div style="margin-bottom:6px;font-size:12px;font-weight:700">Estoques</div>
        ${barra(dEstoque,totalMovimento,dEstoque>=0?'#b91c1c':'#15803d')}
        <div style="margin-bottom:6px;font-size:12px;font-weight:700">Clientes (Contas a Receber)</div>
        ${barra(dClientes,totalMovimento,dClientes>=0?'#b91c1c':'#15803d')}
        <div style="margin-bottom:6px;font-size:12px;font-weight:700">Fornecedores</div>
        ${barra(dFornec,totalMovimento,dFornec>=0?'#15803d':'#b91c1c')}
        <div style="margin-bottom:6px;font-size:12px;font-weight:700">Financiamentos</div>
        ${barra(dFinanc,totalMovimento,dFinanc>=0?'#b91c1c':'#15803d')}
      </div>
      <div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Leitura</p>
        <div style="font-size:13px;line-height:1.8">
          ${lucro>0?`<p>✅ A empresa gerou <strong>${fM(lucro)}</strong> de lucro líquido.</p>`:`<p>⚠️ A empresa teve prejuízo de <strong>${fM(lucro)}</strong>.</p>`}
          ${dCaixa>0?`<p>💰 Caixa <strong>aumentou</strong> ${fM(dCaixa)} — lucro se materializou em caixa.</p>`:`<p>⚠️ Caixa <strong>caiu</strong> ${fM(Math.abs(dCaixa))} apesar do lucro.</p>`}
          ${dEstoque<0?`<p>📦 Estoques reduziram ${fM(Math.abs(dEstoque))} — <strong>liberou</strong> capital de giro.</p>`:`<p>📦 Estoques cresceram ${fM(dEstoque)} — <strong>consumiu</strong> capital de giro.</p>`}
          ${dClientes<0?`<p>👥 Clientes pagaram mais — recebimento <strong>acelerou</strong> ${fM(Math.abs(dClientes))}.</p>`:`<p>👥 Clientes devem mais — ${fM(dClientes)} <strong>presos</strong> em contas a receber.</p>`}
          ${dFornec<0?`<p>🏭 Fornecedores receberam R$ ${fM(Math.abs(dFornec))} — <strong>saiu</strong> do caixa (pagamento de dívida com fornecedor).</p>`:`<p>🏭 Prazo com fornecedores <strong>alongou</strong> R$ ${fM(dFornec)} — capital de terceiros financiando a operação.</p>`}
        </div>
      </div>
    </div>
  </div>`;

  // 2. BRIDGE LUCRO → CAIXA
  const bridgeLucro   = lucro;
  // Regra: aumento de passivo (fornecedor) = entra caixa; queda = sai caixa
  // Regra: aumento de ativo (clientes/estoque) = sai caixa; queda = entra caixa
  const bridgeFornec  = dFornec;      // ΔFornecedor: + = financiou mais = bom para caixa
  const bridgeClientes= -dClientes;   // ΔClientes: + = preso em receber = ruim para caixa (invertido)
  const bridgeEstoque = -dEstoque;    // ΔEstoque: + = comprou mais = ruim para caixa (invertido)
  const bridgeFinanc  = dFinanc;      // ΔFinanciamento: + = tomou mais dívida = entra caixa
  const bridgeTotal   = bridgeLucro+bridgeFornec+bridgeClientes+bridgeEstoque+bridgeFinanc;
  const caixaReal=fc.varCaixa||0;

  const buildBridgeBar=(label,val,cor)=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div style="font-size:12px;min-width:200px">${label}</div>
      <div style="flex:1;height:24px;background:#f1f5f9;border-radius:4px;position:relative;overflow:hidden">
        <div style="height:24px;width:${Math.min(Math.abs(val)/Math.max(Math.abs(bridgeLucro),Math.abs(caixaReal),1)*80+10,95).toFixed(0)}%;background:${cor};border-radius:4px;display:flex;align-items:center;padding-left:8px">
          <span style="font-size:11px;font-weight:700;color:white;white-space:nowrap">${fM(val)}</span>
        </div>
      </div>
      <div style="font-size:11px;font-weight:700" class="${val>=0?'good':'bad'}">${fP(val/Math.abs(bridgeLucro||1)*100)}</div>
    </div>`;

  // Dados adicionais do BP para bridge completo
  const dImobilizado = bp.imobilizado - (bp.imobilizadoAnt||bp.imobilizado);
  const dFinancLP    = bp.financiamentosPNC - (bp.financiamentoPNCAnt||bp.financiamentosPNC);
  const dOutrasObg   = (bp.outrasObrig||0) - (bp.outrasObrigAnt||bp.outrasObrig||0);
  const dSalarios    = (bp.salariosPagar||0) - (bp.salariosPagarAnt||bp.salariosPagar||0);
  const dFiscais     = (bp.obrigFiscais||0) - (bp.obrigFiscaisAnt||bp.obrigFiscais||0);

  // CAMADA 1 — Capital de Giro
  const c1 = bridgeLucro + bridgeClientes + bridgeFornec + bridgeEstoque;
  // CAMADA 2 — Investimentos e Financiamentos
  const c2 = -dImobilizado + bridgeFinanc + dFinancLP;
  // CAMADA 3 — Outros passivos operacionais
  const c3 = dSalarios + dFiscais + dOutrasObg;
  // Total estimado
  const estimadoTotal = c1 + c2 + c3;
  const residuo = caixaReal - estimadoTotal;

  const bBar=(label,val,ref,nota)=>{
    const maxV=Math.abs(bridgeLucro)||1;
    const w=Math.min(Math.abs(val)/maxV*80+5,95).toFixed(0);
    const cor=val>=0?'#15803d':'#b91c1c';
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <div style="font-size:11px;min-width:210px;color:var(--ink)">${label}</div>
      <div style="flex:1;height:22px;background:#f1f5f9;border-radius:4px;overflow:hidden">
        <div style="height:22px;width:${w}%;background:${cor};border-radius:4px;display:flex;align-items:center;padding-left:6px">
          <span style="font-size:10px;font-weight:700;color:white;white-space:nowrap">${fM(val)}</span>
        </div>
      </div>
      <div style="font-size:11px;min-width:55px;text-align:right;font-weight:700" class="${val>=0?'good':'bad'}">${val>=0?'+':''}${fPS(val/Math.abs(bridgeLucro||1)*100,0)}%</div>
      ${nota?`<div style="font-size:10px;color:var(--muted);min-width:120px">${nota}</div>`:''}
    </div>`;
  };

  const sepLinha=`<div style="border-top:1.5px solid var(--line);margin:8px 0 6px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">`;

  const bridge=`<div class="section">
    <div class="shead"><h2>Bridge: Lucro → Caixa</h2>
      <span class="legend">Por que o lucro não virou caixa?</span>
    </div>
    <div style="font-size:11px;color:var(--muted);background:#f8fafc;border-radius:8px;padding:8px 12px;margin-bottom:12px">
      (+) valor positivo = contribui para caixa &nbsp;|&nbsp; (−) valor negativo = consome caixa
    </div>

    <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">
      Camada 1 — Capital de Giro
    </div>
    ${bBar('(+) Lucro Líquido Final (DRE)',bridgeLucro,'','ponto de partida')}
    ${bBar('(+/−) Δ Clientes — ativo caiu = recebeu',bridgeClientes,'',bridgeClientes>=0?'↓ clientes = entrou caixa':'↑ clientes = preso a receber')}
    ${bBar('(+/−) Δ Fornecedores — passivo caiu = pagou',bridgeFornec,'',bridgeFornec>=0?'↑ fornec = financiou':'↓ fornec = pagou')}
    ${bBar('(+/−) Δ Estoques — ativo caiu = liberou',bridgeEstoque,'',bridgeEstoque>=0?'↓ estoque = liberou':'↑ estoque = comprou mais')}
    ${sepLinha}<span>Subtotal C1</span><span class="${c1>=0?'good':'bad'}" style="font-weight:700">${fM(c1)}</span></div>

    <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">
      Camada 2 — Investimentos & Financiamentos
    </div>
    ${bBar('(+/−) Δ Imobilizado — subiu = CAPEX',-dImobilizado,'',dImobilizado>0?'↑ imob = investiu (saiu caixa)':'↓ imob = desinvestiu ou depreciou')}
    ${bBar('(+/−) Δ Financiamentos CP',bridgeFinanc,'',bridgeFinanc>=0?'↑ financ = tomou empréstimo':'↓ financ = pagou parcela')}
    ${bBar('(+/−) Δ Financiamentos LP',dFinancLP,'',Math.abs(dFinancLP)>500000?'⚠️ possível reclassificação LP→CP':'variação normal')}
    ${sepLinha}<span>Subtotal C2</span><span class="${c2>=0?'good':'bad'}" style="font-weight:700">${fM(c2)}</span></div>

    <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">
      Camada 3 — Outros Passivos Operacionais
    </div>
    ${bBar('(+/−) Δ Salários a Pagar',dSalarios,'','')}
    ${bBar('(+/−) Δ Obrigações Fiscais',dFiscais,'','')}
    ${bBar('(+/−) Δ Outras Obrigações',dOutrasObg,'','')}
    ${sepLinha}<span>Subtotal C3</span><span class="${c3>=0?'good':'bad'}" style="font-weight:700">${fM(c3)}</span></div>

    <div style="border-top:2px solid var(--ink);margin:10px 0 6px;display:flex;justify-content:space-between;font-size:12px;font-weight:700">
      <span>Total Estimado</span><span class="${estimadoTotal>=0?'good':'bad'}" style="font-weight:700">${fM(estimadoTotal)}</span>
    </div>
    ${bBar('(=) Variação de Caixa Real (FC)',caixaReal,'','')}
    
    <div style="margin-top:10px;padding:10px;border-radius:8px;background:${Math.abs(residuo)<300000?'#f0fdf4':'#fef9c3'};border:1px solid ${Math.abs(residuo)<300000?'#bbf7d0':'#fde68a'}">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px">
        Resíduo não explicado: <span class="${Math.abs(residuo)<300000?'good':'neutral'}" style="font-weight:700">${fM(residuo)}</span>
      </div>
      <div style="font-size:11px;color:var(--muted);line-height:1.6">
        ${Math.abs(residuo)<100000
          ? '✅ Bridge fechou com alta precisão.'
          : Math.abs(residuo)<300000
          ? '⚠️ Pequena diferença — típica de ajustes contábeis não-caixa (provisões, depreciação).'
          : '⚠️ Diferença relevante — pode haver reclassificação contábil (ex: LP→CP) ou ajuste de fechamento sem impacto de caixa.'}
      </div>
    </div>
  </div>`;

    // Cálculo do ciclo financeiro (necessário para cicloCard)
  const cmvMes     = Math.abs(dre.cmvTotal_tej||0)||recLiq*0.727;
  const recBrutaMes= dre.recBruta_tej||recLiq;
  const estFin     = bp.estoques||0;
  const comprasMes = cmvMes;
  const pme  = estFin/(cmvMes/30);
  const pmr  = bp.contasReceber/(recBrutaMes/30);
  const pmp  = bp.fornecedores/((comprasMes>0?comprasMes:cmvMes)/30);
  const ciclo= pme+pmr-pmp;

  const cicloCard=`<div class="section">
    <div class="shead"><h2>Ciclo Financeiro</h2>
      <span class="legend">Quantos dias o dinheiro fica preso?</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      <div class="aitem">
        <div class="ak">PME — Estoque</div>
        <div class="av">${pme.toFixed(0)} dias</div>
        <div class="as">Tempo médio que o produto fica no estoque antes de ser vendido</div>
      </div>
      <div class="aitem">
        <div class="ak">PMR — Recebimento</div>
        <div class="av">${pmr.toFixed(0)} dias</div>
        <div class="as">Tempo médio para receber dos clientes após a venda</div>
      </div>
      <div class="aitem">
        <div class="ak">PMP — Pagamento</div>
        <div class="av">${pmp.toFixed(0)} dias</div>
        <div class="as">Tempo médio que a empresa leva para pagar fornecedores</div>
      </div>
      <div class="aitem">
        <div class="ak">Ciclo Financeiro</div>
        <div class="av ${ciclo>30?'bad':ciclo<0?'good':''}">${ciclo.toFixed(0)} dias</div>
        <div class="as">${ciclo<0?'✅ Negativo — fornecedores financiam o ciclo':ciclo<20?'✅ Ciclo curto e saudável':'⚠️ PME + PMR - PMP. Quanto menor, melhor.'}</div>
      </div>
    </div>
    <div style="background:#f8fafc;border-radius:10px;padding:12px;font-size:12px;line-height:1.8">
      <strong>Como ler:</strong> A empresa compra estoque → espera ${pme.toFixed(0)} dias para vender → aguarda ${pmr.toFixed(0)} dias para receber → total de <strong>${(pme+pmr).toFixed(0)} dias</strong> com capital empatado.
      Nesse período, os fornecedores financiam <strong>${pmp.toFixed(0)} dias</strong>. O saldo a financiar é de <strong>${ciclo.toFixed(0)} dias</strong>.
      ${ciclo<0?' Como o ciclo é negativo, os fornecedores estão, na prática, financiando o negócio — situação favorável.'
               :` Isso representa R$ ${fM(recBrutaMes/30*ciclo)} de capital de giro necessário.`}
    </div>
  </div>`;

  // 4. INDICADORES CRUZADOS
  const dívida=bp.financiamentosPC+bp.financiamentosPNC;
  const ebitdaAnual=(dre.ebitda_tej||0)*12;
  const cobertura=(dre.ebitda_tej||0)/(dre.despFinanceiras_tej||1);
  const roe=((dre.resLucroLiq_tej||0)/(bp.patrimonioLiq||1))*100;
  const roa=((dre.resLucroLiq_tej||0)/(bp.totalAtivo||1))*100;
  const roic=((dre.ebitda_tej||0)/((bp.totalAtivo||1)-(bp.pasCirculante||0)))*100;
  const divEbitda=ebitdaAnual>0?dívida/ebitdaAnual:0;

  const indicadores=`<div class="section">
    <div class="shead"><h2>Indicadores Cruzados</h2>
      <span class="legend">FC + DRE + BP combinados</span>
    </div>
    <div class="analysis">
      <div class="aitem">
        <div class="ak">ROE — Retorno sobre PL</div>
        <div class="av ${roe<0?'bad':''}">${roe.toFixed(1)}%</div>
        <div class="as">Lucro / Patrimônio Líquido<br>${roe>10?'✅ Acima de 10% — bom retorno':roe>0?'⚠️ Positivo mas baixo':'❌ Retorno negativo'}</div>
      </div>
      <div class="aitem">
        <div class="ak">ROA — Retorno sobre Ativo</div>
        <div class="av ${roa<0?'bad':''}">${roa.toFixed(1)}%</div>
        <div class="as">Lucro / Total do Ativo<br>${roa>5?'✅ Ativo bem aproveitado':roa>0?'⚠️ Retorno baixo':'❌ Ativo gerando prejuízo'}</div>
      </div>
      <div class="aitem">
        <div class="ak">Dívida / EBITDA</div>
        <div class="av ${divEbitda>3?'bad':''}">${divEbitda.toFixed(1)}x</div>
        <div class="as">Anos de EBITDA para quitar dívidas<br>${divEbitda<2?'✅ Dívida controlada':divEbitda<4?'⚠️ Atenção ao endividamento':'❌ Endividamento elevado'}</div>
      </div>
      <div class="aitem">
        <div class="ak">Qualidade do Lucro</div>
        <div class="av ${(fc.varCaixa||0)<(dre.resLucroLiq_tej||0)*0.3?'bad':''}">${((fc.varCaixa||0)/(dre.resLucroLiq_tej||1)*100).toFixed(0)}%</div>
        <div class="as">Caixa gerado / Lucro líquido<br>${(fc.varCaixa||0)>=(dre.resLucroLiq_tej||0)*0.5?'✅ Lucro se converte bem em caixa':'⚠️ Lucro não está virando caixa'}</div>
      </div>
    </div>
  </div>`;

  // Dados por empresa para os cards executivos
  const intelEmp = window.intelEmp||'tejotao';
  const suf_dre = intelEmp==='tejotao'?'_tej':intelEmp==='sena'?'_sena':'_emp';

  // Carregar FC da holding uma vez para usar em todos os campos
  const hdTodos = await Promise.all(ARQ.holding.map(a=>loadCSV('holding',a)));
  const hdMes = hdTodos.filter(Boolean).find(d=>d.rot===mes.rot)||null;

  // FC correto por empresa
  console.log('Intel debug:', {intelEmp, mesRot:mes.rot, hdMes:hdMes?hdMes.rot:'null', hdMesImob:hdMes?hdMes.imobilizado:'null'});
  const fcTej = fc;   // FC operacional = Tejotão
  const fcSena = hdMes; // FC holding = Sena
  const fcAtivo = intelEmp==='tejotao' ? fcTej
                : intelEmp==='sena'    ? fcSena
                : null; // consolidado = soma dos dois

  // Lucro líquido DRE econômica — já tem colunas separadas no CSV
  const lucroLiqDRE = dre['resLucroLiq'+suf_dre]||0;

  // Resultado de caixa (FC)
  let resultCaixa = 0;
  if(intelEmp==='tejotao')       resultCaixa = fcTej.varCaixa||0;
  else if(intelEmp==='sena')     resultCaixa = fcSena?fcSena.varCaixa||0:0;
  else                           resultCaixa = (fcTej.varCaixa||0)+(fcSena?fcSena.varCaixa||0:0);

  // Pagamento fornecedores (linha 14 FC = compras)
  let pagFornec = 0;
  if(intelEmp==='tejotao')       pagFornec = fcTej.compras||0;
  else if(intelEmp==='sena')     pagFornec = fcSena?fcSena.compras||0:0;
  else                           pagFornec = (fcTej.compras||0)+(fcSena?fcSena.compras||0:0);

  // CAPEX (imobilizado FC linha 48)
  let capex = 0;
  if(intelEmp==='tejotao')       capex = fcTej.imobilizado||0;
  else if(intelEmp==='sena')     capex = fcSena?fcSena.imobilizado||0:0;
  else                           capex = (fcTej.imobilizado||0)+(fcSena?fcSena.imobilizado||0:0);

  // Variação do estoque e contas a receber (BP) — Tejotão sempre por ora
  const varEstoque  = bp.estoques     - (bp.estoquesAnt    ||bp.estoques);
  const varClientes = bp.contasReceber- (bp.contasReceberAnt||bp.contasReceber);

  // Referência para A.V.% — receita líquida DRE
  const recLiqRef = dre['recLiq'+suf_dre]||dre.recLiq_tej||1;

  // Cards executivos
  const cardsExec=[
    {t:'Lucro Líquido (DRE Econômica)', v:lucroLiqDRE,  fmt:'m', av:lucroLiqDRE/recLiqRef*100, cor:'#3b82f6'},
    {t:'Resultado de Caixa (FC)',        v:resultCaixa,  fmt:'m', av:resultCaixa/recLiqRef*100,  cor:'#10b981'},
    {t:'Pagamento Fornecedores (FC)',     v:-pagFornec,   fmt:'m', av:pagFornec/recLiqRef*100,    cor:'#f59e0b'},
    {t:'Variação Estoques (BP)',          v:varEstoque,   fmt:'m', av:varEstoque/recLiqRef*100,   cor:'#8b5cf6'},
    {t:'Variação Contas a Receber (BP)',  v:varClientes,  fmt:'m', av:varClientes/recLiqRef*100,  cor:'#06b6d4'},
    {t:'CAPEX — Imobilizado (FC)',        v:-capex,       fmt:'m', av:capex/recLiqRef*100,        cor:'#ef4444'},
  ].map(it=>{
    const corVal=it.v<0?'var(--bad)':'var(--ink)';
    const empLabel=intelEmp==='tejotao'?'Tejotão':intelEmp==='sena'?'Sena':'Consolidado';
    return `<div class="kcard" style="min-height:0;padding:12px;border-top:3px solid ${it.cor}">
      <h3>${it.t}</h3>
      <div class="kval" style="font-size:18px;color:${corVal}">${fM(it.v)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">
        A.V.: <strong>${fPS(Math.abs(it.av),1)}%</strong> da receita líquida
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">
        ${mes.rot} · ${empLabel}
      </div>
    </div>`;
  }).join('');

  const secaoCards=`<div class="section" style="margin-bottom:10px">
    <div class="shead">
      <h2>Resumo Executivo</h2>
      <span class="legend">${mes.rot} · ${intelEmp==='tejotao'?'Tejotão':intelEmp==='sena'?'Sena':'Consolidado'}</span>
    </div>
    <div class="cards">${cardsExec}</div>
  </div>`;

  fp.innerHTML=toolbar+secaoCards+destinoLucro+bridge+cicloCard+indicadores;
}

async function renderIntelP2(){
  const fp=document.getElementById('fp');
  const dados=await getDadosIntel();
  if(!dados.length){fp.innerHTML='<div class="errmsg">Sem dados disponíveis.</div>';return;}

  if(!S.ini)S.ini=dados[0].rot;
  if(!S.fim)S.fim=dados[dados.length-1].rot;
  const iI=dados.findIndex(d=>d.rot===S.ini);
  const iF=dados.findIndex(d=>d.rot===S.fim);
  const sl=dados.slice(iI>=0?iI:0,iF>=0?iF+1:dados.length);
  const n=dados.length;

  const opts=r=>dados.map(d=>`<option value="${d.rot}" ${d.rot===r?'selected':''}>${d.rot}</option>`).join('');
  const toolbar=`<div class="toolbar">
    <div class="tg"><label>Início</label><select onchange="S.ini=this.value;renderIntelP2()">${opts(S.ini)}</select></div>
    <div class="tg"><label>Fim</label><select onchange="S.fim=this.value;renderIntelP2()">${opts(S.fim)}</select></div>
    <div class="tg"><label>Atalho</label><div class="qbtns">
      <button class="qbtn ${sl.length===3?'active':''}" onclick="setQ(3,${n})">Últ. 3 meses</button>
      <button class="qbtn ${sl.length===6?'active':''}" onclick="setQ(6,${n})">Últ. 6 meses</button>
      <button class="qbtn ${sl.length===12?'active':''}" onclick="setQ(12,${n})">Últ. 12 meses</button>
      <button class="qbtn ${sl.length===dados.length?'active':''}" onclick="setQ(0,${n})">Período completo</button>
    </div></div>
  </div>`;

  // Tabela evolução dos indicadores cruzados
  const tabela=`<div class="section"><div class="shead"><h2>Evolução dos Indicadores — mês a mês</h2></div>
    <div class="twrap"><table><thead><tr>
      <th style="min-width:200px;text-align:left">Indicador</th>
      ${sl.map(d=>`<th>${d.rot.toUpperCase()}</th>`).join('')}

          const pmp=d.bp.fornecedores/(cmv/30);
          return (pme+pmr-pmp).toFixed(0)+'d';}},
        {l:'PME — Estoque (dias)',fn:d=>{const cmv=Math.abs(d.dre.cmvTotal_tej||0)||d.dre.recLiq_tej*0.727;return (d.bp.estoques/(cmv/30)).toFixed(0)+'d';}},
        {l:'PMR — Recebimento (dias)',fn:d=>{const rb=d.dre.recBruta_tej||d.dre.recLiq_tej||1;return (d.bp.contasReceber/(rb/30)).toFixed(0)+'d';}},
        {l:'PMP — Pagamento (dias)',fn:d=>{const cmv=Math.abs(d.dre.cmvTotal_tej||0)||d.dre.recLiq_tej*0.727;const compras=cmv+(d.bp.estoques||0)-(d.bp.estoquesAnt||d.bp.estoques||0);return (d.bp.fornecedores/((compras>0?compras:cmv)/30)).toFixed(0)+'d';}},
        {l:'ROE %',fn:d=>fPS((d.dre.resLucroLiq_tej||0)/(d.bp.patrimonioLiq||1)*100,1)+'%'},
        {l:'ROA %',fn:d=>fPS((d.dre.resLucroLiq_tej||0)/(d.bp.totalAtivo||1)*100,1)+'%'},
        {l:'Liquidez Corrente',fn:d=>d.bp.liquidezCorrente.toFixed(2)+'x'},
        {l:'Dívida Total',fn:d=>fM(d.bp.financiamentosPC+d.bp.financiamentosPNC)},
        {l:'EBITDA',fn:d=>fM(d.dre.ebitda_tej||0)},
      ].map(row=>`<tr><th>${row.l}</th>${sl.map(d=>`<td class="cv">${row.fn(d)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;

  fp.innerHTML=toolbar+tabela;
}

// ============================================================
// MÓDULO PREVISÃO / ESTRATÉGIA
// ============================================================
// Parâmetros históricos calculados automaticamente dos dados reais
// Estes valores são recalculados cada vez que o módulo carrega
let PARAMS = {
  pctDeducoes:  8.22,   // % de deduções sobre receita bruta
  pctCMV:       72.7,   // % CMV sobre receita líquida
  pctDespVar:   4.7,    // % despesas variáveis sobre receita líquida
  despFixasMes: 2208705,// despesas fixas mensais (média histórica)
  pctEbitda:    6.5,    // % EBITDA histórico (referência)
  pctLucroFin:  2.3,    // % lucro final histórico (referência)
  pme:          20,     // prazo médio estoque (dias)
  pmr:          17,     // prazo médio recebimento (dias)
  pmp:          21,     // prazo médio pagamento (dias)
  recLiqMedMes: 13614346, // receita líquida média mensal histórica
};

async function calcularParams(){
  // Recalcula os parâmetros com os dados reais carregados
  try {
    const [fcDados, dreDados, bpDados] = await Promise.all([
      Promise.all(ARQ.operacional.map(a=>loadCSV('operacional',a))),
      Promise.all(ARQ_DRE.operacional.map(a=>loadDRE(a))),
      Promise.all(ARQ_BP.operacional.map(a=>loadBP(a))),
    ]);
    const validos = fcDados.filter(Boolean).map(fc=>{
      const dre=dreDados.find(d=>d&&d.rot===fc.rot);
      const bp=bpDados.find(d=>d&&d.rot===fc.rot);
      if(!dre||!bp)return null;
      const rl=dre.recLiq_tej||0;
      const rb=dre.recBruta_tej||rl;
      if(!rl)return null;
      return {
        recLiq:rl, recBruta:rb,
        cmv: dre.cmvTotal_tej||0,
        despVar: dre.despVariaveis_tej||0,
        despFixas: dre.despFixas_tej||0,
        ebitda: dre.ebitda_tej||0,
        lucroFin: dre.resLucroLiq_tej||0,
        estoques: bp.estoques||0,
        clientes: bp.contasReceber||0,
        fornec: bp.fornecedores||0,
      };
    }).filter(Boolean);
    if(!validos.length)return;
    const n=validos.length;
    const avg=k=>validos.reduce((s,d)=>s+(d[k]||0),0)/n;
    const avgPct=(num,den)=>validos.reduce((s,d)=>s+(d[den]?d[num]/d[den]*100:0),0)/n;
    PARAMS = {
      pctDeducoes: validos.reduce((s,d)=>s+(d.recBruta?((d.recBruta-d.recLiq)/d.recBruta*100):0),0)/n,
      pctCMV:      avgPct('cmv','recLiq'),
      pctDespVar:  avgPct('despVar','recLiq'),
      despFixasMes:avg('despFixas'),
      pctEbitda:   avgPct('ebitda','recLiq'),
      pctLucroFin: avgPct('lucroFin','recLiq'),
      // Fórmulas corretas: PME/CMV, PMR/RecBruta, PMP/Compras
      pme: validos.reduce((s,d)=>s+(d.cmv>0?d.estoques/(d.cmv/30):0),0)/n,
      pmr: validos.reduce((s,d)=>s+(d.recBruta>0?d.clientes/(d.recBruta/30):0),0)/n,
      // PMP usa Compras = CMV + ΔEstoque como denominador
      pmp: validos.reduce((s,d)=>s+(d.cmv>0?d.fornec/((d.cmv+d.estoques-(d.estoquesAnt||d.estoques))/30||d.cmv/30):0),0)/n,
      recLiqMedMes: avg('recLiq'),
    };
  } catch(e){ console.log('Usando parâmetros padrão',e); }
}

async function renderPrevisao(){
  document.getElementById('main').innerHTML=`
    <div class="mtabs">
      <button class="mtab ${S.pag===1?'active':''}" onclick="setPag(1)">Simulador de Faturamento</button>

window.atualizarSimulador=function(){
  const recBruta = parseFloat(document.getElementById('sim-receita')?.value)||0;
  const estoqueMode = parseInt(document.getElementById('sim-estoque')?.value)||0;
  const invest = parseFloat(document.getElementById('sim-invest')?.value)||0;
  if(!recBruta)return;

  // DRE PROJETADA
  const deducoes   = recBruta * PARAMS.pctDeducoes/100;
  const recLiq     = recBruta - deducoes;
  const cmv        = recLiq * PARAMS.pctCMV/100;
  const margVenda  = recLiq - cmv;
  const despVar    = recLiq * PARAMS.pctDespVar/100;
  const margContr  = margVenda - despVar;
  const despFixas  = PARAMS.despFixasMes;
  const ebitda     = margContr - despFixas;
  const lucroLiq   = ebitda * (PARAMS.pctLucroFin/PARAMS.pctEbitda||1); // proporção histórica

  // CAPITAL DE GIRO PROJETADO
  const estNec     = recLiq/30 * PARAMS.pme;  // estoque necessário
  const clientesNec= recLiq/30 * PARAMS.pmr;  // contas a receber necessárias
  const fornecNec  = recLiq/30 * PARAMS.pmp;  // fornecedores projetados

  // VARIAÇÃO DE CAPITAL DE GIRO vs média histórica
  const dEstoque   = estoqueMode===0 ? 0 : estoqueMode===1 ? estNec - PARAMS.recLiqMedMes/30*PARAMS.pme : -(PARAMS.recLiqMedMes/30*PARAMS.pme*0.1);
  const dClientes  = clientesNec - PARAMS.recLiqMedMes/30*PARAMS.pmr;
  const dFornec    = fornecNec   - PARAMS.recLiqMedMes/30*PARAMS.pmp;

  // GERAÇÃO DE CAIXA
  const geraCaixa  = ebitda - dEstoque - dClientes + dFornec - invest;

  // Montar resultado
  const row=(label,val,destaque,indent)=>{
    const cls=val<0?'bad':val>0?'good':'';
    return `<tr class="${destaque?'rs':''}">
      <td style="font-size:13px;padding:8px 10px;text-align:left;${indent?'padding-left:24px;color:var(--muted)':''}">${label}</td>
      <td style="font-size:13px;font-weight:700;text-align:right;padding:8px 10px" class="${destaque?cls:''}">${fM(val)}</td>
      <td style="font-size:12px;text-align:right;padding:8px 10px;color:var(--muted)">${recLiq?fPS(val/recLiq*100,1)+'%':''}</td>
    </tr>`;
  };

  const pctVar=(val,base)=>base?((val-base)/Math.abs(base)*100):0;
  const histMedio=PARAMS.recLiqMedMes;
  const compareRow=(label,val,hist)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px">
      <span style="color:var(--muted)">${label}</span>
      <div style="text-align:right">
        <span style="font-weight:700">${fM(val)}</span>
        <span class="${dcls(val-hist)}" style="margin-left:8px;font-size:11px">${fP(pctVar(val,hist))} vs média</span>
      </div>
    </div>`;

  document.getElementById('sim-resultado').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div>
        <div class="section" style="margin-bottom:10px">
          <div class="shead"><h2>DRE Projetada</h2><span class="legend">mês simulado</span></div>
          <div class="twrap">
            <table style="width:100%">
              <thead><tr>
                <th style="text-align:left;padding:8px 10px">Linha</th>
                <th style="text-align:right;padding:8px 10px">Valor</th>
                <th style="text-align:right;padding:8px 10px">A.V.%</th>
              </tr></thead>
              <tbody>
                ${row('Receita Bruta',recBruta,false,false)}
                ${row('(-) Deduções / Impostos',-deducoes,false,true)}
                ${row('(=) Receita Operacional Líquida',recLiq,true,false)}
                ${row('(-) CMV',-cmv,false,true)}
                ${row('(=) Margem de Venda',margVenda,true,false)}
                ${row('(-) Despesas Variáveis',-despVar,false,true)}
                ${row('(=) Margem de Contribuição',margContr,true,false)}
                ${row('(-) Despesas Fixas',-despFixas,false,true)}
                ${row('(=) EBITDA',ebitda,true,false)}
                ${row('(=) Lucro Líquido Estimado',lucroLiq,true,false)}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div>
        <div class="section" style="margin-bottom:10px">
          <div class="shead"><h2>Impacto no Caixa</h2></div>
          <table style="width:100%">
            <tbody>
              <tr class="rs"><td style="padding:8px 10px;font-size:13px">EBITDA gerado</td>
                <td style="text-align:right;font-weight:700;padding:8px 10px" class="${ebitda>=0?'good':'bad'}">${fM(ebitda)}</td></tr>
              <tr><td style="padding:6px 10px;font-size:12px;color:var(--muted);padding-left:20px">(+/-) Var. Estoques</td>
                <td style="text-align:right;font-size:12px;padding:6px 10px" class="${dcls(-dEstoque)}">${fM(-dEstoque)}</td></tr>
              <tr><td style="padding:6px 10px;font-size:12px;color:var(--muted);padding-left:20px">(+/-) Var. Clientes</td>
                <td style="text-align:right;font-size:12px;padding:6px 10px" class="${dcls(-dClientes)}">${fM(-dClientes)}</td></tr>
              <tr><td style="padding:6px 10px;font-size:12px;color:var(--muted);padding-left:20px">(+/-) Var. Fornecedores</td>
                <td style="text-align:right;font-size:12px;padding:6px 10px" class="${dcls(dFornec)}">${fM(dFornec)}</td></tr>
              ${invest>0?`<tr><td style="padding:6px 10px;font-size:12px;color:var(--muted);padding-left:20px">(-) Investimentos</td>
                <td style="text-align:right;font-size:12px;padding:6px 10px;color:var(--bad)">${fM(-invest)}</td></tr>`:''}
              <tr class="rs"><td style="padding:8px 10px;font-size:13px">Geração de Caixa Estimada</td>
                <td style="text-align:right;font-weight:700;padding:8px 10px" class="${geraCaixa>=0?'good':'bad'}">${fM(geraCaixa)}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="section">
          <div class="shead"><h2>Capital de Giro Necessário</h2></div>
          ${compareRow('Estoque necessário',estNec,PARAMS.recLiqMedMes/30*PARAMS.pme)}
          ${compareRow('Clientes (a receber)',clientesNec,PARAMS.recLiqMedMes/30*PARAMS.pmr)}
          ${compareRow('Fornecedores (a pagar)',fornecNec,PARAMS.recLiqMedMes/30*PARAMS.pmp)}
          <div style="margin-top:10px;padding:10px;background:#f0f5ff;border-radius:8px;font-size:12px;line-height:1.7">
            <strong>Necessidade líquida de CG:</strong> ${fM(estNec+clientesNec-fornecNec)}<br>
            Ciclo financeiro projetado: <strong>${(PARAMS.pme+PARAMS.pmr-PARAMS.pmp).toFixed(0)} dias</strong>
          </div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="shead"><h2>Comparação com histórico</h2></div>
      <div class="cards">
        ${[
          {t:'Receita Líquida',v:recLiq,h:histMedio},
          {t:'EBITDA',v:ebitda,h:histMedio*PARAMS.pctEbitda/100},
          {t:'Lucro Líquido',v:lucroLiq,h:histMedio*PARAMS.pctLucroFin/100},
          {t:'Geração de Caixa',v:geraCaixa,h:PARAMS.recLiqMedMes*PARAMS.pctLucroFin/100},
        ].map(it=>{
          const d=it.v-it.h;
          const p=it.h?(d/Math.abs(it.h)*100):0;
          return `<div class="kcard" style="min-height:0;padding:12px">
            <h3>${it.t}</h3>
            <div class="kval ${it.v<0?'bad':''}" style="font-size:20px">${fM(it.v)}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">Média histórica: ${fM(it.h)}</div>
            <div style="font-size:12px;margin-top:2px"><span class="${dcls(d)}">${fM(d)} · ${fP(p)}</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
};

window.atualizarProjecao=function(){
  const base   = parseFloat(document.getElementById('proj-base')?.value)||PARAMS.recLiqMedMes;
  const cresc  = parseFloat(document.getElementById('proj-cresc')?.value)||0;
  const mesIni = document.getElementById('proj-mesini')?.value||'abr/26';

  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const [mesStr,anoStr]=mesIni.split('/');
  let iMes=meses.indexOf(mesStr);
  let iAno=parseInt('20'+anoStr);

  let caixaAcum=0;
  let rows='';
  let totalRecLiq=0,totalEbitda=0,totalLucro=0,totalCaixa=0;

  for(let i=0;i<12;i++){
    const recLiq  = base * Math.pow(1+cresc/100, i);
    const recBruta= recLiq/(1-PARAMS.pctDeducoes/100);
    const cmv     = recLiq * PARAMS.pctCMV/100;
    const despVar = recLiq * PARAMS.pctDespVar/100;
    const ebitda  = recLiq - cmv - despVar - PARAMS.despFixasMes;
    const lucro   = ebitda * (PARAMS.pctLucroFin/PARAMS.pctEbitda||1);
    // Sem variação de CG (estoque estável)
    const caixaMes= ebitda;
    caixaAcum    += caixaMes;
    totalRecLiq  += recLiq;
    totalEbitda  += ebitda;
    totalLucro   += lucro;
    totalCaixa   += caixaMes;

    const rot=meses[iMes]+'/'+String(iAno).slice(2);
    iMes=(iMes+1)%12;
    if(iMes===0)iAno++;

    rows+=`<tr>
      <td style="font-weight:700;padding:7px 10px">${rot}</td>
      <td class="cv">${fM(recLiq)}</td>
      <td class="cv">${fM(cmv)}</td>
      <td class="cv">${fM(recLiq-cmv-despVar)}</td>
      <td class="cv">${fM(ebitda)}</td>
      <td class="cv ${ebitda>0?'good':'bad'}">${fPS(ebitda/recLiq*100,1)}%</td>
      <td class="cv ${lucro>0?'good':'bad'}">${fM(lucro)}</td>
      <td class="cv ${caixaMes>0?'good':'bad'}">${fM(caixaMes)}</td>
      <td class="cv ${caixaAcum>0?'good':'bad'}">${fM(caixaAcum)}</td>
    </tr>`;
  }

  document.getElementById('proj-resultado').innerHTML=`
    <div class="cards" style="margin-bottom:14px">
      ${[
        {t:'Receita Líquida Total',v:totalRecLiq},
        {t:'EBITDA Total',v:totalEbitda},
        {t:'Lucro Líquido Total',v:totalLucro},
        {t:'Geração de Caixa Total',v:totalCaixa},
      ].map(it=>`<div class="kcard" style="min-height:0;padding:12px">
        <h3>${it.t}</h3>
        <div class="kval ${it.v<0?'bad':''}" style="font-size:20px">${fM(it.v)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Média mensal: ${fM(it.v/12)}</div>
      </div>`).join('')}
    </div>
    <div class="twrap"><table>
      <thead><tr>
        <th style="text-align:left">Mês</th>
        <th>Rec. Líquida</th><th>CMV</th><th>Marg. Contrib.</th>
        <th>EBITDA</th><th>Margem %</th><th>Lucro Liq.</th>
        <th>Caixa Mês</th><th>Caixa Acum.</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
};

const ARQ_BAL = {
  tejotao: ['bal0125.Html','bal0225.Html','bal0325.Html','bal0425.Html','bal0525.Html',
            'bal0625.Html','bal0725.Html','bal0825.Html','bal0925.Html','bal1025.Html',

const UNIDADES_BAL = [

  {id:'mg',    label:'Mato Grosso',  siCol:10, debCol:12, credCol:13, sfCol:14, orcCol:43},
  {id:'mv',    label:'Melo Viana',   siCol:16, debCol:18, credCol:19, sfCol:20, orcCol:46},
  {id:'am',    label:'Amazonas',     siCol:22, debCol:24, credCol:25, sfCol:26, orcCol:49},
  {id:'il',    label:'Interlagos',   siCol:28, debCol:30, credCol:31, sfCol:32, orcCol:52},
  {id:'ind',   label:'Indústria',    siCol:34, debCol:36, credCol:37, sfCol:38, orcCol:55},

function rotBAL(arq){
  // bal0125.Html → jan/25
  const m = arq.match(/bal(\d{2})(\d{2})\.Html/i);
  if(!m) return arq;
  const meses=['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return (meses[parseInt(m[1])]||m[1])+'/'+m[2];
}

async function loadBAL(arq){
  const k='bal/'+arq;
  if(S.cache[k]) return S.cache[k];
  try{
    const r=await fetch(`${BASE}/data/balancete/${encodeURIComponent(arq)}`);
    if(!r.ok) return null;
    const buf=await r.arrayBuffer();
    // Balancete HTML exportado em latin-1 (Windows-1252)
    const txt=new TextDecoder('windows-1252').decode(buf);
    const d=parseBAL(txt,arq);
    S.cache[k]=d; return d;
  }catch(e){ return null; }
}

function parseBAL(html, arq){
  // Parser de HTML simples via regex para extrair células da tabela
  const rows=[];
  const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  const tdRe=/<t[dh][^>]*>[\s\S]*?<\/t[dh]>/gi;
  const valRe=/<div[^>]*>([\s\S]*?)<\/div>/i;
  let trMatch;
  while((trMatch=trRe.exec(html))!==null){
    const cells=[];
    let tdMatch;
    const tdRe2=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi;
    while((tdMatch=tdRe2.exec(trMatch[1]))!==null){
      const v=valRe.exec(tdMatch[0]);
      cells.push(v?v[1].replace(/<[^>]+>/g,'').trim():'');
    }
    if(cells.length>4) rows.push(cells);
  }

  function pm(t){
    if(!t||!t.trim()) return 0;
    try{ return parseFloat(t.replace(/\./g,'').replace(',','.')); }catch(e){ return 0; }
  }

  // Filtrar linhas de dados (classificação começa com número)
  const contas=rows.filter(r=>r[0]&&/^\d/.test(r[0])&&r.length>8);

  return {
    rot: rotBAL(arq), arq,
    contas: contas.map(r=>({
      classif: r[0]||'',
      descricao: r[1]||'',
      conta: r[2]||'',
      tipo: r[3]||'',
      nivel: (r[0]||'').split('.').length,
      dbcr: r[9]||'',
      // Valores por unidade
      total:   {si:pm(r[4]),  deb:pm(r[6]),  cred:pm(r[7]),  sf:pm(r[8]),  orc:pm(r[40])},
      mg:      {si:pm(r[10]), deb:pm(r[12]), cred:pm(r[13]), sf:pm(r[14]), orc:pm(r[43])},
      mv:      {si:pm(r[16]), deb:pm(r[18]), cred:pm(r[19]), sf:pm(r[20]), orc:pm(r[46])},
      am:      {si:pm(r[22]), deb:pm(r[24]), cred:pm(r[25]), sf:pm(r[26]), orc:pm(r[49])},
      il:      {si:pm(r[28]), deb:pm(r[30]), cred:pm(r[31]), sf:pm(r[32]), orc:pm(r[52])},
      ind:     {si:pm(r[34]), deb:pm(r[36]), cred:pm(r[37]), sf:pm(r[38]), orc:pm(r[55])},
    }))
  };
}

function renderBalContasOnly(){

    return true;

    const g=c.classif.split('.')[0];

    const fw=isSint?'700':'400';

    return `<tr style="background:${bg}">

      <td style="padding:6px 10px;font-size:11px;color:var(--muted);text-align:center">${c.conta}</td>
      <td style="padding:6px 10px;font-size:12px;text-align:right;font-weight:${fw}">${fM(v.si)}</td>
      <td style="padding:6px 10px;font-size:12px;text-align:right;color:#1d4ed8">${fM(v.deb)}</td>
      <td style="padding:6px 10px;font-size:12px;text-align:right;color:#15803d">${fM(v.cred)}</td>
      <td style="padding:6px 10px;font-size:12px;text-align:right;color:#7c3aed;font-weight:${isSint?'700':'400'}">${

      ${v.orc?`<td style="padding:6px 10px;font-size:11px;text-align:right;color:var(--muted)">${fM(v.orc)}</td>
      <td style="padding:6px 10px;font-size:11px;text-align:right;color:${sf>=v.orc?'var(--good)':'var(--bad)'}">${v.orc?fPS(sf/v.orc*100,0)+'%':'—'}</td>`:''}
    </tr>`;
  }).join('');

  const temOrc=contas.some(c=>c[u].orc>0);

  document.getElementById('bal-tabela').innerHTML=`

window.setModulo=function(mod,btn){
  S.modulo=mod;S.pag=1;S.ini=null;S.fim=null;

  btn.classList.add('active');
  render();
}
window.setEmp=function(e,btn){
  S.emp=e;S.ini=null;S.fim=null;S.cache={};
  S.p2aS=null;S.p2aE=null;S.p2bS=null;S.p2bE=null;
  document.querySelectorAll('#btnEmp .btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');render();
}
window.setQ=function(n,total){
  let rots;
  if(S.modulo==='dre') rots=ARQ_DRE.operacional.map(a=>rotDRE(a));
  else if(S.modulo==='bp') rots=ARQ_BP.operacional.map(a=>rotBP(a));
  else if(S.modulo==='intel') rots=ARQ.operacional.map(a=>rot(a));
  else{ const lista=S.emp==='consolidado'?ARQ.operacional:(ARQ[S.emp]||[]); rots=lista.map(a=>rot(a)); }
  if(n===0||n>=rots.length){S.ini=rots[0];S.fim=rots[rots.length-1];}
  else{S.ini=rots[rots.length-n];S.fim=rots[rots.length-1];}
  if(S.modulo==='dre')renderDREP1();
  else if(S.modulo==='bp')renderBPP1();
  else if(S.modulo==='intel')renderIntelP2();
  else renderP1();
}
