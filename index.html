<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DNA de PJ — O Código Genético do Seu Negócio</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--soft:#eef2ff;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.wrap{max-width:1800px;margin:0 auto}
.header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header-title{font-size:18px;font-weight:800;color:var(--accent)}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px}
.controls{background:var(--card);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.cg{display:flex;flex-direction:column;gap:3px}
.cg label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btngrp{display:flex;gap:5px;flex-wrap:wrap}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--soft);border-color:#c7d2fe}
.btn.active{background:var(--soft);border-color:#c7d2fe;color:#1e3a8a}
.btn.off{opacity:.4;cursor:not-allowed}
.main{padding:12px 20px}
.mtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mtab{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:12px;font-weight:700}
.mtab.active{background:var(--soft);border-color:#c7d2fe;color:#1e3a8a}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--card);padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.tg{display:flex;flex-direction:column;gap:3px}
.tg label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.tg select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;cursor:pointer}
.qbtns{display:flex;gap:5px;flex-wrap:wrap}
.qbtn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px;font-weight:700;cursor:pointer}
.qbtn.active{background:var(--soft);border-color:#c7d2fe;color:#1e3a8a}
/* Cards — 4 colunas fixas, compactas */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:150px;display:flex;flex-direction:column}
.kcard h3{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.kval{font-size:20px;font-weight:800;margin-bottom:3px}
.kmeta{font-size:11px;line-height:1.45;color:var(--muted);flex:1}
.kchartbox{margin-top:6px;height:42px;border-top:1px dashed var(--line);padding-top:5px}
.good{color:var(--good);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.neutral{color:#374151;font-weight:700}
/* Análise — 4 colunas fixas */
.analysis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.aitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.aitem .ak{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
.aitem .av{font-size:16px;font-weight:800;margin:3px 0}
.aitem .as{font-size:11px;line-height:1.4;color:var(--muted)}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.shead h2{font-size:15px}
.legend{font-size:11px;color:var(--muted)}
/* Tabela — compacta, coluna descrição menor */
.twrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:560px}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;background:#fff}
thead th{position:sticky;top:0;z-index:3;background:#f8fafc;border-bottom:1px solid var(--line);padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#475569;white-space:nowrap;text-align:center}
tbody td,tbody th{border-bottom:1px solid #f1f5f9;padding:7px 10px;vertical-align:middle}
tbody th{position:sticky;left:0;z-index:2;background:#fff;min-width:220px;max-width:220px;font-size:12px;text-align:left}
tbody td{text-align:center}
tbody tr.rg>th{background:#f8fafc;font-weight:800;font-size:10px;text-transform:uppercase;color:#475569;letter-spacing:.04em}
tbody tr.rs>th,tbody tr.rs td{background:#fafafa;font-weight:700}
.cv{font-weight:700;white-space:nowrap;font-size:12px}
.cp{font-size:10px;color:var(--muted)}
th.ctot{position:sticky;right:0;z-index:4;background:#e8eefc;min-width:140px;text-align:center}
td.ctot{position:sticky;right:0;z-index:1;background:#f0f5ff;box-shadow:-1px 0 0 var(--line);min-width:140px;text-align:center}
tbody tr.rs td.ctot{background:#e4edff}
.p2grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.ccard h3{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.citem{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f1f5f9}
.citem:last-child{border-bottom:none}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-row>div:first-child{font-size:12px;min-width:160px}
.bar-track{flex:1;display:flex;flex-direction:column;gap:3px}
.bar-a{height:6px;background:rgba(29,78,216,.75);border-radius:3px}
.bar-b{height:6px;background:rgba(15,118,110,.65);border-radius:3px}
.bar-leg{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:8px}
.bar-leg span{display:flex;align-items:center;gap:4px}
.bar-leg i{width:12px;height:6px;border-radius:2px;display:inline-block}
.up{color:var(--good);font-weight:700;font-size:12px}
.down{color:var(--bad);font-weight:700;font-size:12px}
.sumtext p{margin-bottom:7px;font-size:12px;line-height:1.55}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.errmsg{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;color:#b91c1c;font-size:12px;margin:10px 0}
@media(max-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}.analysis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.analysis{grid-template-columns:repeat(2,1fr)}.p2grid{grid-template-columns:1fr}}
@media(max-width:500px){.cards,.analysis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="header">
  <div style="display:flex;align-items:center;gap:14px">
    <svg width="38" height="38" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg">
      <!-- Dupla hélice estilizada -->
      <!-- Fita 1 — azul -->
      <path d="M8,4 C8,4 18,10 18,19 C18,28 8,34 8,34" 
            fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Fita 2 — azul claro -->
      <path d="M30,4 C30,4 20,10 20,19 C20,28 30,34 30,34" 
            fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Ligações horizontais (bases nitrogenadas) -->
      <line x1="10" y1="9"  x2="28" y2="9"  stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="13" y1="14" x2="25" y2="14" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="11" y1="19" x2="27" y2="19" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="13" y1="24" x2="25" y2="24" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="29" x2="28" y2="29" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </svg>
    <div>
      <div class="header-title">DNA de PJ</div>
      <div class="header-sub">O código genético do seu negócio · Controladoria Estratégica</div>
    </div>
  </div>
  <div style="font-size:11px;color:var(--muted)" id="hinfo"></div>
</div></div>
<div class="wrap"><div class="controls">
  <div class="cg">
    <label>Empresa</label>
    <div class="btngrp" id="btnEmp">
      <button class="btn active" onclick="setEmp('operacional',this)">Operacional</button>
      <button class="btn" onclick="setEmp('holding',this)">Holding</button>
      <button class="btn" onclick="setEmp('consolidado',this)">Consolidado</button>
    </div>
  </div>
  <div class="cg">
    <label>Módulo</label>
    <div class="btngrp">
      <button class="btn active" onclick="setModulo('financeiro',this)">Financeiro</button>
      <button class="btn" onclick="setModulo('dre',this)">DRE</button>
      <button class="btn" onclick="setModulo('bp',this)">Balanço Patrimonial</button>
      <button class="btn" onclick="setModulo('bal',this)">Balancete</button>
      <button class="btn" onclick="setModulo('intel',this)">Inteligência</button>
      <button class="btn" onclick="setModulo('prev',this)">Previsão</button>
    </div>
  </div>
</div></div>
<div class="wrap"><div class="main" id="main"></div></div>
<script>
// Sempre usar raw.githubusercontent — funciona tanto local quanto no GitHub Pages
// O CORS não é problema pois raw.githubusercontent tem os headers corretos para leitura
const BASE = 'https://raw.githubusercontent.com/elder901/controladoria-es/main';
let ARQ={
  operacional:['FC jan 2025.csv','FC fev 2025.csv','FC mar 2025.csv','FC abr 2025.csv','FC mai 2025.csv','FC jun 2025.csv','FC jul 2025.csv','FC ago 2025.csv','FC set 2025.csv','FC out 2025.csv','FC nov 2025.csv','FC dez 2025.csv','FC jan 2026.csv','FC fev 2026.csv','FC mar 2026.csv'],
  holding:['S FC jan 2025.csv','S FC fev 2025.csv','S FC mar 2025.csv','S FC abr 2025.csv','S FC mai 2025.csv','S FC jun 2025.csv','S FC jul 2025.csv','S FC ago 2025.csv','S FC set 2025.csv','S FC out 2025.csv','S FC nov 2025.csv','S FC dez 2025.csv','S FC jan 2026.csv','S FC fev 2026.csv','S FC mar 2026.csv','S FC jul 2026.csv']
};
const CM={
  'Total de Vendas Recebidas':'totVendas',
  '( - ) Recebimentos S/ Movimento de Caixa':'recSemMov',
  '( - ) Deduções':'deducoes',
  '( = ) Vendas Líquidas em Caixa':'vlc',
  '( - ) Compras':'compras',
  '( = ) Margem de Venda':'margemV',
  '( - ) Impostos Sobre Vendas':'impostos',
  '( +) Acordo Comercias':'acordos',
  '( + ) Trocas/Devoluções Recebidas':'trocas',
  '( = ) Sub Total de Acordos Comerciais Geral':'subAcordos',
  '( + ) Outras Entradas Operacionais':'outEnt',
  '( - ) Outras Saídas Operacionais':'outSai',
  '( + ) Cheques Devolvidos Recebidos':'chqRec',
  '( - ) Cheques Devolvidos':'chqDev',
  'Lucro Bruto':'lucroBruto',
  'Despesas Tributárias':'despTrib',
  'Despesas Tributárias - Multas':'despMult',
  'Fretes':'fretes',
  'Despesas C/ Pessoal':'despPess',
  'Despesas Administrativas':'despAdm',
  'Despesas Indedutíveis':'despInded',
  'Doações e Patrocínios':'doacoes',
  'Alugueis':'alugueis',
  'Taxas Adm de Cartões':'taxCart',
  '( - ) Recuperação de Despesas':'recupDesp',
  'Total de Custos Operacionais':'totCustos',
  'LUCRO DAS OPERAÇÕES':'lucroOp',
  'Resultado Financeiro':'resFin',
  'Receita Financeira':'recFin',
  'Despesas Financeiras':'despFin',
  'Lucro Antes do IR':'lucroAIR',
  'Imposto de Renda':'IR',
  'Lucro Líquido':'lucroLiq',
  'Fluxo dos Investimentos & Financiamentos':'fluxoInvest',
  'SAÍDAS':'fluxoSaidas',
  '( - ) Empréstimos Bancários':'emprestimos',
  '( - ) Parcelamentos':'parcelamentos',
  '( - ) Imobilizado/Investimentos':'imobilizado',
  '( - )  Juros S/ Empréstimos':'jurosEmprestimos',
  'ENTRADAS':'fluxoEntradas',
  '( + )  Empréstimos':'emprestimosEnt',
  '( + )  Venda Imobilizados':'vendaImob',
  '( + )   Dividendos Outras Empresas':'dividendos',
  'Fluxo dos Adiantamentos':'fluxoAdiant',
  '( - ) Adiantamentos Efetuados':'adiantEfet',
  '( + ) Adiantamentos Recebidos':'adiantReceb',
  'Fluxo dos Cheques Emitidos':'fluxoCheques',
  '( - ) Cheques Compensados':'chqCompensados',
  '( + ) Cheques Emitidos':'chqEmitidos',
  'NECESSIDADE DE C.G I':'necCG',
  'Acionistas':'acionistas',
  'Recurso de Ligadas':'recursoLigadas',
  'Recurso Enviado a Ligadas':'recursoEnviado',
  'VARIAÇÃO DE CAIXA':'varCaixa',
  'Entradas de Correspondentes':'entCorresp',
  'Saída de Correspondentes':'saiCorresp',
};
let S={emp:'operacional',modulo:'financeiro',pag:1,ini:null,fim:null,cache:{},p2aS:null,p2aE:null,p2bS:null,p2bE:null,avBase:(typeof localStorage!=='undefined'&&localStorage.getItem('dre.avBase'))||'rol'};
S.simAluguelEmp=(typeof localStorage!=='undefined'&&localStorage.getItem('dre.simAluguelEmp')==='1')||false;
const SIM_ALUGUEL_VALOR=100000;
function applySimAluguel(dados){
  if(!(S.emp==='consolidado'&&S.simAluguelEmp))return dados;
  const D=SIM_ALUGUEL_VALOR;
  const ADD=['alugueis','despFixas','despOperacionais'];
  const SUB=['ebitda','ebit','resPeriodo','resLiquido','resLucroLiq','resAposEmp'];
  // resAposEmp incluído pois é downstream de resLucroLiq
  return dados.map(r=>{
    const c={...r};
    ADD.forEach(k=>{c[k+'_emp']=(c[k+'_emp']||0)+D;});
    SUB.forEach(k=>{c[k+'_emp']=(c[k+'_emp']||0)-D;});
    return c;
  });
}
window.setSimAluguel=function(b){
  S.simAluguelEmp=!!b;
  try{localStorage.setItem('dre.simAluguelEmp',S.simAluguelEmp?'1':'0');}catch(e){}
  if(S.modulo==='dre'){if(S.pag===1)renderDREP1();else if(S.pag===2)renderDREP2();}
};
// Base da Análise Vertical da DRE: 'rol' = Receita Operacional Líquida (padrão), 'rbe' = Receita Bruta Efetiva (Produtos)
function avBaseField(){return S.avBase==='rbe'?'recBrutaEfetiva':'recLiq';}
function avBaseLabel(){return S.avBase==='rbe'?'Receita Bruta Efetiva (Produtos)':'Receita Operacional Líquida';}
window.setAvBase=function(b){S.avBase=b;try{localStorage.setItem('dre.avBase',b);}catch(e){}if(S.modulo==='dre'){if(S.pag===1)renderDREP1();else if(S.pag===2)renderDREP2();}};
const fM=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2}).format(v||0);
const fP=(v,c=1)=>!isFinite(v)||isNaN(v)?'—':(v>=0?'+':'')+v.toFixed(c)+'%';
const fPS=(v,c=1)=>!isFinite(v)||isNaN(v)?'—':v.toFixed(c)+'%';
const rot=a=>{const m=a.match(/\b(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\b\s+(\d{4})/i);return m?m[1].toLowerCase()+'/'+m[2].slice(2):a;};
const dcls=v=>v>0?'good':v<0?'bad':'neutral';

async function loadCSV(emp,arq){
  const k=emp+'/'+arq;
  if(S.cache[k])return S.cache[k];
  try{
    const r=await fetch(`${BASE}/data/${emp}/${encodeURIComponent(arq)}`);
    if(!r.ok)return null;
    const buf=await r.arrayBuffer();
    let txt;
    try{txt=new TextDecoder('utf-8').decode(buf);}catch(e){txt=new TextDecoder('latin-1').decode(buf);}
    const d=parseCSV(txt,arq);
    S.cache[k]=d;return d;
  }catch(e){return null;}
}
function parseCSV(txt,arq){
  const lines=txt.split(/\r?\n/);
  const d={rot:rot(arq),arq};
  // Período da linha 1
  if(lines[1]){const m=lines[1].match(/Per[^:]*:([^;]+)/);if(m)d.periodo=m[1].trim();}
  // Leitura por posição — imune a encoding
  const L={
    4:'vendasDinheiro',5:'vendasCredito',6:'vendasDebito',7:'vendasClientes',
    8:'vendasPix',9:'vendasCheques',
    10:'totVendas',11:'recSemMov',12:'deducoes',13:'vlc',
    14:'compras',15:'margemV',16:'impostos',17:'acordos',18:'trocas',
    19:'subAcordos',20:'outEnt',21:'outSai',22:'chqRec',23:'chqDev',
    24:'lucroBruto',26:'despTrib',27:'despMult',28:'fretes',29:'despPess',
    30:'despAdm',31:'despInded',32:'doacoes',33:'alugueis',34:'taxCart',
    35:'recupDesp',36:'totCustos',37:'lucroOp',38:'resFin',39:'recFin',
    40:'despFin',41:'lucroAIR',42:'IR',43:'lucroLiq',
    44:'fluxoInvest',45:'fluxoSaidas',46:'emprestimos',47:'parcelamentos',
    48:'imobilizado',49:'jurosEmprestimos',
    50:'fluxoEntradas',51:'emprestimosEnt',52:'vendaImob',53:'dividendos',
    54:'fluxoAdiant',55:'adiantEfet',56:'adiantReceb',
    57:'fluxoCheques',58:'chqCompensados',59:'chqEmitidos',
    60:'necCG',61:'acionistas',62:'recursoLigadas',63:'recursoEnviado',
    64:'varCaixa',65:'resgate',66:'aplicacao',
    67:'entCorresp',68:'saiCorresp'};
  for(const [i,c] of Object.entries(L)){
    const l=lines[+i];if(!l)continue;
    const p=l.split(';');if(p.length>3)d[c]=parseMoeda(p[3]);
  }
  // Saldo Inicial e Final do mês — coluna J (índice 9), linhas 5 e 6 (0-index 4 e 5)
  if(lines[4]){const p=lines[4].split(';');if(p.length>9)d.saldoIni=parseMoeda(p[9]);}
  if(lines[5]){const p=lines[5].split(';');if(p.length>9)d.saldoFim=parseMoeda(p[9]);}
  return d;
}
function parseMoeda(t){if(!t||!t.trim())return 0;const n=parseFloat(t.replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n;}
function soma(dados){
  const t={months:dados.length};
  for(const k of Object.values(CM))t[k]=dados.reduce((s,d)=>s+(d[k]||0),0);
  return t;
}
function combinar(op,hd){
  // Consolidado = soma apenas os meses que existem nos DOIS (interseção)
  // Isso garante que não aparece mês só da holding (como jul/26) sem o operacional
  const rotsHd = new Set(hd.filter(Boolean).map(h=>h.rot));
  return op
    .filter(dO=>dO && rotsHd.has(dO.rot))
    .map(dO=>{
      const dH=hd.find(h=>h&&h.rot===dO.rot);
      if(!dH)return null;
      const c={rot:dO.rot,arq:dO.arq,periodo:dO.periodo};
      for(const k of Object.values(CM))c[k]=(dO[k]||0)+(dH[k]||0);
      c.saldoIni=(dO.saldoIni||0)+(dH.saldoIni||0);
      c.saldoFim=(dO.saldoFim||0)+(dH.saldoFim||0);
      return c;
    })
    .filter(Boolean);
}
// setEmp e setPag definidas como window.* abaixo
function render(){
  if(S.modulo==='dre')renderDRE();
  else if(S.modulo==='bp')renderBP();
  else if(S.modulo==='intel')renderIntel();
  else if(S.modulo==='prev')renderPrevisao();
  else if(S.modulo==='bal')renderBalancete();
  else renderFin();
}
function renderFin(){
  document.getElementById('main').innerHTML=`
    <div class="mtabs">
      <button class="mtab ${S.pag===1?'active':''}" onclick="setPag(1)">Página 1 · Análise Mensal</button>
      <button class="mtab ${S.pag===2?'active':''}" onclick="setPag(2)">Página 2 · Comparação de Períodos</button>
    </div>
    <div id="fp"><div class="loading">Carregando dados...</div></div>`;
  if(S.pag===1)renderP1();else renderP2();
}
async function getDados(){
  const lista=S.emp==='consolidado'?ARQ.operacional:(ARQ[S.emp]||[]);
  let d=await Promise.all(lista.map(a=>loadCSV(S.emp==='consolidado'?'operacional':S.emp,a)));
  if(S.emp==='consolidado'){
    const dH=await Promise.all(ARQ.holding.map(a=>loadCSV('holding',a)));
    d=combinar(d,dH.filter(Boolean));
  }
  return d.filter(Boolean);
}
async function renderP1(){
  const fp=document.getElementById('fp');
  const dados=await getDados();
  if(!dados.length){fp.innerHTML='<div class="errmsg">Não foi possível carregar os dados. Verifique se os CSVs estão na pasta correta do GitHub.</div>';return;}
  if(!S.ini)S.ini=dados[0].rot;
  if(!S.fim)S.fim=dados[dados.length-1].rot;
  const iI=dados.findIndex(d=>d.rot===S.ini),iF=dados.findIndex(d=>d.rot===S.fim);
  const sl=dados.slice(iI>=0?iI:0,iF>=0?iF+1:dados.length);
  const tot=soma(sl),ult=sl[sl.length-1];
  // Busca o mesmo mês do ano anterior para comparação nos cards
  // Ex: se ult = mar/26, busca mar/25
  const mesUlt=ult.rot.split('/')[0]; // ex: "mar"
  const anoUlt=parseInt('20'+ult.rot.split('/')[1]); // ex: 2026
  const rotAnoAnt=mesUlt+'/'+(anoUlt-1).toString().slice(2); // ex: "mar/25"
  const mesmoPeriodoAnoAnt=dados.find(d=>d.rot===rotAnoAnt)||null;
  // Fallback: se não encontrar o mesmo mês do ano anterior, usa o mês anterior
  const pen=mesmoPeriodoAnoAnt||(sl.length>1?sl[sl.length-2]:null);
  const penLabel=mesmoPeriodoAnoAnt?rotAnoAnt:(sl.length>1?sl[sl.length-2].rot:null);
  fp.innerHTML=buildToolbar1(dados,sl)+buildCards(ult,pen,penLabel,!!mesmoPeriodoAnoAnt)+buildAnalysis(ult,mesmoPeriodoAnoAnt||pen,sl,tot)+'<div id="bancos-box"></div>'+buildTabela(sl,tot);
  buildSparks(dados,sl);
  renderBancosBox(ult.rot, ult.varCaixa||0, sl, tot);
}

// ============================================================
// Disponibilidades — saldos sempre pelo Fluxo de Caixa (FC)
// ============================================================
async function renderBancosBox(rotAlvo, varCaixaCSV, sl, tot){
  const box=document.getElementById('bancos-box');
  if(!box)return;
  const renderSaldosFC=(titulo,subtitulo)=>{
    const corV=v=>v>=0?'var(--good)':'var(--bad)';
    const sg=v=>v>=0?'+':'';
    const acum=tot?(tot.varCaixa||0):(varCaixaCSV||0);
    const meses=sl?sl.length:1;
    const media=acum/(meses||1);
    const ult=sl&&sl.length?sl[sl.length-1]:null;
    const pen=sl&&sl.length>1?sl[sl.length-2]:null;
    const delta=ult&&pen?(ult.varCaixa||0)-(pen.varCaixa||0):0;
    // Saldo Inicial = do primeiro mês do período; Saldo Final = do último mês
    const prim=sl&&sl.length?sl[0]:null;
    const saldoIniPer=prim?(prim.saldoIni||0):0;
    const saldoFimPer=ult?(ult.saldoFim||0):0;
    const variacaoSaldo=saldoFimPer-saldoIniPer;
    const diffFC=variacaoSaldo-acum;
    const okFC=Math.abs(diffFC)<1;
    const badgeFC=okFC
      ? `<span style="font-size:11px;font-weight:700;color:var(--good);background:#dcfce7;padding:3px 8px;border-radius:6px">✓ bate com Variação de Caixa</span>`
      : `<span style="font-size:11px;font-weight:700;color:var(--bad);background:#fef2f2;padding:3px 8px;border-radius:6px">⚠ diverge em ${fM(diffFC)}</span>`;
    const linhasMeses=(sl||[]).slice().reverse().slice(0,12).map(d=>{
      const v=d.varCaixa||0;
      const si=d.saldoIni||0, sf=d.saldoFim||0;
      return `<tr style="border-bottom:1px solid #f1f5f9">
        <td style="padding:8px 10px;font-size:12px;font-weight:600">${d.rot}</td>
        <td style="padding:8px 10px;font-size:12px;color:var(--muted)">${d.periodo||''}</td>
        <td style="padding:8px 10px;font-size:12px;text-align:right;color:var(--muted);white-space:nowrap">${fM(si)}</td>
        <td style="padding:8px 10px;font-size:12px;text-align:right;font-weight:600;white-space:nowrap">${fM(sf)}</td>
        <td style="padding:8px 10px;font-size:13px;font-weight:700;text-align:right;color:${corV(v)};white-space:nowrap">${sg(v)}${fM(v)}</td>
      </tr>`;
    }).join('');
    box.innerHTML=`<div class="section">
      <div class="shead">
        <h2>${titulo}</h2>
        <div style="display:flex;gap:10px;align-items:center"><span style="font-size:11px;color:var(--muted)">${subtitulo}</span> ${badgeFC}</div>
      </div>
      <div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
        <div class="kcard"><h3>Saldo Inicial (${prim?prim.rot:'—'})</h3>
          <div class="kval ${saldoIniPer<0?'bad':''}">${fM(saldoIniPer)}</div>
          <div class="kmeta"><span style="font-size:11px;color:var(--muted)">início do período</span></div></div>
        <div class="kcard"><h3>Saldo Final (${ult?ult.rot:'—'})</h3>
          <div class="kval ${saldoFimPer<0?'bad':''}">${fM(saldoFimPer)}</div>
          <div class="kmeta"><span style="font-size:11px;color:var(--muted)">fim do período</span></div></div>
        <div class="kcard"><h3>Variação no Período (Saldos)</h3>
          <div class="kval" style="color:${corV(variacaoSaldo)};font-size:20px">${sg(variacaoSaldo)}${fM(variacaoSaldo)}</div>
          <div class="kmeta"><span style="font-size:11px;color:var(--muted)">Saldo Final − Saldo Inicial</span></div></div>
        <div class="kcard"><h3>Variação de Caixa (FC) acum.</h3>
          <div class="kval" style="color:${corV(acum)};font-size:20px">${sg(acum)}${fM(acum)}</div>
          <div class="kmeta"><span style="font-size:11px;color:var(--muted)">média mês: ${sg(media)}${fM(media)}</span></div></div>
      </div>
      <div class="twrap" style="max-height:380px">
        <table style="width:100%">
          <thead><tr style="background:#f8fafc;position:sticky;top:0;z-index:2">
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#475569">Mês</th>
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#475569">Período</th>
            <th style="text-align:right;padding:8px 10px;font-size:10px;color:#475569">Saldo Inicial</th>
            <th style="text-align:right;padding:8px 10px;font-size:10px;color:#475569">Saldo Final</th>
            <th style="text-align:right;padding:8px 10px;font-size:10px;color:#475569">Variação de Caixa (FC)</th>
          </tr></thead>
          <tbody>${linhasMeses}
            <tr style="background:#eef2ff;font-weight:800">
              <td colspan="2" style="padding:10px;font-size:12px">PERÍODO (${meses} ${meses===1?'mês':'meses'})</td>
              <td style="padding:10px;text-align:right;font-size:12px">${fM(saldoIniPer)}</td>
              <td style="padding:10px;text-align:right;font-size:12px">${fM(saldoFimPer)}</td>
              <td style="padding:10px;text-align:right;font-size:13px;color:${corV(acum)}">${sg(acum)}${fM(acum)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>`;
  };
  if(S.emp==='holding'){
    renderSaldosFC('Disponibilidades — Holding (Sena)','saldos exclusivamente do FC');
    return;
  }
  if(S.emp==='consolidado'){
    renderSaldosFC('Disponibilidades — Consolidado','soma exata Sena + Tejotão, exclusivamente pelo FC');
    return;
  }
  if(S.emp==='operacional'){
    renderSaldosFC('Disponibilidades — Operacional (Tejotão)','saldos exclusivamente do FC');
    return;
  }
  box.innerHTML='<div class="section"><div class="loading" style="padding:14px">Carregando disponibilidades...</div></div>';
  try{
    // tenta encontrar balancete do mesmo mês; senão usa o mais recente disponível
    const todos=await Promise.all(ARQ_BAL.tejotao.map(a=>loadBAL(a)));
    const disp=todos.filter(Boolean);
    if(!disp.length){box.innerHTML='';return;}
    const bal=disp.find(d=>d.rot===rotAlvo)||disp[disp.length-1];
    const usouFallback=bal.rot!==rotAlvo;
    // Disponibilidades = todas as contas analíticas dentro de 1.1.01.* (caixa, bancos, aplicações)
    // Pegamos contas com classif começando em "1.1.01." E que NÃO sejam totalizadores (TT) sintéticos de subgrupo.
    // Critério: nível >= 5 (1.1.01.XX.YYYY) garante folha; ou tipo!=='TT'
    const disponiveis=bal.contas.filter(c=>
      c.classif.startsWith('1.1.01.')&&c.tipo!=='TT'&&
      (Math.abs(c.total.sf)>0.005||Math.abs(c.total.si||0)>0.005)
    );
    if(!disponiveis.length){box.innerHTML='';return;}
    // Sintético do grupo Disponibilidades (1.1.01) para conferência
    const sint=bal.contas.find(c=>c.classif==='1.1.01'&&c.tipo==='TT');
    const totalSf=disponiveis.reduce((s,c)=>s+(c.total.sf||0),0);
    const totalSi=disponiveis.reduce((s,c)=>s+(c.total.si||0),0);
    // Consolidado: somar saldos da Sena (FC) ao Tejotão (Balancete)
    let senaSi=0, senaSf=0, senaInfo='';
    if(S.emp==='consolidado' && sl && sl.length){
      const rotPrim=sl[0].rot, rotUlt=sl[sl.length-1].rot;
      const senaAll=await Promise.all(ARQ.holding.map(a=>loadCSV('holding',a)));
      const senaPrim=senaAll.find(d=>d&&d.rot===rotPrim);
      const senaUlt =senaAll.find(d=>d&&d.rot===rotUlt);
      senaSi=senaPrim?(senaPrim.saldoIni||0):0;
      senaSf=senaUlt ?(senaUlt.saldoFim ||0):0;
      senaInfo=` + Sena (FC): ini ${fM(senaSi)} / fim ${fM(senaSf)}`;
    }
    const totalSiCons=totalSi+senaSi;
    const totalSfCons=totalSf+senaSf;
    const variacao=totalSfCons-totalSiCons;
    const totalSint=sint?sint.total.sf:totalSf;
    const diff=totalSf-totalSint;
    const ok=Math.abs(diff)<1;
    // Reconciliação com VARIAÇÃO DE CAIXA do CSV (FC)
    const diffCSV=variacao-(varCaixaCSV||0);
    const okCSV=Math.abs(diffCSV)<1;
    // Classifica grupo por classif (caixa = 1.1.01.01, aplic = 1.1.01.02, bancos = 1.1.01.03)
    const grupoNome=cl=>{
      const g=cl.split('.').slice(0,4).join('.');
      if(g==='1.1.01.01')return 'Caixa';
      if(g==='1.1.01.02')return 'Aplicações';
      if(g==='1.1.01.03')return 'Bancos';
      return 'Outros';
    };
    disponiveis.sort((a,b)=>b.total.sf-a.total.sf);
    const totAbs=disponiveis.reduce((s,c)=>s+Math.abs(c.total.sf),0)||1;
    const cor=v=>v<0?'var(--bad)':'#1d4ed8';
    const corG={Caixa:'#f59e0b',Aplicações:'#10b981',Bancos:'#1d4ed8',Outros:'#6b7280'};
    const linhas=disponiveis.map(b=>{
      const v=b.total.sf;
      const vi=b.total.si||0;
      const pct=Math.abs(v)/totAbs*100;
      const g=grupoNome(b.classif);
      return `<tr style="border-bottom:1px solid #f1f5f9">
        <td style="padding:8px 10px;font-size:11px;color:var(--muted);font-family:monospace">${b.classif}</td>
        <td style="padding:8px 10px"><span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:${corG[g]}22;color:${corG[g]}">${g}</span></td>
        <td style="padding:8px 10px;font-size:12px;font-weight:600">${b.descricao||b.conta}</td>
        <td style="padding:8px 10px;font-size:12px;text-align:right;color:var(--muted);white-space:nowrap">${fM(vi)}</td>
        <td style="padding:8px 10px">
          <div style="height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden">
            <div style="height:6px;width:${pct.toFixed(1)}%;background:${cor(v)};border-radius:3px"></div>
          </div>
        </td>
        <td style="padding:8px 10px;font-size:13px;font-weight:700;text-align:right;color:${cor(v)};white-space:nowrap">${fM(v)}</td>
        <td style="padding:8px 10px;font-size:11px;color:var(--muted);text-align:right">${pct.toFixed(1)}%</td>
      </tr>`;
    }).join('');
    const badge=ok
      ? `<span style="font-size:11px;font-weight:700;color:var(--good);background:#dcfce7;padding:3px 8px;border-radius:6px">✓ bate com sintético</span>`
      : `<span style="font-size:11px;font-weight:700;color:var(--bad);background:#fef2f2;padding:3px 8px;border-radius:6px">⚠ diferença ${fM(diff)}</span>`;
    const aviso=usouFallback
      ? `<span style="font-size:11px;color:var(--muted)">balancete de ${rotAlvo} não disponível — exibindo ${bal.rot}</span>`
      : `<span style="font-size:11px;color:var(--muted)">balancete de ${bal.rot}</span>`;
    const corVar=variacao>=0?'var(--good)':'var(--bad)';
    const sinalVar=variacao>=0?'+':'';
    // Subtotais por grupo (Caixa, Aplicações, Bancos)
    const grupos={};
    disponiveis.forEach(c=>{const g=grupoNome(c.classif);if(!grupos[g])grupos[g]={si:0,sf:0,n:0};grupos[g].si+=c.total.si||0;grupos[g].sf+=c.total.sf||0;grupos[g].n++;});
    const ordemG=['Caixa','Bancos','Aplicações','Outros'].filter(g=>grupos[g]);
    const chipsGrupos=ordemG.map(g=>{
      const t=grupos[g];const v=t.sf-t.si;const sg=v>=0?'+':'';
      return `<div class="kcard" style="border-top:3px solid ${corG[g]};min-height:0;padding:12px">
        <h3 style="color:${corG[g]}">${g} <span style="font-size:10px;color:var(--muted);font-weight:500">(${t.n})</span></h3>
        <div class="kval" style="font-size:18px">${fM(t.sf)}</div>
        <div class="kmeta"><span style="font-size:11px;color:var(--muted)">início: ${fM(t.si)}</span><br>
          <span style="font-size:11px">var: <span style="color:${v>=0?'var(--good)':'var(--bad)'};font-weight:700">${sg}${fM(v)}</span></span></div>
      </div>`;
    }).join('');
    const badgeCSV=okCSV
      ? `<span style="font-size:11px;font-weight:700;color:var(--good);background:#dcfce7;padding:3px 8px;border-radius:6px">✓ bate com Variação de Caixa do FC</span>`
      : `<span style="font-size:11px;font-weight:700;color:var(--bad);background:#fef2f2;padding:3px 8px;border-radius:6px">⚠ diverge do FC em ${fM(diffCSV)}</span>`;
    const resumoCards=`<div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
      <div class="kcard"><h3>Saldo Inicial (${bal.rot})</h3>
        <div class="kval">${fM(totalSiCons)}</div>
        <div class="kmeta"><span style="font-size:11px;color:var(--muted)">${disponiveis.length} contas Tejotão${senaInfo?' + Sena (FC)':''}</span></div></div>
      <div class="kcard"><h3>Saldo Final (${bal.rot})</h3>
        <div class="kval ${totalSfCons<0?'bad':''}">${fM(totalSfCons)}</div>
        <div class="kmeta"><span style="font-size:11px;color:var(--muted)">posição ao fim do mês</span></div></div>
      <div class="kcard"><h3>Variação no Mês</h3>
        <div class="kval" style="color:${corVar};font-size:20px">${sinalVar}${fM(variacao)}</div>
        <div class="kmeta"><span style="font-size:11px;color:var(--muted)">Saldo Final − Saldo Inicial</span></div></div>
      <div class="kcard"><h3>Variação de Caixa (FC)</h3>
        <div class="kval" style="font-size:20px">${(varCaixaCSV||0)>=0?'+':''}${fM(varCaixaCSV||0)}</div>
        <div class="kmeta">${badgeCSV}</div></div>
    </div>
    <div class="cards" style="grid-template-columns:repeat(${ordemG.length},1fr);margin-bottom:12px">${chipsGrupos}</div>`;
    box.innerHTML=`<div class="section">
      <div class="shead">
        <h2>Disponibilidades — Caixa, Bancos e Aplicações</h2>
        <div style="display:flex;gap:10px;align-items:center">${aviso} ${badge}</div>
      </div>
      ${resumoCards}
      <div class="twrap" style="max-height:380px">
        <table style="width:100%">
          <thead><tr style="background:#f8fafc;position:sticky;top:0;z-index:2">
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#475569">Classif.</th>
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#475569">Tipo</th>
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#475569;min-width:200px">Conta</th>
            <th style="text-align:right;padding:8px 10px;font-size:10px;color:#475569">Saldo Inicial</th>
            <th style="padding:8px 10px;font-size:10px;color:#475569;min-width:140px">Distribuição</th>
            <th style="text-align:right;padding:8px 10px;font-size:10px;color:#475569">Saldo Final</th>
            <th style="text-align:right;padding:8px 10px;font-size:10px;color:#475569">% do total</th>
          </tr></thead>
          <tbody>${linhas}
            <tr style="background:#eef2ff;font-weight:800">
              <td colspan="3" style="padding:10px;font-size:12px">TOTAL DISPONIBILIDADES (${disponiveis.length} contas)</td>
              <td style="padding:10px;text-align:right;font-size:12px;color:var(--muted)">${fM(totalSi)}</td>
              <td style="padding:10px;text-align:right;font-size:11px;color:${corVar}">${sinalVar}${fM(variacao)}</td>
              <td style="padding:10px;text-align:right;font-size:13px;color:${cor(totalSf)}">${fM(totalSf)}</td>
              <td style="padding:10px;text-align:right;font-size:11px;color:var(--muted)">100%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>`;
  }catch(e){
    console.error('Erro renderBancosBox',e);
    box.innerHTML='';
  }
}
function buildToolbar1(todos,sl){
  const opts=r=>todos.map(d=>`<option value="${d.rot}" ${d.rot===r?'selected':''}>${d.rot}</option>`).join('');
  const n=todos.length;
  return `<div class="toolbar">
    <div class="tg"><label>Início</label><select onchange="S.ini=this.value;renderP1()">${opts(S.ini)}</select></div>
    <div class="tg"><label>Fim</label><select onchange="S.fim=this.value;renderP1()">${opts(S.fim)}</select></div>
    <div class="tg"><label>Atalho</label><div class="qbtns">
      <button class="qbtn ${sl.length===3?'active':''}" onclick="setQ(3,${n})">Últ. 3 meses</button>
      <button class="qbtn ${sl.length===6?'active':''}" onclick="setQ(6,${n})">Últ. 6 meses</button>
      <button class="qbtn ${sl.length===12?'active':''}" onclick="setQ(12,${n})">Últ. 12 meses</button>
      <button class="qbtn ${sl.length===todos.length?'active':''}" onclick="setQ(0,${n})">Período completo</button>
    </div></div>
  </div>`;
}
// setQ definida como window.* abaixo
function buildCards(ult,pen,penLabel,isAnoAnt){
  const items=[
    {t:'Vendas Líquidas em Caixa',c:'vlc',id:'sp0'},
    {t:'Lucro Bruto',c:'lucroBruto',id:'sp1'},
    {t:'Lucro das Operações',c:'lucroOp',id:'sp2'},
    {t:'Resultado Financeiro',c:'resFin',id:'sp3'},
    {t:'Lucro Líquido',c:'lucroLiq',id:'sp4'},
    {t:'Variação de Caixa',c:'varCaixa',id:'sp5'},
    {t:'Total Custos Operacionais',c:'totCustos',id:'sp6'},
    {t:'Lucro Antes do IR',c:'lucroAIR',id:'sp7'},
  ];
  const compLabel=penLabel||pen?.rot||'';
  const compTipo=isAnoAnt?'vs mesmo mês ano anterior':'vs mês anterior';
  return `<div class="cards">${items.map(it=>{
    const v=ult[it.c]||0,pct=ult.vlc?((v/ult.vlc)*100):0;
    const vpen=pen?pen[it.c]||0:null;
    const d=vpen!=null?v-vpen:null;
    const dpct=d!=null&&vpen?((d/Math.abs(vpen))*100):null;
    const varStr=d!=null?`<span class="${dcls(d)}">${fM(d)}</span>${dpct!=null?` · <span class="${dcls(d)}">${fP(dpct)}</span>`:''}`:'-';
    return `<div class="kcard">
      <h3>${it.t}</h3>
      <div class="kval ${v<0?'bad':''}">${fM(v)}</div>
      <div class="kmeta">
        <span style="font-size:11px;color:var(--muted)">P(%) ${ult.rot}: </span><strong>${fPS(pct)}%</strong>
        ${pen?`<br><span style="font-size:11px;color:var(--muted)">${compTipo} (${compLabel}):</span><br>${varStr}`:''}
      </div>
      <div class="kchartbox" id="${it.id}"></div>
    </div>`;
  }).join('')}</div>`;
}
function buildSparks(todos,sl){
  const campos=['vlc','lucroBruto','lucroOp','resFin','lucroLiq','varCaixa','totCustos','lucroAIR'];
  const cores=['#3b82f6','#10b981','#8b5cf6','#6366f1','#f59e0b','#06b6d4','#ef4444','#84cc16'];
  const iS=todos.findIndex(d=>d.rot===sl[0].rot),iE=todos.findIndex(d=>d.rot===sl[sl.length-1].rot);
  campos.forEach((c,i)=>{
    const el=document.getElementById('sp'+i);if(!el)return;
    const vals=todos.map(d=>d[c]||0);
    const W=el.clientWidth||200,H=42;
    const min=Math.min(...vals),max=Math.max(...vals);
    const range=max-min||1;
    const px=(v,idx)=>{
      const x=(idx/(vals.length-1))*(W-4)+2;
      const y=H-2-((v-min)/range)*(H-4);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    };
    // Linha completa (desbotada)
    const ptsFull=vals.map((v,j)=>px(v,j)).join(' ');
    // Linha do período selecionado (colorida)
    const sliceVals=vals.slice(iS,iE+1);

async function renderP2(){

  const rots=dados.map(d=>d.rot);
  const mid=Math.floor(rots.length/2);
  // Usa estado salvo ou calcula padrão inteligente:
  // Período A = primeiro trimestre do primeiro ano disponível
  // Período B = mesmo trimestre do ano seguinte (ou últimos 3 meses)
  const rots25 = rots.filter(r=>r.endsWith('/25'));
  const rots26 = rots.filter(r=>r.endsWith('/26'));
  const defAS = rots25[0] || rots[0];
  const defAE = rots25[2] || rots25[rots25.length-1] || rots[mid-1] || rots[0];
  const defBS = rots26[0] || (rots[mid]||rots[0]);
  const defBE = rots26[2] || rots26[rots26.length-1] || rots[rots.length-1];
  const dAS=S.p2aS&&rots.includes(S.p2aS)?S.p2aS:defAS;
  const dAE=S.p2aE&&rots.includes(S.p2aE)?S.p2aE:defAE;
  const dBS=S.p2bS&&rots.includes(S.p2bS)?S.p2bS:defBS;
  const dBE=S.p2bE&&rots.includes(S.p2bE)?S.p2bE:defBE;
  // Salva no estado
  S.p2aS=dAS;S.p2aE=dAE;S.p2bS=dBS;S.p2bE=dBE;
  const mkOpts=(sel)=>rots.map(r=>`<option value="${r}" ${r===sel?'selected':''}>${r}</option>`).join('');
  fp.innerHTML=`<div class="toolbar">
    <div class="tg"><label>Período A — Início</label><select id="aS" onchange="onP2Change()">${mkOpts(dAS)}</select></div>
    <div class="tg"><label>Período A — Fim</label><select id="aE" onchange="onP2Change()">${mkOpts(dAE)}</select></div>
    <div class="tg" style="align-self:flex-end;padding-bottom:6px;font-weight:800;color:var(--muted)">vs</div>
    <div class="tg"><label>Período B — Início</label><select id="bS" onchange="onP2Change()">${mkOpts(dBS)}</select></div>
    <div class="tg"><label>Período B — Fim</label><select id="bE" onchange="onP2Change()">${mkOpts(dBE)}</select></div>
    <div class="tg"><label>Atalho</label><div class="qbtns">
      <button class="qbtn" onclick="preset('q1')">Q1 25 vs Q1 26</button>
      <button class="qbtn" onclick="preset('sem1')">1º Sem 25 vs 26</button>
      <button class="qbtn" onclick="preset('ano')">2025 vs 2026</button>
    </div></div>
  </div><div id="p2body"><div class="loading">Calculando...</div></div>`;
  calcP2(dados,dAS,dAE,dBS,dBE);
}

function calcP2(dados,aS,aE,bS,bE){

// MÓDULO DRE
// ============================================================
let ARQ_DRE={
  operacional:['DREjan25.csv','DREfev25.csv','DREmar25.csv','DREabr25.csv','DREmai25.csv','DREjun25.csv','DREjul25.csv','DREago25.csv','DREset25.csv','DREout25.csv','DREnov25.csv','DREdez25.csv','DREjan26.csv','DREfev26.csv','DREmar26.csv','DREabr26.csv'],
};
const BASE_DRE='https://raw.githubusercontent.com/elder901/controladoria-es/main';

function rotDRE(arq){
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const lower=arq.toLowerCase().replace('.csv','');
  for(const mes of meses){
    const idx=lower.indexOf(mes);
    if(idx>=0){
      const ano=lower.slice(idx+3,idx+5);
      if(ano.length===2&&!isNaN(ano))return mes+'/'+ano;
    }
  }
  return arq;
}

async function loadDRE(arq){
  const k='dre/'+arq;
  if(S.cache[k])return S.cache[k];
  try{
    const r=await fetch(`${BASE_DRE}/data/dre/${encodeURIComponent(arq)}`);
    if(!r.ok)return null;
    const buf=await r.arrayBuffer();
    let txt;
    try{txt=new TextDecoder('utf-8').decode(buf);}catch(e){txt=new TextDecoder('latin-1').decode(buf);}
    const d=parseDRE(txt,arq);
    S.cache[k]=d;return d;
  }catch(e){return null;}
}

function parseDRE(txt,arq){
  const lines=txt.split(/\r?\n/);
  const d={rot:rotDRE(arq),arq};
  // Extrai período
  if(lines[1]){const m=lines[1].match(/Per[^:]*:([^;]+)/);if(m)d.periodo=m[1].trim();}
  // Extrai ano/mês anteriores para comparação
  if(lines[3]){
    const p=lines[3].split(';');
    d.rotAnoAnt=p[2]?.trim()||'';
    d.rotPerAnt=p[4]?.trim()||'';
  }
  // Leitura por posição de linha
  // Para cada empresa: col 6=Tejotão atual, col 10=Varejo, col 12=Sena, col 14=Empresa
  // col 2=Ano anterior, col 4=Período anterior
  const LIN={
    4:'recBruta', 5:'abatimentos', 6:'recBrutaEfetiva', 8:'impostos', 9:'devolucoes',
    10:'recLiq', 11:'cmvTotal', 12:'cmv', 13:'cmvDevol', 14:'margemVenda',
    15:'despVariaveis', 16:'despVendas', 17:'despFinanceiras', 18:'perdasMerc',
    19:'faltaMerc', 20:'sobraMerc', 21:'perdasTotal',
    22:'margemContrib', 23:'despFixas',
    24:'despPessoalLoja', 25:'despPessoalAdm', 26:'despTrib', 27:'despUtilidades',
    28:'despManutencao', 29:'despTI', 30:'despHonorarios', 31:'despMaterial',
    32:'despMarketing', 33:'despVeiculos', 34:'alugueis', 35:'despGerais',
    36:'outrasReceitas', 37:'bonificacao',
    38:'despOperacionais', 40:'ebitda', 41:'depreciacao', 42:'ebit',
    43:'resFinanceiro', 44:'resPeriodo', 45:'irpj', 46:'resLiquido',
    48:'despNaoOp', 49:'proLabore1', 50:'proLabore2', 51:'proLabore3',
    53:'proLaboreEmp', 58:'alugueisHolding',
    59:'resLucroLiq', 60:'emprestimos', 61:'resAposEmp',
  };
  // Função para pegar valor de uma coluna específica
  const getVal=(linha,col)=>{
    if(!linha)return 0;
    const p=linha.split(';');
    if(p.length<=col)return 0;
    return parseMoeda(p[col]);
  };
  // Para cada linha, pega os 4 valores de empresa
  for(const [idx,campo] of Object.entries(LIN)){
    const l=lines[+idx];if(!l)continue;
    d[campo+'_tej']=getVal(l,6);   // Tejotão/Varejo atual
    d[campo+'_sena']=getVal(l,12); // Sena atual
    d[campo+'_emp']=getVal(l,14);  // Empresa (consolidado real)
    d[campo+'_ant']=getVal(l,2);   // Ano anterior
    d[campo+'_per']=getVal(l,4);   // Período anterior
  }
  return d;
}

async function getDadosDRE(){
  const lista=ARQ_DRE.operacional;
  const d=await Promise.all(lista.map(a=>loadDRE(a)));
  return d.filter(Boolean);
}

function getCampoEmp(suf){
  // Retorna sufixo da coluna conforme empresa selecionada
  if(S.emp==='holding')return '_sena';
  if(S.emp==='consolidado')return '_emp';
  return '_tej';
}

window.presetDRE=async function(t){
  const dados=applySimAluguel(await getDadosDRE());
  const rots=dados.map(d=>d.rot);
  const has=r=>rots.includes(r);
  const last26=rots.filter(r=>r.endsWith('/26')).slice(-1)[0]||'mar/26';
  const map={q1:['jan/25','mar/25','jan/26','mar/26'],sem1:['jan/25','jun/25','jan/26',last26],ano:['jan/25','dez/25','jan/26',last26]};
  const [aS,aE,bS,bE]=map[t];
  S.p2aS=has(aS)?aS:rots[0];S.p2aE=has(aE)?aE:rots[0];
  S.p2bS=has(bS)?bS:rots[0];S.p2bE=has(bE)?bE:rots[rots.length-1];
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&has(v))el.value=v;};
  set('aS',S.p2aS);set('aE',S.p2aE);set('bS',S.p2bS);set('bE',S.p2bE);
  calcDREP2(dados,S.p2aS,S.p2aE,S.p2bS,S.p2bE);
};

function calcDREP2(dados,aS,aE,bS,bE){

  if(!slA.length||!slB.length){body.innerHTML='<div class="errmsg">Selecione períodos válidos.</div>';return;}

    'margemContrib','despFixas',

    'despTI','despHonorarios','despMaterial','despMarketing','despVeiculos',
    'alugueis','despGerais','outrasReceitas','bonificacao','despOperacionais',
    'ebitda','depreciacao','ebit','resFinanceiro','resPeriodo','irpj','resLiquido',
    'despNaoOp','proLaboreEmp','alugueisHolding','resLucroLiq','emprestimos','resAposEmp'];

  let dreP2view=window.dreP2view||'main';
  const metAtual=dreP2view==='full'?EST_DRE_P2_FULL:EST_DRE_P2_MAIN;

  const linhas=metAtual.map(m=>{

function rotBP(arq){
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const lower=arq.toLowerCase().replace('.csv','');
  for(const mes of meses){
    const idx=lower.indexOf(mes);
    if(idx>=0){const ano=lower.slice(idx+3,idx+5);if(ano.length===2&&!isNaN(ano))return mes+'/'+ano;}
  }
  return arq;
}

async function loadBP(arq){
  const k='bp/'+arq;
  if(S.cache[k])return S.cache[k];
  try{
    const r=await fetch(`${BASE}/data/bp/${encodeURIComponent(arq)}`);
    if(!r.ok)return null;
    const buf=await r.arrayBuffer();
    let txt;try{txt=new TextDecoder('utf-8').decode(buf);}catch(e){txt=new TextDecoder('latin-1').decode(buf);}
    const d=parseBP(txt,arq);S.cache[k]=d;return d;
  }catch(e){return null;}
}

function parseBP(txt,arq){
  const lines=txt.split(/\r?\n/);
  const d={rot:rotBP(arq),arq};
  if(lines[2]){const m=lines[2].match(/Per[^:]*:([^;]+)/);if(m)d.periodo=m[1].trim();}
  const gv=(linha,col)=>{
    if(!linha)return 0;

  };
  const gi=(linha,col)=>{
    if(!linha)return 0;

    if(p.length<=col||!p[col].trim())return 0;
    return parseFloat(p[col].replace(',','.').trim())||0;

  // ATIVO — col 5 = atual, col 6 = anterior

  d.imobilizado=gv(lines[26],5);
  d.deposJudiciaisAnt=gv(lines[24],6);

async function getDadosIntel(){
  // Carrega os três módulos em paralelo para o mesmo conjunto de meses
  const meses=['jan25','fev25','mar25','abr25','mai25','jun25','jul25','ago25','set25','out25','nov25','dez25','jan26','fev26','mar26'];
  const fcArqs=ARQ.operacional;
  const dreArqs=ARQ_DRE.operacional;
  const bpArqs=ARQ_BP.operacional;

  const [fcDados, dreDados, bpDados] = await Promise.all([
    Promise.all(fcArqs.map(a=>loadCSV('operacional',a))),
    Promise.all(dreArqs.map(a=>loadDRE(a))),
    Promise.all(bpArqs.map(a=>loadBP(a))),
  ]);

  // Cruza por rótulo de mês
  const resultado=[];
  for(const fc of fcDados.filter(Boolean)){
    const dre=dreDados.find(d=>d&&d.rot===fc.rot);
    const bp=bpDados.find(d=>d&&d.rot===fc.rot);
    if(!dre||!bp)continue;

    // Encontrar BP do mês anterior para calcular variações
    const rotIdx=resultado.length;
    const bpAnt=rotIdx>0?resultado[rotIdx-1]?.bp:null;

    resultado.push({
      rot: fc.rot,
      fc, dre, bp,
      // Variações do BP (mês atual vs mês anterior no array)
      // Usa col6 do próprio BP (mês anterior) — mais confiável que comparar arrays
      dCaixa:    bp.caixaBancos   - (bp.caixaBancosAnt  ||bp.caixaBancos),
      dEstoque:  bp.estoques      - (bp.estoquesAnt     ||bp.estoques),
      dClientes: bp.contasReceber - (bp.contasReceberAnt||bp.contasReceber),
      dFornec:   bp.fornecedores  - (bp.fornecedoresAnt ||bp.fornecedores),
      dFinanc:   (bp.financiamentosPC+bp.financiamentosPNC) - ((bp.financiamentosPCAnt||bp.financiamentosPC)+(bp.financiamentoPNCAnt||bp.financiamentosPNC)),
      dPL:       bp.patrimonioLiq - (bp.patrimonioLiqAnt||bp.patrimonioLiq),
    });
  }
  return resultado;
}

  // Quando entrar CSV de balancete da Sena em data/bp/, basta virar este flag.
  const bpDisp = { tejotao:true, sena:false, consolidado:false };
  const consolEspelho = intelEmpSel==='consolidado' && !bpDisp.sena;
  const intelEmp = consolEspelho ? 'tejotao' : intelEmpSel;
  const suf_dados = intelEmp==='tejotao'?'_tej':intelEmp==='sena'?'_sena':'_emp';
  const suf_bp    = bpDisp[intelEmp] ? suf_dados : '_tej';
  const usandoBPTejotao = suf_bp !== suf_dados;
  const empLabel    = intelEmp==='tejotao'?'Tejotão':intelEmp==='sena'?'Sena':'Consolidado';
  const empLabelSel = intelEmpSel==='tejotao'?'Tejotão':intelEmpSel==='sena'?'Sena':'Consolidado';
  // Label da empresa cujos dados aparecem nos blocos que dependem de BP (bridge/ciclo/indicadores)
  const empLabelBP  = suf_bp==='_tej'?'Tejotão':suf_bp==='_sena'?'Sena':'Consolidado';

  const toolbar=`<div class="toolbar">
    <div class="tg"><label>Mês de análise</label>
      <select onchange="S.ini=this.value;renderIntelP1()">${opts}</select>
    </div>
    <div class="tg"><label>Empresa</label>
      <div class="btngrp">
        <button class="btn ${intelEmpSel==='tejotao'?'active':''}" onclick="window.intelEmp='tejotao';renderIntelP1()">Tejotão</button>
        <button class="btn ${intelEmpSel==='sena'?'active':''}" onclick="window.intelEmp='sena';renderIntelP1()">Sena</button>
        <button class="btn ${intelEmpSel==='consolidado'?'active':''}" onclick="window.intelEmp='consolidado';renderIntelP1()">Consolidado</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);align-self:flex-end;padding-bottom:6px">
      Cruzando: <strong>FC + DRE + BP</strong> · ${mes.rot}
    </div>
  </div>`;

  // Avisos visuais
  const bannerConsol = consolEspelho ? `<div style="margin-bottom:12px;padding:10px 14px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;font-size:12px;color:#9a3412">
    <strong>Consolidado temporariamente espelha apenas Tejotão</strong> — aguardando balancete da Sena. Quando o BP da Sena entrar em <code>data/bp/</code>, o Consolidado passa a somar de verdade automaticamente.
  </div>` : '';
  const badgeBP = (usandoBPTejotao && !consolEspelho) ? ` <span style="display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:10px;font-weight:700;vertical-align:middle">BP do Tejotão (Sena pendente)</span>` : '';

  // ============================================================
  // INTELIGÊNCIA P1 — Resolução de empresa (Tej / Sena / Consol)
  // ============================================================
  // (resolução já feita acima — suf_dados/suf_bp/intelEmp/empLabel)
  // Alias retrocompatível: blocos que misturam DRE+BP usam suf_bp para coerência contábil
  const suf_dre = suf_bp;

  // FC por empresa: Tejotão = operacional (fc); Sena = holding (hdMes); Consol = soma
  const hdTodos = await Promise.all(ARQ.holding.map(a=>loadCSV('holding',a)));
  const hdMes = hdTodos.filter(Boolean).find(d=>d.rot===mes.rot)||null;
  const fcTej = fc;
  const fcSena = hdMes;
  const getFC = (campo)=>{
    if(intelEmp==='tejotao') return fcTej?.[campo]||0;
    if(intelEmp==='sena')    return fcSena?.[campo]||0;
    return (fcTej?.[campo]||0)+(fcSena?.[campo]||0);
  };
  const fcAtivo = intelEmp==='tejotao'?fcTej:intelEmp==='sena'?fcSena:null;

  // Lucro líquido final (DRE econômica) e D&A (positivo na DRE = despesa)
  const lucro = dre['resLucroLiq'+suf_dre]||0;
  const da    = Math.abs(dre['depreciacao'+suf_dre]||0);

  // ============================================================
  // BRIDGE LUCRO → CAIXA — método indireto (DFC)
  // ============================================================
  // Convenção: valor + contribui para caixa, valor − consome caixa.
  // Ativo: ↑ = consome caixa (sinal invertido). Passivo: ↑ = libera caixa (sinal direto).

  // Operacional
  const deltaBP=(atual,ant)=> (atual||0) - (typeof ant==='number'?ant:(atual||0));
  const opLucro     = lucro;
  const opDA        = da;                    // não-caixa, sempre +
  const dTribRec    = deltaBP(bp.tribRecuperar,bp.tribRecuperarAnt);
  const dAplicFin   = deltaBP(bp.aplicFinanceiras,bp.aplicFinanceirasAnt);
  const dOutCred    = deltaBP(bp.outrosCreditos,bp.outrosCreditosAnt);
  const dDeposJud   = deltaBP(bp.deposJudiciais,bp.deposJudiciaisAnt);
  const opClientes  = -deltaBP(bp.contasReceber,bp.contasReceberAnt); // ↑clientes = preso a receber
  const opTribRec   = -dTribRec;
  const opOutCred   = -dOutCred;
  const opEstoque   = -deltaBP(bp.estoques,bp.estoquesAnt);           // ↑estoque  = comprou mais
  const opDeposJud  = -dDeposJud;
  const opFornec    =  deltaBP(bp.fornecedores,bp.fornecedoresAnt);   // ↑fornec   = financiou
  const dTitulos    =  deltaBP(bp.titulosPagar,bp.titulosPagarAnt);
  const dSalarios   =  deltaBP(bp.salariosPagar,bp.salariosPagarAnt);
  const dSociais    =  deltaBP(bp.obrigSociais,bp.obrigSociaisAnt);
  const dFiscais    =  deltaBP(bp.obrigFiscais,bp.obrigFiscaisAnt);
  const dOutrasObg  =  deltaBP(bp.outrasObrig,bp.outrasObrigAnt);
  const dProvSoc    =  deltaBP(bp.provisoesSociais,bp.provisoesSociaisAnt);
  const dProvFiscPC =  deltaBP(bp.provisoesFiscaisPC,bp.provisoesFiscaisPCAnt);
  const cOp = opLucro + opDA + opClientes + opTribRec + opOutCred + opEstoque + opDeposJud + opFornec + dTitulos + dSalarios + dSociais + dFiscais + dOutrasObg + dProvSoc + dProvFiscPC;

  // Investimento
  const dInvestimentos = deltaBP(bp.investimentos,bp.investimentosAnt);
  const dImobilizado   = deltaBP(bp.imobilizado,bp.imobilizadoAnt);
  const invAplicFin    = -dAplicFin;
  const invInvest      = -dInvestimentos;
  const invImob        = -(dImobilizado + da); // CAPEX estimado = Δimob líquido + D&A
  const cInv = invAplicFin + invInvest + invImob;

  // Financiamento
  const dFinancCP = deltaBP(bp.financiamentosPC,bp.financiamentosPCAnt);
  const dFinancLP = deltaBP(bp.financiamentosPNC,bp.financiamentoPNCAnt);
  const dProvFiscPNC = deltaBP(bp.provisoesFiscaisPNC,bp.provisoesFiscaisPNCAnt);
  // Movimentos diretos no PL que NÃO passam pela DRE do mês (dividendos pagos / aportes)
  // ΔPL = Lucro + Aportes − Distribuições  ⇒  Outros movimentos PL = ΔPL − Lucro
  const outrosPL   = deltaBP(bp.patrimonioLiq,bp.patrimonioLiqAnt) - lucro; // negativo = distribuição; positivo = aporte/ajuste
  const cFin = dFinancCP + dFinancLP + dProvFiscPNC + outrosPL;

  // Total e resíduo
  // Quando o bridge usa BP do Tejotão, o caixa de comparação também vem do Tejotão
  // (senão compararíamos fluxos de empresas diferentes e o resíduo abriria).
  const fcParaBridge = usandoBPTejotao ? fcTej : fcAtivo;
  const caixaReal     = (fcParaBridge?fcParaBridge.varCaixa||0:(fcTej?.varCaixa||0)+(fcSena?.varCaixa||0));
  const estimadoTotal = cOp + cInv + cFin;
  const residuo       = caixaReal - estimadoTotal;
  const refResid      = Math.max(Math.abs(caixaReal),Math.abs(lucro),1);
  const residPct      = Math.abs(residuo)/refResid*100;

  // ============================================================
  // SEÇÃO 1 — De onde veio o caixa do mês? (3 KPIs)
  // ============================================================
  const kpiCaixa=(label,val,nota,corBase)=>{
    const cor = val>=0?'#15803d':'#b91c1c';
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:14px;border-top:3px solid ${corBase}">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">${label}</div>
      <div style="font-size:22px;font-weight:700;color:${cor}">${fM(val)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5">${nota}</div>
    </div>`;
  };
  const destinoLucro=`<div class="section">
    <div class="shead"><h2>De onde veio o caixa do mês?</h2>
      <span class="legend">${mes.rot} · ${empLabelBP} · Variação real de caixa: <strong>${fM(caixaReal)}</strong>${badgeBP}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px">
      ${kpiCaixa('Caixa Operacional', cOp, cOp>0?'A operação se paga e gera sobra de caixa.':'A operação não está cobrindo o próprio capital de giro.', '#10b981')}
      ${kpiCaixa('Caixa de Investimento', cInv, cInv<0?'Investindo no negócio (CAPEX) — saudável quando há caixa operacional positivo.':cInv>0?'Desinvestiu (vendeu ativo) — entrou caixa.':'Sem movimento de imobilizado.', '#3b82f6')}
      ${kpiCaixa('Caixa de Financiamento', cFin, cFin>0?'Captou recursos (empréstimo ou aporte).':cFin<0?'Amortizou dívida ou distribuiu lucros — devolveu caixa.':'Sem movimento de financiamento.', '#f59e0b')}
    </div>
    <div style="font-size:12px;line-height:1.7;color:var(--ink);background:#f8fafc;border-radius:8px;padding:10px 14px">
      ${lucro>0?`✅ Lucro líquido de <strong>${fM(lucro)}</strong>. `:`⚠️ Prejuízo de <strong>${fM(lucro)}</strong>. `}
      ${cOp>=lucro*0.8?'A operação converteu bem o resultado em caixa. ':'O lucro não está virando caixa na mesma velocidade — capital de giro está consumindo o resultado. '}
      ${cInv<-50000?`Investiu <strong>${fM(Math.abs(cInv))}</strong> em imobilizado. `:''}
      ${outrosPL<-50000?`Distribuição de lucros estimada em <strong>${fM(Math.abs(outrosPL))}</strong>. `:outrosPL>50000?`Aporte/ajuste direto no PL de <strong>${fM(outrosPL)}</strong>. `:''}
    </div>
  </div>`;

  // ============================================================
  // SEÇÃO 2 — BRIDGE LUCRO → CAIXA (DFC indireta)
  // ============================================================
  const bBar=(label,val,nota)=>{
    const maxV=Math.max(Math.abs(lucro),Math.abs(caixaReal),1);
    const w=Math.min(Math.abs(val)/maxV*80+5,95).toFixed(0);
    const cor=val>=0?'#15803d':'#b91c1c';
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <div style="font-size:11px;min-width:240px;color:var(--ink)">${label}</div>
      <div style="flex:1;height:22px;background:#f1f5f9;border-radius:4px;overflow:hidden">
        <div style="height:22px;width:${w}%;background:${cor};border-radius:4px;display:flex;align-items:center;padding-left:6px">
          <span style="font-size:10px;font-weight:700;color:white;white-space:nowrap">${fM(val)}</span>
        </div>
      </div>
      ${nota?`<div style="font-size:10px;color:var(--muted);min-width:140px">${nota}</div>`:''}
    </div>`;
  };
  const sepLinha=`<div style="border-top:1.5px solid var(--line);margin:8px 0 6px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">`;

  const bridge=`<div class="section">
    <div class="shead"><h2>Bridge: Lucro → Caixa (DFC indireta)</h2>
      <span class="legend">${empLabelBP} · ${mes.rot}${badgeBP}</span>
    </div>
    <div style="font-size:11px;color:var(--muted);background:#f8fafc;border-radius:8px;padding:8px 12px;margin-bottom:12px">
      Convenção: valor (+) contribui para caixa · (−) consome caixa.
      Ativo ↑ = consome caixa · Passivo ↑ = libera caixa.
    </div>

    <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">
      Operacional
    </div>
    ${bBar('(+) Lucro Líquido Final (DRE)',opLucro,'ponto de partida')}
    ${bBar('(+) Depreciação / Amortização',opDA,'addback não-caixa')}
    ${bBar('(±) Δ Clientes',opClientes,opClientes>=0?'↓ clientes = recebeu':'↑ clientes = preso a receber')}
    ${bBar('(±) Δ Tributos a Recuperar',opTribRec,opTribRec>=0?'↓ créditos = liberou caixa':'↑ créditos = consumiu caixa')}
    ${bBar('(±) Δ Outros Créditos',opOutCred,opOutCred>=0?'↓ créditos = liberou caixa':'↑ créditos = consumiu caixa')}
    ${bBar('(±) Δ Estoques',opEstoque,opEstoque>=0?'↓ estoque = liberou':'↑ estoque = comprou mais')}
    ${bBar('(±) Δ Depósitos Judiciais',opDeposJud,'')}
    ${bBar('(±) Δ Fornecedores',opFornec,opFornec>=0?'↑ fornec = financiou':'↓ fornec = pagou')}
    ${bBar('(±) Δ Títulos a Pagar',dTitulos,'')}
    ${bBar('(±) Δ Salários a Pagar',dSalarios,'')}
    ${bBar('(±) Δ Obrigações Sociais',dSociais,'')}
    ${bBar('(±) Δ Obrigações Fiscais',dFiscais,'')}
    ${bBar('(±) Δ Outras Obrigações',dOutrasObg,'')}
    ${bBar('(±) Δ Provisões Sociais',dProvSoc,'')}
    ${bBar('(±) Δ Provisões Fiscais CP',dProvFiscPC,'')}
    ${sepLinha}<span>= Caixa Operacional</span><span class="${cOp>=0?'good':'bad'}" style="font-weight:700">${fM(cOp)}</span></div>

    <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px">
      Investimento
    </div>
    ${bBar('(±) Aplicações Financeiras',invAplicFin,invAplicFin>=0?'resgatou aplicação':'aplicou caixa')}
    ${bBar('(±) Δ Investimentos',invInvest,'')}
    ${bBar('(±) CAPEX imobilizado',invImob,'Δ imobilizado + D&A')}
    ${sepLinha}<span>= Caixa de Investimento</span><span class="${cInv>=0?'good':'bad'}" style="font-weight:700">${fM(cInv)}</span></div>

    <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px">
      Financiamento
    </div>
    ${bBar('(±) Δ Financiamentos CP',dFinancCP,dFinancCP>=0?'↑ tomou crédito':'↓ amortizou')}
    ${bBar('(±) Δ Financiamentos LP',dFinancLP,Math.abs(dFinancLP)>500000?'⚠️ possível reclass. LP→CP':'variação normal')}
    ${bBar('(±) Δ Provisões Fiscais LP',dProvFiscPNC,'')}
    ${bBar('(±) Outros movimentos do PL',outrosPL,outrosPL<0?'distribuição de lucros':outrosPL>0?'aporte / ajuste de PL':'sem movimento')}
    ${sepLinha}<span>= Caixa de Financiamento</span><span class="${cFin>=0?'good':'bad'}" style="font-weight:700">${fM(cFin)}</span></div>

    <div style="border-top:2px solid var(--ink);margin:12px 0 6px;display:flex;justify-content:space-between;font-size:13px;font-weight:700">
      <span>Total Estimado (Op + Inv + Fin)</span><span class="${estimadoTotal>=0?'good':'bad'}">${fM(estimadoTotal)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px">
      <span>Variação de Caixa Real (FC)</span><span class="${caixaReal>=0?'good':'bad'}">${fM(caixaReal)}</span>
    </div>

    <div style="margin-top:10px;padding:10px;border-radius:8px;background:${residPct<1?'#f0fdf4':residPct<5?'#fef9c3':'#fee2e2'};border:1px solid ${residPct<1?'#bbf7d0':residPct<5?'#fde68a':'#fecaca'}">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px">
        Resíduo não explicado: <span style="font-weight:700">${fM(residuo)}</span>
        <span style="color:var(--muted);font-weight:500"> · ${residPct.toFixed(2)}% do caixa do mês</span>
      </div>
      <div style="font-size:11px;color:var(--muted);line-height:1.6">
        ${residPct<1
          ? '✅ Bridge fechou com alta precisão (< 1%).'
          : residPct<5
          ? '⚠️ Pequena diferença — ajustes contábeis não-caixa (provisões, ajustes de fechamento).'
          : '⚠️ Diferença relevante — provável reclassificação contábil ou movimento de PL não capturado. Verificar.'}
      </div>
    </div>
  </div>`;

    // Cálculo do ciclo financeiro (necessário para cicloCard)
  const cmvMes     = Math.abs(dre['cmvTotal'+suf_dre]||0);
  const recBrutaMes= dre['recBruta'+suf_dre]||1;
  const estFin     = bp.estoques||0;
  const comprasMes = cmvMes;
  const pme  = estFin/(cmvMes/30);
  const pmr  = bp.contasReceber/(recBrutaMes/30);
  const pmp  = bp.fornecedores/((comprasMes>0?comprasMes:cmvMes)/30);
  const ciclo= pme+pmr-pmp;

  const cicloCard=`<div class="section">
    <div class="shead"><h2>Ciclo Financeiro</h2>
      <span class="legend">Quantos dias o dinheiro fica preso?${badgeBP}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      <div class="aitem">
        <div class="ak">PME — Estoque</div>
        <div class="av">${pme.toFixed(0)} dias</div>
        <div class="as">Tempo médio que o produto fica no estoque antes de ser vendido</div>
      </div>
      <div class="aitem">
        <div class="ak">PMR — Recebimento</div>
        <div class="av">${pmr.toFixed(0)} dias</div>
        <div class="as">Tempo médio para receber dos clientes após a venda</div>
      </div>
      <div class="aitem">
        <div class="ak">PMP — Pagamento</div>
        <div class="av">${pmp.toFixed(0)} dias</div>
        <div class="as">Tempo médio que a empresa leva para pagar fornecedores</div>
      </div>
      <div class="aitem">
        <div class="ak">Ciclo Financeiro</div>
        <div class="av ${ciclo>30?'bad':ciclo<0?'good':''}">${ciclo.toFixed(0)} dias</div>
        <div class="as">${ciclo<0?'✅ Negativo — fornecedores financiam o ciclo':ciclo<20?'✅ Ciclo curto e saudável':'⚠️ PME + PMR - PMP. Quanto menor, melhor.'}</div>
      </div>
    </div>
    <div style="background:#f8fafc;border-radius:10px;padding:12px;font-size:12px;line-height:1.8">
      <strong>Como ler:</strong> A empresa compra estoque → espera ${pme.toFixed(0)} dias para vender → aguarda ${pmr.toFixed(0)} dias para receber → total de <strong>${(pme+pmr).toFixed(0)} dias</strong> com capital empatado.
      Nesse período, os fornecedores financiam <strong>${pmp.toFixed(0)} dias</strong>. O saldo a financiar é de <strong>${ciclo.toFixed(0)} dias</strong>.
      ${ciclo<0?' Como o ciclo é negativo, os fornecedores estão, na prática, financiando o negócio — situação favorável.'
               :` Isso representa R$ ${fM(recBrutaMes/30*ciclo)} de capital de giro necessário.`}
    </div>
  </div>`;

  // 4. INDICADORES CRUZADOS
  const dívida=bp.financiamentosPC+bp.financiamentosPNC;
  const ebitdaAnual=(dre['ebitda'+suf_dre]||0)*12;
  const cobertura=(dre['ebitda'+suf_dre]||0)/(dre['despFinanceiras'+suf_dre]||1);
  const roe=((dre['resLucroLiq'+suf_dre]||0)/(bp.patrimonioLiq||1))*100;
  const roa=((dre['resLucroLiq'+suf_dre]||0)/(bp.totalAtivo||1))*100;
  const roic=((dre['ebitda'+suf_dre]||0)/((bp.totalAtivo||1)-(bp.pasCirculante||0)))*100;
  const divEbitda=ebitdaAnual>0?dívida/ebitdaAnual:0;

  const indicadores=`<div class="section">
    <div class="shead"><h2>Indicadores Cruzados</h2>
      <span class="legend">FC + DRE + BP combinados${badgeBP}</span>
    </div>
    <div class="analysis">
      <div class="aitem">
        <div class="ak">ROE — Retorno sobre PL</div>
        <div class="av ${roe<0?'bad':''}">${roe.toFixed(1)}%</div>
        <div class="as">Lucro / Patrimônio Líquido<br>${roe>10?'✅ Acima de 10% — bom retorno':roe>0?'⚠️ Positivo mas baixo':'❌ Retorno negativo'}</div>
      </div>
      <div class="aitem">
        <div class="ak">ROA — Retorno sobre Ativo</div>
        <div class="av ${roa<0?'bad':''}">${roa.toFixed(1)}%</div>
        <div class="as">Lucro / Total do Ativo<br>${roa>5?'✅ Ativo bem aproveitado':roa>0?'⚠️ Retorno baixo':'❌ Ativo gerando prejuízo'}</div>
      </div>
      <div class="aitem">
        <div class="ak">Dívida / EBITDA</div>
        <div class="av ${divEbitda>3?'bad':''}">${divEbitda.toFixed(1)}x</div>
        <div class="as">Anos de EBITDA para quitar dívidas<br>${divEbitda<2?'✅ Dívida controlada':divEbitda<4?'⚠️ Atenção ao endividamento':'❌ Endividamento elevado'}</div>
      </div>
      <div class="aitem">
        <div class="ak">Qualidade do Lucro</div>
        <div class="av ${cOp<lucro*0.3?'bad':''}">${(cOp/(lucro||1)*100).toFixed(0)}%</div>
        <div class="as">Caixa Operacional / Lucro líquido<br>${cOp>=lucro*0.5?'✅ Lucro se converte bem em caixa':'⚠️ Lucro não está virando caixa'}</div>
      </div>
    </div>
  </div>`;

  // Dados por empresa para os cards executivos (intelEmp/suf_dre/hdMes/fcTej/fcSena/fcAtivo já definidos no topo)

  // Lucro líquido DRE econômica — usa empresa selecionada (DRE pura, sem BP)
  const lucroLiqDRE = dre['resLucroLiq'+suf_dados]||0;

  // Resultado de caixa (FC)
  let resultCaixa = 0;
  if(intelEmp==='tejotao')       resultCaixa = fcTej.varCaixa||0;

function buildChartLinhaP3(sl, series){
  if(!series.length) return '<div class="loading">Selecione ao menos uma grandeza.</div>';
  const W=1100, H=380, padL=70, padR=20, padT=20, padB=50;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const n=sl.length;
  // Para múltiplas grandezas mistas (R$ e %), normalizamos cada série para [0,1] do próprio range,
  // mas se todas forem do mesmo formato, compartilham eixo.
  const fmts=[...new Set(series.map(s=>s.fmt))];
  const compartilhaEixo = fmts.length===1;
  let yMin, yMax;
  if(compartilhaEixo){
    const all=series.flatMap(s=>s.valores).filter(v=>v!=null&&isFinite(v));
    yMin=Math.min(0,...all); yMax=Math.max(...all);
    if(yMin===yMax){yMin-=1;yMax+=1;}
  }
  const xPos=i=> n<=1 ? padL+innerW/2 : padL + (i/(n-1))*innerW;
  const yPosShared=v=>{
    const r=yMax-yMin||1;
    return padT + innerH - ((v-yMin)/r)*innerH;
  };
  const yPosOwn=(v,s)=>{
    const vals=s.valores.filter(x=>x!=null&&isFinite(x));
    let mn=Math.min(0,...vals), mx=Math.max(...vals);
    if(mn===mx){mn-=1;mx+=1;}
    const r=mx-mn||1;
    return padT + innerH - ((v-mn)/r)*innerH;
  };
  const yPos=(v,s)=>compartilhaEixo?yPosShared(v):yPosOwn(v,s);

  // Grid + labels Y (apenas se eixo compartilhado)
  let gridY='';
  if(compartilhaEixo){
    const fmtTick=fmts[0]==='p'?(x=>x.toFixed(0)+'%'):(x=>{
      const abs=Math.abs(x);
      if(abs>=1e6) return 'R$ '+(x/1e6).toFixed(1)+'M';
      if(abs>=1e3) return 'R$ '+(x/1e3).toFixed(0)+'k';
      return 'R$ '+x.toFixed(0);
    });
    const ticks=5;
    for(let t=0;t<=ticks;t++){
      const v=yMin+(yMax-yMin)*(t/ticks);
      const y=yPosShared(v);
      gridY+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>
        <text x="${padL-8}" y="${y+4}" font-size="10" fill="#6b7280" text-anchor="end">${fmtTick(v)}</text>`;
    }
  }else{
    gridY+=`<text x="${padL}" y="${padT+10}" font-size="10" fill="#6b7280">eixo Y normalizado por série (formatos mistos)</text>`;
    // linha do zero (visualmente no meio)
    for(let t=0;t<=4;t++){
      const y=padT+(innerH/4)*t;
      gridY+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#f1f5f9" stroke-width="1"/>`;
    }
  }

  // Eixo X (datas)
  let labelsX='';
  const stepX=Math.max(1,Math.ceil(n/12));
  for(let i=0;i<n;i+=stepX){
    const x=xPos(i);
    labelsX+=`<text x="${x}" y="${H-padB+18}" font-size="10" fill="#6b7280" text-anchor="middle">${sl[i].rot}</text>
      <line x1="${x}" x2="${x}" y1="${padT}" y2="${H-padB}" stroke="#f8fafc" stroke-width="1"/>`;
  }

  // Linhas + pontos
  let plot='';
  series.forEach(s=>{
    const pts=s.valores.map((v,i)=>v==null||!isFinite(v)?null:`${xPos(i)},${yPos(v,s).toFixed(1)}`).filter(Boolean).join(' ');
    plot+=`<polyline points="${pts}" fill="none" stroke="${s.cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.valores.forEach((v,i)=>{
      if(v==null||!isFinite(v))return;
      const fmtV=s.fmt==='p'?(x=>fPS(x,1)+'%'):fM;
      plot+=`<circle cx="${xPos(i)}" cy="${yPos(v,s).toFixed(1)}" r="3.5" fill="#fff" stroke="${s.cor}" stroke-width="2">
        <title>${s.label} · ${sl[i].rot}: ${fmtV(v)}</title></circle>`;
    });
  });

  // Legenda
  const legenda=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#374151">
    <span style="width:14px;height:3px;background:${s.cor};display:inline-block;border-radius:2px"></span>${s.label}
  </span>`).join('');

  return `<div style="width:100%;overflow-x:auto">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:600px;height:auto;display:block">
      <rect x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="#fafafa" stroke="#e5e7eb"/>
      ${gridY}
      ${labelsX}
      ${plot}
    </svg>
    <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:8px;padding:8px">${legenda}</div>
  </div>`;
}

    const buf=await r.arrayBuffer();
    const txt=new TextDecoder('windows-1252').decode(buf);
    const d=parseBAL(txt,arq);S.cache[k]=d;return d;
  }catch(e){return null;}
}
function parseBAL(html,arq){
  const rows=[];
  const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  let trMatch;
  while((trMatch=trRe.exec(html))!==null){
    const cells=[];
    const tdRe=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi;
    let tdMatch;
    while((tdMatch=tdRe.exec(trMatch[1]))!==null){
      const v=/<div[^>]*>([\s\S]*?)<\/div>/i.exec(tdMatch[0]);
      cells.push(v?v[1].replace(/<[^>]+>/g,'').trim():'');
    }
    if(cells.length>4)rows.push(cells);
  }
  function pm(t){if(!t||!t.trim())return 0;try{return parseFloat(t.replace(/\./g,'').replace(',','.'));}catch(e){return 0;}}
  const contas=rows.filter(r=>r[0]&&r[0]>='0'&&r[0]<='9'&&r.length>8);
  return{rot:rotBAL(arq),arq,contas:contas.map(r=>({
    classif:r[0]||'',descricao:r[1]||'',conta:r[2]||'',tipo:r[3]||'',
    nivel:(r[0]||'').split('.').length,dbcr:r[9]||'',
    total:{si:pm(r[4]),deb:pm(r[6]),cred:pm(r[7]),sf:pm(r[8])},
    mg:{si:pm(r[10]),deb:pm(r[12]),cred:pm(r[13]),sf:pm(r[14])},
    mv:{si:pm(r[16]),deb:pm(r[18]),cred:pm(r[19]),sf:pm(r[20])},
    am:{si:pm(r[22]),deb:pm(r[24]),cred:pm(r[25]),sf:pm(r[26])},
    il:{si:pm(r[28]),deb:pm(r[30]),cred:pm(r[31]),sf:pm(r[32])},
    ind:{si:pm(r[34]),deb:pm(r[36]),cred:pm(r[37]),sf:pm(r[38])},
  }))};
}

async function calcularParams(){
  try{
    const[fcDados,dreDados,bpDados]=await Promise.all([
      Promise.all(ARQ.operacional.map(a=>loadCSV('operacional',a))),
      Promise.all(ARQ_DRE.operacional.map(a=>loadDRE(a))),
      Promise.all(ARQ_BP.operacional.map(a=>loadBP(a))),
    ]);
    const validos=fcDados.filter(Boolean).map(fc=>{
      const dre=dreDados.find(d=>d&&d.rot===fc.rot);
      const bp=bpDados.find(d=>d&&d.rot===fc.rot);
      if(!dre||!bp)return null;
      const rl=dre.recLiq_tej||0;if(!rl)return null;
      const rb=dre.recBruta_tej||rl;
      return{recLiq:rl,recBruta:rb,cmv:dre.cmvTotal_tej||0,
        despVar:dre.despVariaveis_tej||0,despFixas:dre.despFixas_tej||0,
        ebitda:dre.ebitda_tej||0,lucroFin:dre.resLucroLiq_tej||0,
        estoques:bp.estoques||0,clientes:bp.contasReceber||0,fornec:bp.fornecedores||0};
    }).filter(Boolean);
    if(!validos.length)return;
    const n=validos.length;const avg=k=>validos.reduce((s,d)=>s+(d[k]||0),0)/n;
    PARAMS={
      pctDeducoes:validos.reduce((s,d)=>s+(d.recBruta?((d.recBruta-d.recLiq)/d.recBruta*100):0),0)/n,
      pctCMV:validos.reduce((s,d)=>s+(d.recLiq?d.cmv/d.recLiq*100:0),0)/n,
      pctDespVar:validos.reduce((s,d)=>s+(d.recLiq?d.despVar/d.recLiq*100:0),0)/n,
      despFixasMes:avg('despFixas'),pctEbitda:validos.reduce((s,d)=>s+(d.recLiq?d.ebitda/d.recLiq*100:0),0)/n,
      pctLucroFin:validos.reduce((s,d)=>s+(d.recLiq?d.lucroFin/d.recLiq*100:0),0)/n,
      pme:validos.reduce((s,d)=>s+(d.cmv>0?d.estoques/(d.cmv/30):0),0)/n,
      pmr:validos.reduce((s,d)=>s+(d.recBruta>0?d.clientes/(d.recBruta/30):0),0)/n,
      pmp:validos.reduce((s,d)=>s+(d.cmv>0?d.fornec/(d.cmv/30):0),0)/n,
      recLiqMedMes:avg('recLiq'),
    };
  }catch(e){console.log('Usando parâmetros padrão',e);}
}

window.atualizarProjecao=function(){
  const base=parseFloat(document.getElementById('proj-base')?.value)||PARAMS.recLiqMedMes;
  const cresc=parseFloat(document.getElementById('proj-cresc')?.value)||0;
  const mesIni=document.getElementById('proj-mesini')?.value||'abr/26';
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const[mesStr,anoStr]=mesIni.split('/');
  let iMes=meses.indexOf(mesStr);let iAno=parseInt('20'+anoStr);
  let caixaAcum=0,rows='',totalRL=0,totalEB=0,totalLL=0,totalCX=0;
  for(let i=0;i<12;i++){
    const recLiq=base*Math.pow(1+cresc/100,i);
    const cmv=recLiq*PARAMS.pctCMV/100;
    const despVar=recLiq*PARAMS.pctDespVar/100;
    const ebitda=recLiq-cmv-despVar-PARAMS.despFixasMes;
    const lucro=ebitda*(PARAMS.pctLucroFin/PARAMS.pctEbitda||1);
    caixaAcum+=ebitda;totalRL+=recLiq;totalEB+=ebitda;totalLL+=lucro;totalCX+=ebitda;
    const rot=meses[iMes]+'/'+String(iAno).slice(2);
    iMes=(iMes+1)%12;if(iMes===0)iAno++;
    rows+=`<tr>
      <td style="font-weight:700;padding:7px 10px">${rot}</td>
      <td class="cv">${fM(recLiq)}</td><td class="cv">${fM(cmv)}</td>
      <td class="cv">${fM(recLiq-cmv-despVar)}</td><td class="cv">${fM(ebitda)}</td>
      <td class="cv ${ebitda>0?'good':'bad'}">${fPS(ebitda/recLiq*100,1)}%</td>
      <td class="cv ${lucro>0?'good':'bad'}">${fM(lucro)}</td>
      <td class="cv ${ebitda>0?'good':'bad'}">${fM(ebitda)}</td>
      <td class="cv ${caixaAcum>0?'good':'bad'}">${fM(caixaAcum)}</td>
    </tr>`;
  }
  document.getElementById('proj-resultado').innerHTML=`
    <div class="cards" style="margin-bottom:14px">
      ${[{t:'Receita Líquida Total',v:totalRL},{t:'EBITDA Total',v:totalEB},
         {t:'Lucro Líquido Total',v:totalLL},{t:'Caixa Total',v:totalCX}]
        .map(it=>`<div class="kcard" style="min-height:0;padding:12px">
          <h3>${it.t}</h3>
          <div class="kval" style="font-size:20px">${fM(it.v)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">Média: ${fM(it.v/12)}/mês</div>
        </div>`).join('')}
    </div>
    <div class="twrap"><table>
      <thead><tr>
        <th style="text-align:left">Mês</th><th>Rec. Líquida</th><th>CMV</th>
        <th>Marg.Contrib.</th><th>EBITDA</th><th>Margem%</th>
        <th>Lucro Liq.</th><th>Caixa Mês</th><th>Caixa Acum.</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
};

// ============================================================
// AUTO-DESCOBERTA DE ARQUIVOS via GitHub Contents API
// Sobrescreve as listas ARQ*/fallback hardcoded.
// Cache em localStorage por 10 min. Botão "Atualizar dados" no header.
// ============================================================
const GH_REPO='elder901/controladoria-es', GH_BRANCH='main';
const GH_TTL=10*60*1000;
const GH_MES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const GH_FONTES={
  operacional:{dir:'data/operacional',rx:/^FC ([a-z]{3}) (\d{4})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>+m[2], alvo:'ARQ', chave:'operacional'},
  holding:{dir:'data/holding',rx:/^S FC ([a-z]{3}) (\d{4})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>+m[2], alvo:'ARQ', chave:'holding'},
  dre:{dir:'data/dre',rx:/^DRE([a-z]{3})(\d{2})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>2000+ +m[2], alvo:'ARQ_DRE', chave:'operacional'},
  bp:{dir:'data/bp',rx:/^BP([a-z]{3})(\d{2})\.csv$/i,
    mes:m=>GH_MES[m[1].toLowerCase()], ano:m=>2000+ +m[2], alvo:'ARQ_BP', chave:'operacional'},
  bal:{dir:'data/balancete',rx:/^bal(\d{2}) ?(\d{2})\.html?$/i,
    mes:m=>+m[1], ano:m=>2000+ +m[2], alvo:'ARQ_BAL', chave:'tejotao'},
};
async function listarPastaGH(dir, force){
  const ck='gh:'+dir;
  if(!force){
    try{const hit=JSON.parse(localStorage.getItem(ck)||'null');
      if(hit && Date.now()-hit.t<GH_TTL) return hit.v;}catch(e){}
  }
  const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${dir}?ref=${GH_BRANCH}`);
  if(!r.ok) throw new Error(`GitHub API ${r.status} em ${dir}`);
  const v=await r.json();
  try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),v}));}catch(e){}
  return v;
}
async function descobrirARQ(force){
  const alvos={ARQ, ARQ_DRE, ARQ_BP, ARQ_BAL};
  let okGeral=true;
  for(const [k,f] of Object.entries(GH_FONTES)){
    try{
      const arquivos=await listarPastaGH(f.dir, force);
      const lista=arquivos
        .map(a=>{const m=a.name.match(f.rx); if(!m){console.warn('[GH] ignorado:',a.name);return null;}
          return {nome:a.name, ano:f.ano(m), mes:f.mes(m)};})
        .filter(Boolean)
        .sort((a,b)=>a.ano-b.ano||a.mes-b.mes)
        .map(x=>x.nome);
      if(lista.length){
        alvos[f.alvo][f.chave]=lista;
        console.log(`[GH] ${k}: ${lista.length} arquivos · último=${lista[lista.length-1]}`);
      } else { console.warn(`[GH] ${k}: 0 arquivos no padrão — mantendo fallback`); okGeral=false; }
    } catch(e){ console.error(`[GH] ${k} falhou:`,e.message,'— mantendo fallback'); okGeral=false; }
  }
  // limpa cache de dados se a lista mudou (força recarregar CSVs)
  if(force) S.cache={};
  return okGeral;
}
window.atualizarDados=async function(){
  // limpa cache do GitHub API
  Object.keys(localStorage).filter(k=>k.startsWith('gh:')).forEach(k=>localStorage.removeItem(k));
  S.cache={};
  const btn=document.getElementById('btnAtualizar');
  if(btn){btn.textContent='Atualizando...';btn.disabled=true;}
  await descobrirARQ(true);
  if(btn){btn.textContent='↻ Atualizar dados';btn.disabled=false;}
  if(typeof render==='function') render();
};
function injetarBotaoAtualizar(){
  const hdr=document.querySelector('.header');
  if(!hdr || document.getElementById('btnAtualizar')) return;
  const b=document.createElement('button');
  b.id='btnAtualizar'; b.className='btn'; b.textContent='↻ Atualizar dados';
  b.title='Re-lê as pastas data/* no GitHub e descarta cache';
  b.style.cssText='margin-left:auto';
  b.onclick=window.atualizarDados;
  hdr.appendChild(b);
}

document.addEventListener('DOMContentLoaded', async ()=>{
  document.getElementById('hinfo').textContent='v2.0 · '+new Date().toLocaleDateString('pt-BR');
  injetarBotaoAtualizar();
  try { await descobrirARQ(false); }
  catch(e){ console.error('[GH] auto-descoberta falhou globalmente — usando listas hardcoded:', e); }
  render();
});
